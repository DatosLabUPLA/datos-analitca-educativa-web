 mathematics teachers in an experiment carried out in a virtual class (due to the emergence of COVID-19) during 2020. They worked with a task on fractions in an online assessment system with questions with random parameters and infinite possible correct answers. This was followed by a discussion of the strategies and the justifications, arguments and validations of these strategies and other conjectures that emerged. This article analyzes this work from a qualitative approach using the Mathematical Working Space as a theoretical framework. The results show that the discussion work led the trainee teachers to find interpretations for the algorithms processed by the computer, enhancing epistemic discourse and argumentation in the context of the use of technological artifacts. In turn, the same discourses allowed the future teachers to instrumentalize the processes to be used in new tasks. © 2021 by the authors; licensee Modestum. All Rights Reserved.", "palabras_clave": ["digital technology", "mathematics education", "online teaching/learning strategies", "proof and discourse", "task design"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Profundización en el trabajo geométrico de futuros profesores en entornos tecnológicos y de lápiz y papel", "autores": ["Rivas C.H.", "Kuzniak A."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina", "KUZNIAK Alain"], "directores": [], "anio": 2021.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Académica Facultad de Ciencias Básicas", "Laboratoire de Didactique André Revuz (Mathematics and Physics Education)"], "pais": ["CL", "FR"], "doi": "10.1590/1980-4415v35n71a15", "enlace": "https://doi.org/10.1590/1980-4415V35N71A15", "resumen": "This article presents the results of a case study on the geometric work developed by prospective mathematics teachers. We first propose a geometrical task in a pencil-and-paper environment, and then its adaptation for a digital environment. The analyses are based on the framework of the Mathematical Work Space (MWS), which allows to focus on cognitive processes and epistemological aspects developed in the work. The findings show differences between the intended and the personal MWS of prospective mathematics teachers and the specific phases that they prioritize within the mathematical work. This research contributes to the enrichment of knowledge on geometric work thanks to a theoretical and methodological framework that allows an in-depth analysis of the mathematical work of individuals performing specific geometric tasks. © 2021 BOLEMA Departamento de Matematica. All rights reserved.", "palabras_clave": ["Artifacts", "Geometry", "Mathematical work space", "Prospective mathematics teachers", "Visualization"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "On forms of geometric work: a study with pre-service teachers based on the theory of Mathematical Working Spaces", "autores": ["Kuzniak A.", "Nechache A."], "autores_adretm": ["KUZNIAK Alain", "NECHACHE Assia"], "directores": [], "anio": 2021.0, "fuente": "Educational Studies in Mathematics", "institucion": ["LDAR (EA 4434)"], "pais": ["FR"], "doi": "10.1007/s10649-020-10011-2", "enlace": "https://doi.org/10.1007/s10649-020-10011-2", "resumen": "In this paper, we identify various forms of geometric work carried out by student teachers who were asked to perform a geometric task for the estimation of a land area. The theory of Mathematical Working Spaces is used to analyze and characterize the work produced. This study provides evidence that students developed forms of geometric work that are compliant with at least two distinct geometric paradigms, one characterized by the utilization of measuring and drawing tools and the other by a property-based discourse on proof. Significantly, a sizable number of students also developed work forms that do not correspond to any geometrical paradigm. A broader purpose of this paper is to highlight three criteria born by the theory and shown to be useful for the description and evaluation of geometric work: compliance, completeness, and correctness. © 2021, Springer Nature B.V.", "palabras_clave": ["Geometric work form", "Geometrical paradigms", "Geometry training", "Mathematical Working Spaces", "Teachers training", "control"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Algèbre élémentaire en première année universitaire. Comment remédier aux difficultés des étudiants ?", "autores": ["Philippe HOPPENOT"], "autores_adretm": ["HOPPENOT Philippe"], "directores": [], "anio": 2021.0, "fuente": "Recherches En Didactique Des Mathématiques, vol 41", "institucion": [], "pais": ["FR"], "doi": "", "enlace": "https://revue-rdm.com/2021/algebre-elementaire-en-premiere-annee-universitaire-comment-remedier-aux-difficultes-des-etudiants/", "resumen": "This article presents a study carried out in first year of university. It focuses on the difficulties of students in elementary algebra, attested by the results obtained during an evaluation test at the beginning of the academic year. A detailed study of the National Pedagogical Program allowed on the one hand to highlight the will of the institution to develop the capacities of \"modeling and problem solving\" and on the other hand to propose Mathematical Organizations describing all the concepts presented in this curriculum. Modeling and resolution of concrete situations were proposed to the students. The results showed that some students identified as very weak at the beginning of the year are abled proposed promising approaches.", "palabras_clave": ["elementary algebra in first year of university", "tool-object dialectic", "mathematical organization"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Sin indexación", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Una mirada al trabajo matemático de estudiantes en el dominio del análisis", "autores": ["Salazar, J. V. F.", "Vivas, J. L.", "Ticse, M. A"], "autores_adretm": ["FLORES SALAZAR Jesús", "TICSE AUCAHUASI Marco", "VIVAS PACHAS Jorge"], "directores": [], "anio": 2021.0, "fuente": "Revista Matemática, Ensino e Cultura,", "institucion": ["Universidade Federal de Minas Gerais", "Pontificia Universidad Católica del Perú"], "pais": ["BR", "PE"], "doi": "10.37084/rematec.1980-3141.2021.n.p262-276.id485", "enlace": "https://doi.org/10.37084/REMATEC.1980-3141.2021.n.p262-276.id485", "resumen": "El artículo analiza el trabajo matemático de estudiantes en el dominio del análisis mediante tareas sobre tasa de variación, derivada y función exponencial. Desde el Espacio de Trabajo Matemático (ETM), se evidencia su potencial para caracterizar procesos cognitivos y epistemológicos, así como el rol de los artefactos simbólicos y digitales en la producción matemática.", "palabras_clave": ["Trabajo matemático del estudiante", "Dominio del Análisis", "Artefacto"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Latindex, Sucupira, CrossRef, Copernicus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Análisis de la producción matemática de estudiantes de nivel secundario: Una mirada desde el Espacio de Trabajo Matemático", "autores": ["Ticse, M. A.", "Salazar, J. V. F."], "autores_adretm": ["FLORES SALAZAR Jesús", "TICSE AUCAHUASI Marco"], "directores": [], "anio": 2021.0, "fuente": "Quintaesencia", "institucion": ["Pontificia Universidad Católica del Perú"], "pais": ["PE"], "doi": "10.54943/rq.v12i1.21", "enlace": "https://doi.org/10.54943/rq.v12i1.21", "resumen": "Este estudio utiliza el Espacio de Trabajo Matemático (ETM) para analizar la producción matemática de estudiantes de secundaria en tareas sobre tasa de variación con GeoGebra. Los resultados evidencian que el ETM permite caracterizar la construcción progresiva del significado de la tasa de variación mediante la activación de génesis y planos del trabajo matemático.", "palabras_clave": ["Espacio de trabajo matemático", "tasa de variación", "GeoGebra"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Latindex,", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Análisis cualitativo de un aprendizaje estadístico temprano con la mirada de los espacios de trabajo matemático orientado por el ciclo investigativo", "autores": ["Vidal-Szabó P.", "Kuzniak A.", "Estrella S.", "Montoya E."], "autores_adretm": ["VIDAL-SZABÓ Pedro", "KUZNIAK Alain", "MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2020.0, "fuente": "Educacion Matematica", "institucion": ["Instituto de Matemáticas", "Département de Mathématiques"], "pais": ["CL", "FR"], "doi": "10.24844/em3202.09", "enlace": "https://doi.org/10.24844/EM3202.09", "resumen": "Research in early statistic requires attention to the progression of statistical learning, especially the ability of primary school students to create representations that involve data in real contexts. This qualitative research describes and characterizes a statistical lesson related to exploratory data analysis in the fourth grade of teaching. This lesson was designed and implemented, and data representations were collected that produced three students aged 9 to 10. From a global and local perspective, the lesson and its implications for the learning of these students are analyzed according to the stages of the research cycle and the genesis of the Statistical Mathematical Working Spaces. It is concluded that the lesson potentially generated a workspace that provided a statistical learning opportunity, allowing students to experience an approach to the procedures that a statistician uses to think and learn more in the sphere of context, reasoning and communicating their ideas with data-based empirical evidence. © 2020 Mexican Society for Research and Dissemination of Mathematics Education. All rights reserved.", "palabras_clave": ["Data representations in Context", "Exploratory Data Analysis", "Research Cycle", "Statistical Mathematical Working Spaces", "Statistical Thinking"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Análisis cualitativo de un aprendizaje estadístico temprano con la mirada de los espacios de trabajo matemático orientado por el ciclo investigativo", "autores": ["Vidal-Szabó P.", "Kuzniak A.", "Estrella S.", "Montoya E."], "autores_adretm": ["KUZNIAK Alain", "MONTOYA DELGADILLO Elizabeth", "VIDAL-SZABÓ Pedro"], "directores": [], "anio": 2020.0, "fuente": "Educación Matemática", "institucion": ["Pontificia Universidad Católica de Valparaíso", "Université Paris Cité", "Laboratoire de Mathématiques d'Orsay", "Pontificia Universidad Católica de Chile"], "pais": ["CL", "FR"], "doi": "10.24844/em3202.09", "enlace": "https://doi.org/10.24844/em3202.09", "resumen": "Research in early statistic requires attention to the progression of statistical learning, especially the ability of primary school students to create representations that involve data in real contexts.This qualitative research describes and characterizes a statistical lesson related to exploratory data analysis in the fourth grade of teaching.This lesson was designed and implemented, and data representations were collected that produced three students aged 9 to 10. From a global and local perspective, the lesson and its implications for the learning of these students are analyzed according to the stages of the research cycle and the genesis of the Statistical Mathematical Working Spaces.It is concluded that the lesson potentially generated a workspace that provided a statistical learning opportunity, allowing students to experience an approach to the procedures that a statistician uses to think and learn more in the sphere of context, reasoning and communicating their ideas with data-based empirical evidence.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Dynamique du travail mathématique en classe entre un enseignant et des groupes d’élèves sur la simulation en probabilités : une étude de cas", "autores": ["Masselin B."], "autores_adretm": ["MASSELIN Blandine"], "directores": [], "anio": 2020.0, "fuente": "Annales de didactique et de sciences cognitives", "institucion": ["Université Paris Cité", "LDAR", "Agence de l'Eau Seine Normandie"], "pais": ["FR"], "doi": "10.4000/adsc.529", "enlace": "https://doi.org/10.4000/adsc.529", "resumen": "The purpose of this contribution is to characterize the work of a teacher on simulations in probability in grade 9 course in France (14-15 year-old students). In a case study, we report in particular on what is at stake in the solving of a probability task with simulations when the teacher decides to organize small group work. Methodological tools, such as the chronogram, related to the specificity of this type of work in class are defined in the article. We have used the theory of Mathematical Work Spaces (MWS) and concepts such as potential suitable MWS and actual suitable MWS have been defined to conduct our study. The analysis of the teacher's interventions in the classroom revealed a standardization of the probabilistic model produced by the teacher during the simulation. The role of the teacher and the choice of the digital artefact transformed the students' work. We matched blockages, rebounds or identified containments in the actual MWS with the potential MWS. Our research has clarified first cognitive task routes in probability on The Hare and the Tortoise game.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Un posible enfoque de complementariedad entre espacios de trabajo matemático y modelización", "autores": ["Verdugo-Hernández P."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2020.0, "fuente": "Revista UCMaule", "institucion": ["Universidad Adventista de Chile"], "pais": ["CL"], "doi": "10.29035/ucmaule.59.12", "enlace": "https://doi.org/10.29035/ucmaule.59.12", "resumen": "This article presents a study on a possible complementarity between Mathematical Working Spaces (MWS) and Blomhøj's modeling approach. From a theoretical perspective that provides foundations to connect theories in mathematics education, it intends to extend the discussion on the scope of complementarity and illustrates it by a well-known example proposed by Blomhøj. The main result shows that both theoretical frameworks would complement each other even in the epistemological dimension, characteristic that would distinguish the Blomhøj cycle from others that mainly emphasize the cognitive dimension of modeling. This aspect would enrich the analysis of this type of tasks, expanding the articulation between both theoretical frameworks, a question that, as far as it knows, has not been done so far.", "palabras_clave": ["Complementarity (molecular biology)"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Resoluciones De Una Tarea De Cálculo Por Parte De Profesores De Matemáticas. ¿Cuáles Son Los Argumentos Que Ellos Validan Tanto En Su Trabajo Personal Como En El Aula?", "autores": ["Menares R."], "autores_adretm": ["MENARES Romina"], "directores": [], "anio": 2020.0, "fuente": "Paulo Freire Revista de Pedagogía Crítica", "institucion": ["Universidad de Valparaíso"], "pais": ["CL"], "doi": "10.25074/07195532.23.1658", "enlace": "https://doi.org/10.25074/07195532.23.1658", "resumen": "En este artículo presentamos diferentes maneras de enfrentar un problema de cálculo por parte de profesores de secundaria en ejercicio en el sistema escolar chileno. Nuestro objetivo es indagar en procesos de visualización, distintos instrumentos utilizados y argumentos que profesores despliegan al resolver o dar respuesta a un problema. Además, buscamos conocer cuáles son los argumentos que los profesores validan dentro del desarrollo de problemas que demandan procesos argumentativos, tanto en su propio trabajo con el problema, como el posible trabajo en el aula. La investigación es cualitativa y se realiza bajo la perspectiva teórica de los Espacios de Trabajo Matemático (ETM). El estudio nos permite evidenciar diferentes recursos utilizados por los profesores para la resolución del problema, reconocer los discursos matemáticamente aceptados por los docentes, y observar qué significa para el grupo de profesores la justificación de un conocimiento matemático.&#x0D; Palabras clave: Espacio de Trabajo Matemático, visualización, argumentación, profesores de secundaria.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Implication dans un enseignement renouvelé et recherches en didactique des mathématiques", "autores": ["Kuzniak A.", "Rauscher J."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2020.0, "fuente": "Annales de didactique et de sciences cognitives", "institucion": ["Université Paris Cité"], "pais": ["FR"], "doi": "10.4000/adsc.582", "enlace": "https://doi.org/10.4000/adsc.582", "resumen": "François Pluvinage did not associate his name with a didactic theory, but more profoundly he animated with his powerful and friendly breath a school of thought, a way of doing and acting always open to the world and the future. Through this article, which is very incomplete, we would like to specify his originality as a researcher particularly involved in the community. Throughout this evocation of his scientific career in phase with the evolution of educational practices, the reader will be invited to rediscover some of the traits of his rich and endearing personality.", "palabras_clave": ["Evocation|Tribute"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Formadores de didáctica de las ciencias experimentales y matemática: El self-study colaborativo interinstitucional como motor de transformación de la docencia universitaria", "autores": ["Mario Vanegas Ortega C.", "Martínez-Galaz C.", "Henríquez-Rivas C.", "Hernández C."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2020.0, "fuente": "Revista Iberoamericana de Educación", "institucion": ["Universidad de Santiago de Chile", "Universidad de Talca"], "pais": ["CL"], "doi": "10.35362/rie8213684", "enlace": "https://doi.org/10.35362/rie8213684", "resumen": "En el marco de los desafíos profesionales que plantea hoy la docencia universitaria, en este artículo caracterizamos los procesos reflexivos que vivenciamos didactas de las ciencias experimentales y de la matemática, cuando desarrollamos un self-study colaborativo interinstitucional. Para ello, hemos adaptado el ciclo deweyniano según dos procesos reflexivos: el primero, de autoconfrontación con los que ocurre en nuestras clases universitarias y lo que plantean los estudiantes mediante ticket de salida, y el segundo, de resignificación de la docencia universitaria con los amigos críticos. Los resultados muestran que cada didacta experimentó distintos procesos de reflexión en cuanto a las dimensiones relacionadas con los estudiantes, el contexto, la didáctica específica y la profesionalidad; además, demostramos que el conocimiento didáctico permite la configuración de procesos reflexivos e identitarios diferenciadores que resultan claves en la comprensión y resignificación de las prácticas pedagógicas.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Paradigmas Geométricos En El Trabajo Matemático De Docentes En Formación Continua", "autores": ["Victoria Flores Salazar J.", "Julissa García-Cuéllar D."], "autores_adretm": ["GARCÍA CUELLAR Daysi", "FLORES SALAZAR Jesús"], "directores": [], "anio": 2020.0, "fuente": "PLURAIS - Revista Multidisciplinar", "institucion": ["Pontificia Universidad Católica del Perú"], "pais": ["PE"], "doi": "10.29378/plurais.2447-9373.2020.v5.n2.58-77", "enlace": "https://doi.org/10.29378/plurais.2447-9373.2020.v5.n2.58-77", "resumen": "El presente artículo, evidencia algunos resultados de una investigación de corte cualitativo realizada en una formación continua de profesores en el dominio de la Geometría. La formación se realizó en dos encuentros y participaron ocho estudiantes de posgrado que son docentes peruanos de Educación Básica Regular - nivel secundario. Para este escrito se analiza el trabajo matemático de dos docentes en dos tareas realizadas en el primer encuentro. Como referencial teórico utilizamos aspectos de Espacio de Trabajo Matemático (ETM), especialmente para identificar los paradigmas de la Geometría. En cuanto a los resultados se observó que los docentes resolvieron las tareas en los paradigmas GI y GII del ETM.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Issues and Challenges in Instrumental Proof", "autores": ["R. Richard P.", "Venant F.", "Gagnon M."], "autores_adretm": ["RICHARD Philippe R.", "VENANT Fabienne"], "directores": [], "anio": 2019.0, "fuente": "Mathematics education in the digital era", "institucion": ["Université de Montréal", "Université du Quebec à Montréal", "Polytechnique Montréal"], "pais": ["CA"], "doi": "10.1007/978-3-030-28483-1_7", "enlace": "https://doi.org/10.1007/978-3-030-28483-1_7", "resumen": "", "palabras_clave": ["Proof of concept"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Una mirada al trabajo documental de un profesor de primaria al seleccionar recursos para enseñar geometría", "autores": ["Rodríguez M.S.", "Rock A.I.S."], "autores_adretm": [], "directores": [], "anio": 2019.0, "fuente": "Educacion Matematica", "institucion": ["Departamento de Matemática Educativa"], "pais": ["MX"], "doi": "10.24844/em3103.01", "enlace": "https://doi.org/10.24844/EM3103.01", "resumen": "In this paper, we study the selection process of resources for teaching geometry, of a 5th Grade primary-school teacher in Colombia. For that, we use some concepts from the Documentational Approach to Didactics (DAD), such as \"resource system\" and \"scheme\"; and from the Mathematical Work Space (MWS) theory, the \"geometrical paradigms\" defined by Kuzniak and colleagues. We analyze the teacher's documentational work, and by using the reflective investigation methodology, we study the evolution of this teacher's resource system for teaching geometry through his production of representations or maps of his selection process. As a main research finding, we were able to infer the teacher's scheme underlying his selection of (digital or non-digital) resources for teaching geometric transformations, and identify some operational invariants or criteria involved in that scheme, derived from his professional knowledge. We conclude that the knowledge is diverse and involves several aspects related to: mathematical content, curriculum, resource affordances, cognitive and ergonomic aspects. © 2019 Mexican Society for Research and Dissemination of Mathematics Education. All rights reserved.", "palabras_clave": ["Documentational Approach to Didactics", "Geometry teaching", "Primary school level", "Reflective investigation", "Resource selection"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Espacio de Trabajo Matemático Personal de profesores en relación a la función definida por tramos", "autores": ["Victoria Flores Salazar J.", "Carrillo F."], "autores_adretm": ["FLORES SALAZAR Jesús", "CARRILLO Flor"], "directores": [], "anio": 2019.0, "fuente": "UNIPLURIVERSIDAD", "institucion": ["Pontificia Universidad Católica del Perú"], "pais": ["PE"], "doi": "10.17533/udea.unipluri.19.2.08", "enlace": "https://doi.org/10.17533/udea.unipluri.19.2.08", "resumen": "El presente artículo es parte de una investigación que tiene como objetivo analizar el trabajo matemático personal de profesores y determinar cómo se activan las génesis semiótica, instrumental y discursiva en docentes de matemática en relación a la función por tramos. El estudio se realizó con diez profesores de matemática en un seminario-taller en Lima-Perú. Como base se utilizan aspectos teóricos y metodológicos de los Espacio de Trabajo Matemático- ETM. Como conclusiones, se evidencia en el trabajo matemático de los profesores, la activación de las génesis semiótica, instrumental y discursiva y; la activación de los planos semiótico-instrumental [Sem-Ins] e instrumental-discursivo [Ins-Dis].", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Conclusion: Prospects for Developments and Research in Secondary Geometry Education", "autores": ["Herbst P.", "Hock Cheah U.", "Jones K.", "R. Richard P."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2018.0, "fuente": "ICME-13 monographs", "institucion": ["University of Michigan", "University of Southampton", "Université de Montréal"], "pais": ["US", "GB", "CA"], "doi": "10.1007/978-3-319-77476-3_21", "enlace": "https://doi.org/10.1007/978-3-319-77476-3_21", "resumen": "", "palabras_clave": ["Ask price"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Improving QED-Tutrix by Automating the Generation of Proofs", "autores": ["Font L.", "R. Richard P.", "Gagnon M."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2018.0, "fuente": "arXiv (Cornell University)", "institucion": ["Polytechnique Montréal", "Université de Montréal"], "pais": ["CA"], "doi": "10.4204/eptcs.267.3", "enlace": "https://doi.org/10.4204/eptcs.267.3", "resumen": "The idea of assisting teachers with technological tools is not new. Mathematics in general, and geometry in particular, provide interesting challenges when developing educative softwares, both in the education and computer science aspects. QED-Tutrix is an intelligent tutor for geometry offering an interface to help high school students in the resolution of demonstration problems. It focuses on specific goals: 1) to allow the student to freely explore the problem and its figure, 2) to accept proofs elements in any order, 3) to handle a variety of proofs, which can be customized by the teacher, and 4) to be able to help the student at any step of the resolution of the problem, if the need arises. The software is also independent from the intervention of the teacher. QED-Tutrix offers an interesting approach to geometry education, but is currently crippled by the lengthiness of the process of implementing new problems, a task that must still be done manually. Therefore, one of the main focuses of the QED-Tutrix' research team is to ease the implementation of new problems, by automating the tedious step of finding all possible proofs for a given problem. This automation must follow fundamental constraints in order to create problems compatible with QED-Tutrix: 1) readability of the proofs, 2) accessibility at a high school level, and 3) possibility for the teacher to modify the parameters defining the \"acceptability\" of a proof. We present in this paper the result of our preliminary exploration of possible avenues for this task. Automated theorem proving in geometry is a widely studied subject, and various provers exist. However, our constraints are quite specific and some adaptation would be required to use an existing prover. We have therefore implemented a prototype of automated prover to suit our needs. The future goal is to compare performances and usability in our specific use-case between the existing provers and our implementation.", "palabras_clave": ["TUTOR"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "From geometrical thinking to geometrical working competencies", "autores": ["Kuzniak A.", "R. Richard P.", "Michael–Chrysanthou P."], "autores_adretm": ["RICHARD Philippe R.", "KUZNIAK Alain"], "directores": [], "anio": 2018.0, "fuente": "Routledge eBooks", "institucion": ["Université de Montréal", "Université Paris Cité"], "pais": ["FR", "CA"], "doi": "10.4324/9781315113562-2", "enlace": "https://doi.org/10.4324/9781315113562-2", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Influencia de un Proceso de Formación de Profesores en el Sistema de Enseñanza del Concepto de Área en Estudiantes de Pedagogía en Matemáticas, un Estudio de Caso", "autores": ["Morales H."], "autores_adretm": [], "directores": [], "anio": 2018.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Université de Montréal", "Universidad Católica de la Santísima Concepción"], "pais": ["CA", "CL"], "doi": "10.1590/1980-4415v32n62a15", "enlace": "https://doi.org/10.1590/1980-4415v32n62a15", "resumen": "In the process of training middle schoolmathematicsteachers, which takes place at the Universidad Católica de la Santísima Concepción (UCSC), in the city of Concepción, Chile, we have been interested in observing the process of modifying the mathematics teaching system on a student, from the beginning in a geometry didactics course, until the practicum in a school. To account for the effects of this modification, a classroom management model based on the Theory of Didactic Situations was proposed, which allowed us to plan a geometry class to teach the area concept of a quadrilateral. To accountfor the teaching work carried out by the student in two exclusive moments; in the university classroom to their classmates in the role ofaschool student, and in the school when the same student as a teacher teaches real students. The teaching process carried out by the student was observed and contrasted with theoretical elements of the Mathematical Work Space (MWS). © 2018 BOLEMA Departamento de Matematica. All rights reserved.", "palabras_clave": ["Area of a quadrilateral", "Classroom management", "Fibration", "Mathematical work space", "Teacher training"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Thinking About the Teaching of Geometry Through the Lens of the Theory of Geometric Working Spaces", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2018.0, "fuente": "ICME-13 monographs", "institucion": ["Université Paris Cité", "LDAR"], "pais": ["FR"], "doi": "10.1007/978-3-319-77476-3_2", "enlace": "https://doi.org/10.1007/978-3-319-77476-3_2", "resumen": "", "palabras_clave": ["Geometric Modeling"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "libro", "titulo": "Invited Lectures from the 13th International Congress on Mathematical Education", "autores": ["Kaiser G.", "Forgasz H.", "Graven M.", "Kuzniak A.", "Simmt E.", "Xu B."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2018.0, "fuente": "ICME-13 monographs", "institucion": ["Universität Hamburg", "Monash University", "Rhodes University", "Université Paris Cité", "University of Alberta", "Emissions Reduction Alberta", "East China Normal University"], "pais": ["DE", "AU", "ZA", "FR", "CA", "CN"], "doi": "10.1007/978-3-319-72170-5", "enlace": "https://doi.org/10.1007/978-3-319-72170-5", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "La catégorisation des tâches et du travailleur-sujet : un outil méthodologique pour l’étude du travail mathématique dans le domaine des probabilités", "autores": ["Nechache A."], "autores_adretm": ["NECHACHE Assia"], "directores": [], "anio": 2017.0, "fuente": "Annales de didactique et de sciences cognitives", "institucion": ["Université d'Orléans", "Université Paris Cité", "LDAR"], "pais": ["FR"], "doi": "10.4000/adsc.709", "enlace": "https://doi.org/10.4000/adsc.709", "resumen": "The categorization of tasks and the worker-subject: a methodological tool for the study of mathematical work in the probability field This article focuses on the study of the mathematical work produced after the resolution of probabilistic tasks as well as the students’ role in the elaboration of this mathematical work. This led us to categorize mathematical tasks (simple, standard, rich) according to their level of epistemological and cognitive demand. This categorization is associated with students’ learning in the form of a worker-subject (jobber, technician, engineer). Using this categorization and the Mathematical Working Space (MWS) model, we analyzed the implementation of a probabilistic task in two tenth grade classes. This analysis of the two class sessions allowed us to characterize the transformations of the nature of the tasks by the teachers during its implementation. These transformations generate a decrease in the level of cognitive demand of the task and also in the students’ role in solving the task.", "palabras_clave": ["Elaboration"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Pensamiento aritmético-algebraico a través de un espacio de trabajo matemático en un ambiente de papel, lápiz y tecnología en la escuela secundaria", "autores": ["Cortés J.C.", "Hitt F.", "Saboya M."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["México. Profesor Investigador Tiempo Completo en la", "Departamento DeMatemáticas de la", "Departamento de Matemáticas de la"], "pais": ["FR", "CA"], "doi": "10.1590/1980-4415v30n54a12", "enlace": "https://doi.org/10.1590/1980-4415v30n54a12", "resumen": "In this paper, we want to address the problem of teaching algebra from the point of view of the theoretical framework of Mathematical Working Spaces (MWS). In our study, we carried out two experiments, one in Quebec and one in Mexico. In this research, we consider the visualization has started, once the individual communicates his ideas to others (or himself) and builds relationships between the elements involved, includingarticulations among representations. The evolution of these cognitive structures within a perspective of the processes of objectification, requires shared experiences in which we have designated as a teaching and collaborative learning, self-reflection and scientific debate (ACODESA) under the point of view of activity theory. Specifically, it investigates polygonal numbers (especially triangular numbers) in an environment of paper, pencil, and technology. Our interpretation of students' (14-15 year old) cognitive processes of a population at secondary school in Mexico, following the theoretical framework of the ETM. This interpretation focuses on a step towards a cognitive epistemological plane, where mathematical activity enables articulation among visualization processes, production processes, and arithmetico-algebraic validation providing a support precisely to an arithmetico-algebraic thinking.", "palabras_clave": ["ACODESA. mathematical working spaces. arithmetico-algebraic thinking"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The Mathematical work with the derivative of a function: Teachers' practices with the idea of \"generic", "autores": ["Panero M.", "Arzarello F.", "Sabena C."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["ENS de Lyon", "Dipartimento di Matematica G. Peano", "Dipartimento di Filosofia E Scienze Dell'Educazione"], "pais": ["FR", "IT"], "doi": "10.1590/1980-4415v30n54a13", "enlace": "https://doi.org/10.1590/1980-4415v30n54a13", "resumen": "This paper investigates the introduction of the derivative notion and, specifically, the introduction of the derivative function, as a significant moment in the development of mathematical work on functions. In particular, we analyse the process of genericization that two Italian teachers conducted with their grade 13 students, in order to make them shift from the derivative at a specific point x0 to the derivative as a global function in the x variable. Specifically, we analyse the role of the teacher in the semiotic genesis of this process and investigate the role of semiotic resources therein. As a result, we highlight the importance of conducting carefully this shift from the pointwise x0 sign to the global x sign, in order to gain an actual shift in the perceived properties of the derivative function, which depends on the x sign as a variable. In conclusion, we connect our findings to the model of the Mathematical Working Space of functions, with particular regard to the \"visualisation\" process and the semiotic axis.", "palabras_clave": ["Derivative function. generic. perspectives on functions. calculus"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Transitioning from \"it looks like\" to \"it has to be\" in geometrical workspaces: affect and near-to-me attention", "autores": ["Rodd M."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Institute of Education"], "pais": ["GB"], "doi": "10.1590/1980-4415v30n54a07", "enlace": "https://doi.org/10.1590/1980-4415v30n54a07", "resumen": "Within a practitioner researcher framework, this paper draws on a particular mathematics education theory and aspects of neuroscience to show that, from a learner's perspective, moving to a deductive reasoning style appropriate to basic Euclidean geometry, can be facilitated, or impeded, by emotion and/or directed attention. This shows that the issue of a person's deductive reasoning is not a merely cognitive one, but can involve affective aspects related to perception - particularly perception of nearby sense data - And emotion. The mathematics education theory that has been used is that of the Espace de Travail Mathématique, the English translation of which is known as Mathematical Working Spaces (MWS). The aspects of neuroscience that have been used pertain to the distinct processing streams known as top-down and bottom-up attention. The practitioner research perspective is aligned with Mason's teaching-practice-based 'noticing'; qualitative data analysed in this report include individual interviews with school teachers on in-service courses and reflective notes from teaching. Basic Euclidean geometry is used as the medium for investigating transition from 'it looks like' to a reasoned 'it has to be'.", "palabras_clave": ["School geometry. mathematical working spaces. top-down attention. affect. practitioner research"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Génesis semiótica de los enteros", "autores": ["Pluvinage F.", "Flores P."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Centro de Investigación Y de Estudios Avanzados del", "Centro de Investigación Y de Estudios Avanzados del Instituto Politécnico Nacional"], "pais": ["MX"], "doi": "10.1590/1980-4415v30n54a06", "enlace": "https://doi.org/10.1590/1980-4415v30n54a06", "resumen": "The traditional presentation of the integers ring generates difficulties for learning the product with its well-known signs rule. Our working hypothesis is that the solely representation of the product of two natural numbers by the area of a rectangle can hinder the vision of the product of two integers. Referring us to the scheme of Mathematical Working Spaces, we need another representation for the semiotic genesis of the integers. We tested didactical resources coming out from a geometrical construction made by Descartes in his geometric supplement of the Discourse on the Method, but we observed that this geometric introduction of the product can also produce difficulties, because it does not easily illustrate the distributive law. We may explain this phenomenon considering the product of numbers as a procept. Thus, the homothetic transformations of the Cartesian plane constitute a convenient geometrical resource that we may propose for teaching of the integers and, more generally, the numbers with a sign.", "palabras_clave": ["2D geometry", "Dilation", "Distributive law", "Mathematical working spaces", "Multiplication of numbers", "Semiotic genesis", "Signs rule"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "El Papel del MTSK como modelo de conocimiento del profesor en las interrelaciones entre los espacios de trabajo matemático", "autores": ["Flores-Medrano E.", "Montes M.A.", "Carrillo J.", "Contreras L.C.", "Cinta Muñoz-Catalán M.", "Mar Liñán M."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Centro de Investigación Y de Estudios Avanzados (Cinvestav)", "Facultad de Ciencias de la Educación", "España. Facultad de Ciencias de la Educación", "Máster en Investigación en la Enseñanza Y El Aprendizaje de Las Ciencias Experimentales"], "pais": ["ES"], "doi": "10.1590/1980-4415v30n54a10", "enlace": "https://doi.org/10.1590/1980-4415v30n54a10", "resumen": "The teacher plays a crucial role in articulating Mathematical Working Spaces. The model of teacher knowledge, which is presented here (referred Mathematics Teacher's Specialized Knowledge), proposes a structuring of such knowledge based on the concept of 'specialization'. This organization, particularly considering its components (sub-domains), provides insight into the knowledge that the teacher brings into play in the transition between different (appropriate, personal, and reference) Mathematical Working Spaces, and the relationships between them.", "palabras_clave": ["Mathematical working spaces", "Mathematics teacher's specialized knowledge", "Relationships between MWS and MTSK"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Entornos tecnológicos y su influencia en los espacios de trabajo matemático", "autores": ["Sánchez A.C.", "Albaladejo I.M.R."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Facultad de Educación Enfermería Y Fisioterapia"], "pais": ["ES"], "doi": "10.1590/1980-4415v30n54a05", "enlace": "https://doi.org/10.1590/1980-4415v30n54a05", "resumen": "This work analyzes the influence of technologically rich environments on Mathematical Working Spaces (MWS). In particular, it aims to show how the use of technology fosters, on one hand, changes in the role adopted by agents of the teaching-learning processes, and, on the other hand, the arising of shared MWS. Using observational methodology and collaborative work on problem solving as a didactical strategy with student teachers, we shall illustrate: (a) how the interactivity with an i-activity and the use of asynchronous communication tools influences the construction of shared MWS; and (b) how the i-activity and the students partially take the instructor's role in the management of Personal and shared MWS, aided by digital technology.", "palabras_clave": ["Collaborative work", "Interactivity", "Mathematical working spaces", "Problem solving", "Technological environments"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Conocimiento especializado de un profesor de álgebra lineal y espacios de trabajo matemático", "autores": ["Mora D.V.", "Climent N.", "Escudero-Ávila D.", "Montes M.A.", "Ribeiro M."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Facultad de Ciencias de la Educación", "Licenciado en Matemáticas", "Doctora por la Universidad de Huelva (Didáctica de la Matemática)"], "pais": ["ES", "EC"], "doi": "10.1590/1980-4415v30n54a11", "enlace": "https://doi.org/10.1590/1980-4415v30n54a11", "resumen": "In this study, we approach the possible relationships between the analysis results of a classroom session with two different theoretical models: The Mathematics Teacher's Specialized Knowledge (MTSK), and the Mathematical Working Spaces (MWS). We also discuss the specialized knowledge that an university teacher of Linear Algebra deploys in a session about matrix product, and the ideal MWS of the teacher in this session. The knowledge showed explains the different genesis that the teacher prioritizes in the mathematical work he proposes. Thereby, the analysis with both models allows us to understand in depth the mathematical activity that the teacher fosters and how it is sustained by his knowledge.", "palabras_clave": ["Case study", "Linear algebra", "Mathematical working spaces", "Mathematics teacher's specialised knowledge", "Matrices"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Fostering representational flexibility in the mathematical working space of rational numbers", "autores": ["Gagatsis A.", "Deliyianni E.", "Elia I.", "Panaoura A.", "Michael-Chrysanthou P."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["University House Anastasios G. Leventis", "Cyprus Pedagogical Institute", "University of Cyprus (UCY)"], "pais": ["CY"], "doi": "10.1590/1980-4415v30n54a14", "enlace": "https://doi.org/10.1590/1980-4415v30n54a14", "resumen": "The study focuses on the cognitive level of Mathematical Working Space (MWS) and the component of the epistemological level related to semiotic representations in two mathematical domains of rational numbers: fraction and decimal number addition. Within this scope, it aims to explore how representational flexibility develops over time. A similar developmental pattern of four distinct hierarchical levels of student representational flexibility in both domains is identified. The findings indicate that the genesis of the semiotic axis in fraction and decimal addition is not automatic, but a long process of developmental steps that could be referred to as MWS1, MWS2, MWS3, MWS4 (final). There is not a clear and stable correspondence between developmental levels of representational flexibility and school grades. Didactical implications in order to foster representational flexibility in the MWS of fraction and decimal addition are discussed.", "palabras_clave": ["Representational flexibility. mathematical working space. fractions. decimals"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "El trabajo matemático de profesores en el tránsito de la geometría sintética a la analítica en el liceo", "autores": ["Henríquez-Rivas C.", "Montoya-Delgadillo E."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina", "MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Didáctica de la Matemática", "Didactique des Mathématiques"], "pais": ["CL"], "doi": "10.1590/1980-4415v30n54a03", "enlace": "https://doi.org/10.1590/1980-4415v30n54a03", "resumen": "The results of a research about Chilean teachers of Mathematics are shown in this investigation, in subject matters of Euclidean geometry, which articulates the approaches synthetically and analytically. The study presents a situation of reference that favors certain specific phases of work. The investigation sustains in the approach Mathematical Working Space and studies the personal work of the teacher with a methodological qualitative approach. The empirical evidence provides elements that allows us to characterize the paradigms in the cartesian sub-domain, which has been a contribution to the theoretical frame.", "palabras_clave": ["Analytical approach", "Geometric working space", "Synthetic approach"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "El rol del profesor desde la perspectiva de los Espacios de Trabajo Matemático", "autores": ["Gómez-Chacón I.M.", "Kuzniak A.", "Vivier L."], "autores_adretm": ["GÓMEZ-CHACÓN Inés Mª", "KUZNIAK Alain", "VIVIER Laurent"], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Facultad de Ciencias Matemáticas", "Aurélie Nemours Bâtiment Sophie Germain", "Doctor en matemática de la universidad de Tours", "Habilitado para Dirigir Investigaciones (HDR) en Didáctica de las Matemáticas de la Universidad Paris Diderot", "Profesor Asociado en el LDAR"], "pais": ["ES", "FR"], "doi": "10.1590/1980-4415v30n54a01", "enlace": "https://doi.org/10.1590/1980-4415v30n54a01", "resumen": "In this article, the Mathematical Working Space model (MWS) is presented. It shows the dynamism of this model to reflect on the teacher's actions in the classroom and on the important elements to consider in their training. The MWS is built based on the mathematical knowledge and experience of the subject to do mathematics, hence the organization refers to two planes: The epistemological and the cognitive one, which will be the centre of the discussion in this work. Monographic contributions in the dynamics that are established in the role of the teacher in the knowledge and the interactions in the classroom are presented, from two points of view, from the teacher's training and from the teacher's role with the students.", "palabras_clave": ["Mathematical education", "Mathematical working space", "Mathematics professional development", "Teacher's knowledge"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "El ETM de futuros profesores de primaria en un trabajo sobre los números naturales en cualquier base", "autores": ["Nikolantonakis K.", "Vivier L."], "autores_adretm": ["VIVIER Laurent"], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Doctor en Historia Y Epistemología de Matemáticas de la", "Doctor en Matemática de la"], "pais": ["GR", "FR"], "doi": "10.1590/1980-4415v30n54a02", "enlace": "https://doi.org/10.1590/1980-4415v30n54a02", "resumen": "Primary school teachers' training in France and Greece emphasizes natural numbers and the positional system. The introduction of bases other than ten shows that personal ETMs are guided by semiotic component (representamen) reduced to the ten base and that some of the work can be interpreted as a change of domain between the ten base and the other bases. This work will resume the semiotic, praxeological and statistical analysis conducted for an experiment in France and Greece using the Mathematical Working Space (MWS) model, which allows us to take into account the different components of the mathematical work. The study was completed by an experiment developed on a seven base that seemed to help in the conceptualization and coordination between the MWS related to the different bases.", "palabras_clave": ["Mathematical working space. natural numbers. positional system. teachers' initial training"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Erratum to: Mathematical working space and paradigms as an analysis tool for the teaching and learning of analysis", "autores": ["Montoya Delgadillo E.", "Vivier L."], "autores_adretm": ["MONTOYA DELGADILLO Elizabeth", "VIVIER Laurent"], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Pontificia Universidad Católica de Valparaíso", "Université Paris Cité", "Université de Montréal", "LDAR"], "pais": ["CL", "FR"], "doi": "10.1007/s11858-016-0793-9", "enlace": "https://doi.org/10.1007/s11858-016-0793-9", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The semiotic and conceptual genesis of angle", "autores": ["Tanguay D.", "Venant F."], "autores_adretm": ["VENANT Fabienne"], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Département de mathématiques"], "pais": ["CA"], "doi": "10.1007/s11858-016-0789-5", "enlace": "https://doi.org/10.1007/s11858-016-0789-5", "resumen": "In the present study, we try to understand how students at the end of primary school conceive of angle: Is an angle a magnitude for them or a geometric figure, and how do they manage to coordinate the two aspects in their understanding of the concepts of angle and of angle measurement? With the aim of better grasping the way angle is conceptualized, we submitted to a 6th grade class (11–12 years old) a questionnaire about angles. The analysis of the answers allows tracking a muddled meaning allotted to angle and shared by these students, in which measure prevails widely and where the measured figure is fuzzy, leaning on strongly iconic representations, of a blurred theoretical status. The analysis of two textbook collections used as guidelines by primary level teachers in the school under consideration suggests that the outlined conceptualizations are elicited by the way instruments and semiotic representations are being used in the teaching situations proposed in the textbooks. The study enabled us to build a better and deeper understanding, in that context, of two dialectical genetic processes that we name and describe as ‘disentanglement’ and amalgamation, and which help to bring to light the interactions between the different meanings in construction. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Amalgamation vs disentanglement", "Angle", "Mathematical working space", "Measure", "Semiotic bundle", "Semiotic genesis", "Sense vs meaning"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The concept of proof in the light of mathematical work", "autores": ["Richard P.R.", "Oller Marcén A.M.", "Meavilla Seguí V."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Université de Montréal", "Centro Universitario de la Defensa de Zaragoza", "Departamento de matemáticas"], "pais": ["CA", "ES"], "doi": "10.1007/s11858-016-0805-9", "enlace": "https://doi.org/10.1007/s11858-016-0805-9", "resumen": "Our article aims to show how illuminating mathematical work as a concept from didactics of mathematics is useful in understanding issues relating to proving and learning of proof, with or without technology. After posing our hypotheses on the relationship of proof with mathematical work, the pedagogical intent of historical elements of geometry and the use of modern technical tools, we present reference contexts and situations around the property of the tangent. These contexts and situations allow for a comparison of the validation modes, the type of epistemic necessity at stake and certain underlying discourse peculiarities. We introduce the idea of a “valence of mathematical work” and we interpret in an a priori approach the main interactions that could maintain a model user-reader in a mathematical working space. We pay special attention to an extract of Elémens de Géométrie by Alexis Claude Clairaut, with one of the reference contexts revisiting his problem with the assistance of dynamic geometry software. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Didactics of mathematics", "Epistemic necessity", "Interactions", "Mathematical working space", "Model reader and model user", "Proving in geometry", "Tolerance analysis", "Valence of mathematical work", "Validation mode"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "L’apprentissage instrumenté de propriétés en géométrie : propédeutique à l’acquisition d’une compétence de démonstration", "autores": ["Coutat S.", "Laborde C.", "Richard P.R."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2016.0, "fuente": "Educational Studies in Mathematics", "institucion": ["Faculté de psychologie et des sciences de l’éducation", "IUFM de Grenoble et Université Joseph Fourier", "Université de Montréal et Universitat Autònoma de Barcelona"], "pais": ["CH", "FR", "CA"], "doi": "10.1007/s10649-016-9684-9", "enlace": "https://doi.org/10.1007/s10649-016-9684-9", "resumen": "Our paper aims at showing how the instrumented learning of the properties in Euclidean geometry can be introduced in continuity with the mathematical competences developed at the elementary school. The principle founder of our research is based on the relation of subordination between the constraints of a property, posed using dynamic geometry software, and a necessary conclusion. Starting from an experimentation carried out in classes of 12-14 years old in France and in Quebec, our study presents a critical analysis of results where the ultimate objective of the activities suggested to the students relates as well to the significance of elementary properties, as on the understanding of the necessity of the link between the antecedents to the consequents of a deduction. Before ending by the didactic consequences of our approach, the text introduces the concept of instrumented figural inference as a means, employed by certain students, to justify a step of structured reasoning. A reconciling of the semiotic, instrumental and discursive aspects is offered throughout the paper. © 2016, Springer Science+Business Media Dordrecht.", "palabras_clave": ["Geometrical working spaces", "Instrumented figural inference", "Operational dynamic figure", "Register of dynamic figures", "Semiotic mediation", "Student-milieu interactions"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "How can histograms be useful for introducing continuous probability distributions?", "autores": ["Derouet C.", "Parzysz B."], "autores_adretm": ["PARZYSZ Bernard"], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["LDAR", "Université d'Orléans"], "pais": ["FR"], "doi": "10.1007/s11858-016-0769-9", "enlace": "https://doi.org/10.1007/s11858-016-0769-9", "resumen": "The teaching of probability has changed a great deal since the end of the last century. The development of technologies is indeed part of this evolution. In France, continuous probability distributions began to be studied in 2002 by scientific 12th graders, but this subject was marginal and appeared only as an application of integral calculus. With the high school reform recently implemented (in 2012 for grade 12), continuous probability distributions now have an important place in the scientific section. As induced by official texts, the use of histogram as a link between descriptive statistics and continuous probability distributions through its analogy with density curves, is indeed a promising path for learning. In order to answer this demand, which is indeed of general interest, we wondered how density function could be introduced for such a purpose. We began with a study of how textbooks deal with that question, which led us to propose an alternative introductory classroom activity. The reason for this proposition is that, contrary to what is currently implemented in textbooks, a specific mathematical working space (MWS) has to be brought into play, making various mathematical domains intervene in turn and articulating them with each other. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Continuous distribution", "Density", "High school", "Mathematical Working Space", "Probability"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Mathematical working space and paradigms as an analysis tool for the teaching and learning of analysis", "autores": ["Delgadillo E.M.", "Vivier L."], "autores_adretm": ["MONTOYA DELGADILLO Elizabeth", "VIVIER Laurent"], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["IMA", "LDAR", "IMAG"], "pais": ["CL", "FR"], "doi": "10.1007/s11858-016-0777-9", "enlace": "https://doi.org/10.1007/s11858-016-0777-9", "resumen": "Mathematical working space (MWS) is a model that is used in research in mathematics education, particularly in the field of geometry. Some MWS elements are independent of the field while other elements must be adapted to the field in question. In this paper, we develop the MWS model for the field of analysis with an identification of paradigms. We show the advantages of this MWS model, which takes into account the epistemological and cognitive aspects of mathematical work, and more specifically the semiotic, instrumental and discursive geneses, by making them function as one system. By using examples and data from three countries, we illustrate how this model can be used to perform a priori analyses and analyses of class situations and individual student work. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Analysis", "Mathematical working space", "Paradigms", "Perspectives"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Estabilidad epistemológica del profesor debutante y espacio de trabajo matemático", "autores": ["Montoya-Delgadillo E.", "Mena-Lorca J.", "Mena-Lorca A."], "autores_adretm": ["MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Didáctica de la Matemática", "Universidad de Talca"], "pais": ["CL"], "doi": "10.1590/1980-4415v30n54a09", "enlace": "https://doi.org/10.1590/1980-4415v30n54a09", "resumen": "In this research, we study the epistemological stability of beginning teachers. To do this, we have made a qualitative study of their suitable-MWS when developing a mathematical domain with the students, so as to clarify the elements that they put into play when unfolding a task in the classroom. We show results related to the eventual favoring that those teachers make of the realization of semiotic, discursive and instrumental genesis, and of the circulation between the different poles of the epistemological and cognitive planes. The study shows that the epistemology of beginning teachers is not stable, due to tension between their personal-MWS and their suitable-MWS.", "palabras_clave": ["Algebrization", "Beginning teachers", "Epistemological stability"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Understanding the development of mathematical work in the context of the classroom", "autores": ["Kuzniak A.", "Nechache A.", "Drouhard J.P."], "autores_adretm": ["KUZNIAK Alain", "NECHACHE Assia"], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["LDAR", "Universidad de Buenos Aires"], "pais": ["FR", "AR"], "doi": "10.1007/s11858-016-0773-0", "enlace": "https://doi.org/10.1007/s11858-016-0773-0", "resumen": "According to our approach to mathematics education, the optimal aim of the teaching of mathematics is to assist students in achieving efficient mathematical work. But, what does efficient exactly mean in that case? And how can teachers reach this objective? The model of Mathematical Working Spaces with its three dimensions—semiotic, instrumental, discursive—allows us to address these questions in an original way based on a multidimensional approach to the use of tools and instruments and on the notion of complete mathematical work. The Mathematical work is considered complete when a genuine relationship exists between epistemological and cognitive aspects, and when the three dimensions of the model are appropriately articulated. Two teaching situations in probability for Grades 9 and 10 (age 14 and 15) are used to illustrate how the model can help identify either misunderstandings that are not acknowledged by the teacher, or complete mathematical work despite some differences between intended and actual work. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Mathematical work", "Mathematical Working Spaces", "Probability", "Tools and instruments"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Mathematical Working Spaces in schooling: an introduction", "autores": ["Kuzniak A.", "Tanguay D.", "Elia I."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Université Paris Cité", "Université du Quebec à Montréal", "University of Cyprus"], "pais": ["FR", "CA", "CY"], "doi": "10.1007/s11858-016-0812-x", "enlace": "https://doi.org/10.1007/s11858-016-0812-x", "resumen": "The theoretical and methodological model of Mathematical Working Space (MWS) is introduced in this paper. For over 10 years, the model has been the object of collaborative research among various researchers, generally coming from French and Spanish speaking countries. Articulating epistemological and cognitive aspects, the MWS model is aimed at providing a tool for the specific study of mathematical work in which students and teachers are effectively engaged during mathematics sessions. The abstract space thus conceived refers to a structure organized in a way that allows the analysis of the mathematical activity of individuals dealing with mathematical problems. Thus, analyzing mathematical work through the lens of MWS enables tracking down how meaning is progressively constructed, as a process of bridging the epistemological and the cognitive perspectives—these being modelled as two planes at different levels in the diagrammatic structure—in accordance with different specific yet intertwined genetic developments. Each is identified as a genesis related to a specific dimension in the model: semiotic, instrumental and discursive geneses. A general overview of the different papers included in this issue is given, and shows how the model can be used to study different tasks, teaching situations and activities set in specific mathematical fields or domains. Some perspectives are finally drawn, while reflecting on the possibility of ‘networking’ different theoretical frames with the MWS framework. Indeed, the latter is not proposed as a holistic theory, but rather should function as a tool interacting strongly with other approaches. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Cognitive perspective", "Discursive geneses", "Epistemological perspective", "Instrumental", "Mathematical Working Space", "Semiotic"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Zig-zagging in geometrical reasoning in technological collaborative environments: a Mathematical Working Space-framed study concerning cognition and affect", "autores": ["Gómez-Chacón I.M.", "Romero Albaladejo I.M.", "del Mar García López M."], "autores_adretm": ["GÓMEZ-CHACÓN Inés Mª"], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Facultad de Ciencias Matemáticas e Instituto de Matemática Interdisciplinar", "Universidad de Talca"], "pais": ["ES"], "doi": "10.1007/s11858-016-0755-2", "enlace": "https://doi.org/10.1007/s11858-016-0755-2", "resumen": "This study highlights the importance of cognition-affect interaction pathways in the construction of mathematical knowledge. Scientific output demands further research on the conceptual structure underlying such interaction aimed at coping with the high complexity of its interpretation. The paper discusses the effectiveness of using a dynamic model such as that outlined in the Mathematical Working Spaces (MWS) framework, in order to describe the interplay between cognition and affect in the transitions from instrumental to discursive geneses in geometrical reasoning. The results based on empirical data from a teaching experiment at a middle school show that the use of dynamic geometry software favours students’ attitudinal and volitional dimensions and helps them to maintain productive affective pathways, affording greater intellectual independence in mathematical work and interaction with the context that impact learning opportunities in geometric proofs. The reflective and heuristic dimensions of teacher mediation in students’ learning is crucial in the transition from instrumental to discursive genesis and working stability in the Instrumental-Discursive plane of MWS. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Argumentation", "Cognition-affect interplay", "GeoGebra", "Geometry", "Mathematical Working Space", "Secondary education"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Concepto de lugar geométrico. Génesis de utilización personal y profesional con distintas herramientas", "autores": ["Gómez-Chacón I.M.", "Botana F.", "Escribano J.", "Abánades M.Á."], "autores_adretm": ["GÓMEZ-CHACÓN Inés Mª"], "directores": [], "anio": 2016.0, "fuente": "Bolema - Mathematics Education Bulletin", "institucion": ["Facultad de Ciencias Matemáticas", "Department of Applied Mathematics I", "Universidad Rey Juan Carlos (URJC)"], "pais": ["ES"], "doi": "10.1590/1980-4415v30n54a04", "enlace": "https://doi.org/10.1590/1980-4415v30n54a04", "resumen": "The purpose of this article is to clarify some of the elements involved in an effective workspace for problems related to geometric loci in technological environments. It analyzes how 52 prospective math teachers progress in their conception of the concept of geometric locus through the appropriation of the specific features of each environment (tool) in relation to their own practice as students and their future professional activity. The mathematical representations of loci generated by three different dynamic geometry tools have been compared, both from the perspective of their mathematical dynamics and their didactic functions. The didactic functionalities provided from the designer have been studied from the Mathematical Working Space model (MWS). This model highlights the need to coordinate the geometric work on the epistemological and cognitive levels through different genesis of reasoning (visual-discursive, instrumental and discursive).", "palabras_clave": ["Dynamic geometry", "Geometric loci", "Geometric reasoning", "Instrumental genesis", "Mathematical working space"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "An arithmetic-algebraic work space for the promotion of arithmetic and algebraic thinking: triangular numbers", "autores": ["Hitt F.", "Saboya M.", "Cortés Zavala C."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Département de Mathématiques", "Universidad Michoacana de San Nicolás de Hidalgo"], "pais": ["CA", "MX"], "doi": "10.1007/s11858-015-0749-5", "enlace": "https://doi.org/10.1007/s11858-015-0749-5", "resumen": "This paper presents an experiment that attempts to mobilise an arithmetic-algebraic way of thinking in order to articulate between arithmetic thinking and the early algebraic thinking, which is considered a prelude to algebraic thinking. In the process of building this latter way of thinking, researchers analysed pupils’ spontaneous production using a triangular numbers activity. Based on a specific collaborative learning methodology, this study explores the possibility of constructing an Arithmetic-Algebraic Work Space around the process of constructing signs as framed by both activity theory and a technological approach, showing the spontaneous representations produced by seventh grade pupils and their evolution in a socio-cultural environment. © 2015, FIZ Karlsruhe.", "palabras_clave": ["Algebraic thinking", "Arithmetic-algebraic thinking", "Institutional representations", "Mathematical thinking", "Mathematical work space", "Sociocultural milieu", "Spontaneous representations", "Technology"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Problem solving and the use of digital technologies within the Mathematical Working Space framework", "autores": ["Santos-Trigo M.", "Moreno-Armella L.", "Camacho-Machín M."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Center for Research and Advanced Studies", "University of la Laguna"], "pais": ["MX", "ES"], "doi": "10.1007/s11858-016-0757-0", "enlace": "https://doi.org/10.1007/s11858-016-0757-0", "resumen": "The aim of this study is to analyze and document the extent to which high school teachers rely on a set of technology affordances to articulate epistemological and cognitive actions in problem solving approaches. Participants were encouraged to construct dynamic representations of tasks and always to look for different ways to identify and support mathematical relations. To this end, three interrelated geneses (instrumental, semiotic, discursive) proposed in the Mathematical Working Space frame are used to document ways in which the participants constructed dynamic configuration of mathematical tasks as a means initially to explore invariants and eventually formulate conjectures based on empirical arguments. Technology affordances that involve dragging objects, quantifying parameters, graphing loci and using sliders were important for the participants to articulate semiotic and discursive geneses. Thus, the participants’ approaches that appeared individual, small group and plenary discussions contributed to identifying initial conjectures that later were analyzed via empirical, geometric or algebraic arguments. In addition, the participants recognized that a working space to understand mathematical ideas and to solve problems should foster mathematical discussions beyond formal settings. The use of digital technologies plays an important role in both representing and exploring mathematical tasks and in following the discussion outside the formal class. As a result, the participants outlined a possible route to implement a route for learners to integrate activities to account for instrumental, semiotic, and discursive genesis. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Digital technologies", "Empirical and formal reasoning", "Mathematical Working Space", "Problem solving"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Students’ mathematical work on absolute value: focusing on conceptions, errors and obstacles", "autores": ["Elia I.", "Özel S.", "Gagatsis A.", "Panaoura A.", "Özel Z.E.Y."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Department of Education", "Department of Primary Education", "Department of Elementary Education"], "pais": ["CY", "Turkey"], "doi": "10.1007/s11858-016-0780-1", "enlace": "https://doi.org/10.1007/s11858-016-0780-1", "resumen": "This study investigates students’ conceptions of absolute value (AV), their performance in various items on AV, their errors in these items and the relationships between students’ conceptions and their performance and errors. The Mathematical Working Space (MWS) is used as a framework for studying students’ mathematical work on AV and the obstacles that hinder their work in Turkey and Cyprus. A comparative study between the two countries is undertaken, by which a deeper understanding on students’ personal MWS on AV is gained. Specifically, a survey was carried out in Turkey, following a similar survey in Cyprus, in which secondary school students’ performance was assessed using a test. Findings showed a discrepancy in the conception of AV that was most prevalent in each country, indicating the differences in the reference and suitable MWS between the two countries. For Turkey, the conception of AV as distance from 0, which was the most widely used definition, gave a positive support to the solution of items involving discursive reasoning. This was not the case for Cyprus, in which the most prevalent conception of AV was ‘number without sign’. An analysis of the Turkish students’ errors revealed a distinction between errors in students’ discursive genesis and semiotic genesis, which were a consequence of either didactic or epistemological obstacles that intervened in students’ personal MWS. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Absolute value", "Comparative study", "Discursive genesis", "Mathematical Working Space", "Obstacles"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Connected functional working spaces: a framework for the teaching and learning of functions at upper secondary level", "autores": ["Minh T.K.", "Lagrange J.-B."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["College of Education", "LDAR University Paris Diderot", "University of Reims"], "pais": ["VN", "FR"], "doi": "10.1007/s11858-016-0774-z", "enlace": "https://doi.org/10.1007/s11858-016-0774-z", "resumen": "This paper aims at contributing to remedy the narrow treatment of functions at upper secondary level. Assuming that students make sense of functions by working on functional situations in distinctive settings, we propose to consider functional working spaces inspired by geometrical working spaces. We analyse a classroom situation based on a geometric optimization problem pointing out that no working space has been prepared by the teacher for students’ tasks outside algebra. We specify a dynamic geometry space, a measure space and an algebra space, with artefacts in each space and means for connecting these provided by Casyopée. The question at stake is then the functionality of this framework for implementing and analyzing classroom situations and for analyzing students’ and teachers’ evolution concerning functions, in terms of geneses relative to each space. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Casyopée", "Connected functional working spaces", "Functions", "Genesis", "Working spaces"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The epistemic, the cognitive, the human: a commentary on the mathematical working space approach", "autores": ["Radford L."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education",
