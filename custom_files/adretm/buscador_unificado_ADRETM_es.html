lave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "CONOCIMIENTOS TECNOLÓGICOS Y EL ESPACIO DE TRABAJO MATEMÁTICO IDÓNEO DE PROFESORES EN LA ENSEÑANZA DE CUADRILÁTEROS", "autores": ["Victoria Flores Salazar J.", "Cristina Théry Romero M.", "Julissa García-Cuéllar D."], "autores_adretm": ["GARCÍA CUELLAR Daysi", "THÉRY ROMERO Morella", "FLORES SALAZAR Jesús"], "directores": [], "anio": 2024.0, "fuente": "", "institucion": ["Pontificia Universidad Católica de Valparaíso"], "pais": ["PE"], "doi": "10.22533/at.ed.7892411045", "enlace": "https://doi.org/10.22533/at.ed.7892411045", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Advances and trends in research on mathematical working spaces: A systematic review", "autores": ["Panqueban D.", "Henríquez-Rivas C.", "Kuzniak A."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina", "PANQUEBAN Darlis", "KUZNIAK Alain"], "directores": [], "anio": 2024.0, "fuente": "Eurasia Journal of Mathematics Science and Technology Education", "institucion": ["Universidad Católica del Maule", "Université Paris Cité", "LDAR"], "pais": ["CL", "FR"], "doi": "10.29333/ejmste/14588", "enlace": "https://doi.org/10.29333/ejmste/14588", "resumen": "This study addresses the research developed around the theory of mathematical working spaces (MWS). To this end, factors such as researchers’ country of origin are considered, as well as methodological characteristics, proposed objectives in each study, specific theoretical factors, and the links between MWS and other theoretical perspectives. This systematic review follows the guidelines stated by reporting items for systematic reviews and meta-analyses for documenting each stage of the review. In total, 102 studies were considered from databases including Dialnet, SciElo, Scopus, and Web of Science. The results help to illustrate research trends in MWS theory, as well as the possibility of fertile ideas for new studies and future lines of research for those interested in this theoretical approach.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "acta_congreso", "titulo": "Connexions entre Espaces de Travail : une étude entre probabilités et algorithmique", "autores": ["Laval D.", "Trunkenwald J."], "autores_adretm": ["TRUNKENWALD Jannick", "LAVAL Dominique"], "directores": [], "anio": 2024.0, "fuente": "", "institucion": ["Académie de Versailles"], "pais": ["FR"], "doi": "10.17118/11143/22478", "enlace": "https://doi.org/10.17118/11143/22478", "resumen": "En 10e année (classe de 2nde), l’apprenant découvre la fluctuation de l’échantillonnage. Notre attention se porte sur l’apport des algorithmes à la compréhension de l’intervalle de prédiction dans le domaine des probabilités. Une approche algorithmique de simulation d’échantillonnage est proposée aux enseignants du Lycée Français d’Alger (Algérie) dans le cadre d’un travail de formation. Ce travail est analysé dans sa genèse sémiotique, discursive et instrumentale, au sein des différents champs concernés.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Sobre la realidad del trabajo matemático realizado por alumnos y profesores", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2024.0, "fuente": "Revista UCMaule", "institucion": ["Université Paris Cité"], "pais": ["FR"], "doi": "10.29035/ucmaule.67.31", "enlace": "https://doi.org/10.29035/ucmaule.67.31", "resumen": "Este trabajo se centra especialmente en la realidad del trabajo matemático realizado por alumnos y profesores. Para investigar esta cuestión, se desarrollaron sesiones de clase en un curso de formación continua de profesores. Estas sesiones se analizaron mediante el uso de la Teoría de las Situaciones Didácticas (TDS) y la Teoría de los Espacios de Trabajo Matemático (ThETM). El uso combinado de estas dos teorías ha permitido desarrollar y realizar una codificación de las sesiones observadas. Con esta codificación, pudimos estudiar los ETM idóneos (potenciales y reales) que surgieron durante la formación. En particular, es posible identificar diferentes patrones que permiten reconocer y caracterizar distintas formas de contratos fuertemente didácticos. Las herramientas, y especialmente la codificación, desarrolladas para el estudio podrían utilizarse en futuras investigaciones sobre situaciones didácticas en relación con el ETM idóneo.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "La comprensión de un espacio de trabajo matemático (ETM) en base seis por parte de futuros profesores de primaria y su influencia en el ETM en base diez", "autores": ["Florence P.", "Segura Corella N.", "Vivier L."], "autores_adretm": ["VIVIER Laurent"], "directores": [], "anio": 2024.0, "fuente": "Revista UCMaule", "institucion": ["Universidad de Costa Rica"], "pais": ["CR"], "doi": "10.29035/ucmaule.67.112", "enlace": "https://doi.org/10.29035/ucmaule.67.112", "resumen": "En el dominio matemático de los números la base diez juega un rol importante en la escolaridad primaria y secundaria, aunque no es absoluta del punto de vista matemático. Sin embargo, la mayoría de personas interpretan este rol como absoluto, obteniendo lo que se interpreta como un paradigma común o degenerado donde el número se confunde con su representación en base diez. Este artículo reporta los hallazgos de una experiencia con futuros profesores de primaria, en tercer año de licenciatura en Francia. Se propone una secuencia que permite construir un ETM para desarrollar el conocimiento de los números utilizando la base seis como sistema de representación, en paralelo del ETM en base diez. Se presenta el análisis de la circulación del trabajo matemático de los estudiantes, abordando diferentes aspectos de los números a través de las tres génesis. El estudio revela el establecimiento de un nuevo sistema de representación, la base seis, como un agente transformador del paradigma común tomando conciencia del papel no absoluto de la base diez.", "palabras_clave": ["Base (topology)"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Teachers mathematical work in quadrilateral teaching using digital technology and the history of mathematics", "autores": ["Salazar, J. V. F.", "Abreu, I.", "Théry, M. C.", "Peñaloza, T. N.", "Neira, V."], "autores_adretm": ["FLORES SALAZAR Jesús", "NEIRA FERNÁNDEZ Verónica", "PEÑALOZA VARA Nelson", "THÉRY ROMERO Morella"], "directores": [], "anio": 2024.0, "fuente": "Educação: entre teoria e prática (Vol. III, pp. 20–33). Pantanal.", "institucion": [], "pais": ["PE", "BR"], "doi": "10.46420/9786585756419cap3", "enlace": "https://doi.org/10.46420/9786585756419cap3", "resumen": "El capítulo analiza cómo la integración de la tecnología digital y la historia de las matemáticas puede favorecer el trabajo matemático de profesores en formación continua sobre cuadriláteros. Desde los enfoques teóricos del Espacio de Trabajo Matemático (ETM) y el modelo TPACK, se diseña y aplica una tarea basada en un contexto histórico del antiguo Egipto utilizando el geoplano digital Geoboard. Los resultados evidencian que el uso articulado de recursos tecnológicos e históricos promueve la activación de procesos de visualización, argumentación y construcción matemática, además de influir en la planificación didáctica de los docentes. Se concluye que la incorporación conjunta de historia de la matemática y tecnología digital fortalece el conocimiento tecnológico y matemático de los profesores, favoreciendo nuevas formas de enseñanza de la geometría.", "palabras_clave": ["Espacio de Trabajo Matemático", "tecnología digital", "historia de la matemática", "formación de profesores de matemáticas."], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Capítulo de Libro", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Teachers’ mathematical work based on examples presented in the teaching of algebra in secondary education", "autores": ["Henríquez-Rivas C.", "Verdugo-Hernández P."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina", "VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2024.0, "fuente": "Frontiers in Education", "institucion": ["Departamento de Matemática", "Universidad de Playa Ancha"], "pais": ["CL"], "doi": "10.3389/feduc.2024.1346091", "enlace": "https://doi.org/10.3389/feduc.2024.1346091", "resumen": "Both international examination results and scientific evidence related to the teaching and learning of school algebra point to the necessity for analyzing mathematical practice in the classroom. In this context, we have formulated the research objective of characterizing the mathematical work that teachers favor based on the examples that they implement in the teaching of topics within the domain of secondary school algebra. To this end, this study is situated within the interpretive paradigm utilizing an instrumental collective case study approach. The study design entails the selection of two representative cases of mathematics teachers in Chilean schools, with the objective of understanding and describing their mathematical work in the secondary school classroom based on the examples they present. The results show that the first teacher utilizes varied examples that activate distinct forms of mathematical thinking, promoting the activation of both instrumental and discursive genesis. In contrast, the second teacher follows a more traditional approach, with the use of examples to illustrate and motivate, and a direct presentation of knowledge, activating primarily semiotic genesis, in which a transition between the numerical and the algebraic is lacking. Ultimately, the results highlight the importance of deeper consideration of the choice of examples in the teaching of algebra and how these examples can influence students’ learning. Furthermore, additional ideas are put forward for future work in this line of research associated with the use of examples in the classroom. Copyright © 2024 Henríquez-Rivas and Verdugo-Hernández.", "palabras_clave": ["examples", "mathematical working space", "school algebra", "secondary education", "teachers"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Advances and trends in research on mathematical working spaces: A systematic review", "autores": ["Panqueban D.", "Henríquez-Rivas C.", "Kuzniak A."], "autores_adretm": ["PANQUEBAN Darlis", "HENRIQUEZ RIVAS Carolina", "KUZNIAK Alain"], "directores": [], "anio": 2024.0, "fuente": "Eurasia Journal of Mathematics, Science and Technology Education", "institucion": ["Department of Mathematics", "UFR of Mathematics"], "pais": ["CL", "FR"], "doi": "10.29333/ejmste/14588", "enlace": "https://doi.org/10.29333/EJMSTE/14588", "resumen": "This study addresses the research developed around the theory of mathematical working spaces (MWS). To this end, factors such as researchers’ country of origin are considered, as well as methodological characteristics, proposed objectives in each study, specific theoretical factors, and the links between MWS and other theoretical perspectives. This systematic review follows the guidelines stated by reporting items for systematic reviews and meta-analyses for documenting each stage of the review. In total, 102 studies were considered from databases including Dialnet, SciElo, Scopus, and Web of Science. The results help to illustrate research trends in MWS theory, as well as the possibility of fertile ideas for new studies and future lines of research for those interested in this theoretical approach. © 2024 by the authors; licensee Modestum. This article is an open access article distributed under the terms and conditions of the Creative Commons Attribution License (http://creativecommons.org/licenses/by/4.0/).", "palabras_clave": ["mathematical working spaces", "mathematics education", "systematic review", "tasks", "theory"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The work of a prospective high school teacher in pre-professional training in highlighting mathematical knowledge", "autores": ["Verdugo-Hernández P.", "Barrera S.C."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2024.0, "fuente": "Eurasia Journal of Mathematics, Science and Technology Education", "institucion": ["Universidad de Playa Ancha", "Universidad Internacional de La Rioja"], "pais": ["CL", "ES"], "doi": "10.29333/ejmste/15473", "enlace": "https://doi.org/10.29333/ejmste/15473", "resumen": "This article aims to identify the knowledge that enables a prospective secondary school teacher to mobilize number sense components during a pre-professional practicum. Using a qualitative case study approach, four classroom episodes focused on fractions, percentages, and algebraic language are analyzed. The study involves one prospective teacher and 23 students from a multi-grade school in central-southern Chile. The analysis integrates teacher's specialized knowledge and mathematical working spaces to explore how these frameworks inform the teacher's knowledge. The findings reveal that the teacher employs personal theories, real-life examples, and graphical aids to enhance students’ understanding, though there is a reliance on rules and algorithms. While specialized knowledge aids in teaching, there is less emphasis on fostering students’ conceptual understanding and judgement. The study recommends improving teacher training programs to better equip prospective teachers in grasping number sense components, highlighting the need for more focused training on its development. © 2024 © 2024 by the authors; licensee Modestum. This article is an open access article distributed under the terms and conditions of the Creative Commons Attribution License (http://creativecommons.org/licenses/by/4.0/).", "palabras_clave": ["mathematical working spaces", "mathematics teachers´ specialized knowledge", "number sense", "prospective secondary teachers"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Teaching Thales’s theorem: relations between suitable mathematical working spaces and specialised knowledge", "autores": ["Espinoza-Vásquez G.", "Henríquez-Rivas C.", "Climent N.", "Ponce R.", "Verdugo-Hernández P."], "autores_adretm": ["ESPINOZA-VÁSQUEZ Gonzalo", "HENRIQUEZ RIVAS Carolina", "VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2024.0, "fuente": "Educational Studies in Mathematics", "institucion": ["Facultad de Educación", "Departamento de Matemática", "Universidad de Talca", "Universidad de Playa Ancha"], "pais": ["CL", "ES"], "doi": "10.1007/s10649-024-10367-9", "enlace": "https://doi.org/10.1007/s10649-024-10367-9", "resumen": "In this article, we analyse a lesson on Thales’s theorem in a Chilean secondary school classroom through the combination of two theories: Mathematics Teachers’ Specialised Knowledge (ThMTSK) and Mathematical Working Spaces (ThMWS). Both theories, first separately and then in relation to one another, are used to analyse two tasks proposed by the teacher in the classroom following a cross-methodology for networking of theories. Through a single case study research design, a content analysis of the transcript of the video recording of the lesson was conducted. The joint analysis of this lesson allows us to better understand the mathematical work taking place in the classroom. In particular, the results show the scope of each model and their complementarity through the detection of meeting points and blind spots, through the role of proof, representations, and the change between geometrical and numerical work in teaching Thales’s theorem. This allows for a deeper understanding of a teacher’s practice and teaching. Ultimately, relationships between the theoretical elements of both theories are established to show their complementarity. We conclude that networking between theories can contribute to the development of these theories by raising questions that involve examining their foundations and assumptions in greater depth. © The Author(s) 2024.", "palabras_clave": ["Mathematical working spaces", "Mathematics teachers’ specialised knowledge", "Networking of theories", "Thales’s theorem"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "libro", "titulo": "Actas del Octavo Simposio sobre el Estudio del Trabajo Matemático", "autores": ["Steven Van Vaerenbergh, Laurent Vivier", "Ferdinando Arzarello, Jesús Victoria Flores Salazar", "Jorge Gaona Paredes, Patrick Gibel", "Inés M. Gómez-Chacón, Alain Kuzniak", "Michela Maschietto, Elizabeth Montoya Delgadillo", "Assia Nechache, Konstantinos Nikolantonakis", "Rosa Elvira Páez Murillo, Philippe R. Richard", "M. Pilar Vélez, Fabienne Venant (editores)"], "autores_adretm": ["GAONA Jorge", "GÓMEZ-CHACÓN Inés Mª", "KUZNIAK Alain", "MONTOYA DELGADILLO Elizabeth", "NECHACHE Assia", "NIKOLANTONAKIS Konstandinos", "PÁEZ Rosa-Elvira", "RICHARD Philippe R.", "VENANT Fabienne", "VIVIER Laurent"], "directores": [], "anio": 2024.0, "fuente": "Editorial de la Universidad de Cantabria", "institucion": [], "pais": ["ES", "FR", "IT", "CL", "GR", "MX", "CA"], "doi": "", "enlace": "https://www.editorial.unican.es/libro/actas-del-octavo-simposio-sobre-el-estudio-del-trabajo-matematico-etm8", "resumen": "Actas ETM8", "palabras_clave": ["Actas ETM8"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Libro, Actes du huitième symposium sur l'étude du travail mathématique", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Epistemic emotions and pre-service mathematics teachers’ knowledge for teaching", "autores": ["Gómez-Chacón I.M.", "Marbán J.M."], "autores_adretm": ["GÓMEZ-CHACÓN Inés Mª"], "directores": [], "anio": 2024.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Instituto de Matemática Interdisciplinar", "Dpto. Didáctica de las Ciencias Experimentales"], "pais": ["ES"], "doi": "10.1007/s11858-024-01624-5", "enlace": "https://doi.org/10.1007/s11858-024-01624-5", "resumen": "Affective and cognitive processes may be jointly researched to better understand mathematics learning, paying special interest to emotions related to knowledge acquisition. However, it remains necessary to explore these processes in studies linked to the education of pre-service mathematics teachers. This study aims to characterize epistemic emotions in different practices linked to the practice of mathematics teaching: problem-solving, anticipating what would happen with the students and reflecting on classroom implementation. It considers the theory of Mathematical Working Spaces to describe the mathematical and cognitive dimensions generated by epistemic emotions, paying special attention to the cognition-affect interaction and the workspace created. The results indicate that the epistemic emotions of the pre-service mathematics teachers associated with the distinct practices were different. Differences are observed in the interaction between emotions and cognitive epistemic actions, depending on whether the pre-service mathematics teachers analyze them within the framework of their own solving or anticipate them in their students. This reveals how personal work relates to what is considered to be suitable for students. Specifically, certain antecedents and consequences have been specified for the emotions of surprise and boredom in relation to the characteristics of the optimization problems and the cognitive activity of the subject when solving them. These results highlight the need to enhance the education of pre-service mathematics teachers through training that helps regulate their epistemic emotions and model effective strategies for regulating their own emotions and those of their students. © The Author(s) 2024.", "palabras_clave": ["Boredom", "Epistemic emotions", "Mathematical Working Spaces", "Pre-service mathematics teacher", "Surprise", "Teacher education"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Study of a Problem-Solving Activity Using the Extended Mathematical Working Space Framework", "autores": ["Moutet L."], "autores_adretm": [], "directores": [], "anio": 2023.0, "fuente": "International Perspectives on the Teaching and Learning of Mathematical Modelling", "institucion": ["Inspectorate of Physics and Chemistry"], "pais": ["FR"], "doi": "10.1007/978-3-031-27115-1_7", "enlace": "https://doi.org/10.1007/978-3-031-27115-1_7", "resumen": "The theoretical framework of the Extended Mathematical Working Space (MWS) and the Blum and Leiss modelling cycle allow the analysis of a problem-solving activity within a multidisciplinary approach (contribution of physics and mathematics). This problem-solving activity explores the possibility of producing an intense magnetic field using a wire winding for a medical imaging device. The different fields used are those of electromagnetism and calorimetry from physics and algebra from mathematics. A group of volunteer 12th grade students in France completed the online activity between May and June 2020. The extended MWS framework makes it possible to analyse school tasks by considering the relationships between the cognitive plane of students, the epistemological plane of mathematics and that of physics, according to the stage of the modelling cycle. © 2023, The Author(s), under exclusive license to Springer Nature Switzerland AG.", "palabras_clave": ["Extended MWS", "Interdisciplinary", "Mathematical modelling", "Online activity", "Physics"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Digital Technology in Higher Education: Identification of Surfaces in Space Generated by Functions of Two Variables", "autores": ["Luis Vivas-Pachas J.", "Cristian Julián Trujillo E.", "Victoria Flores Salazar J.", "Saravia-Molina N."], "autores_adretm": ["FLORES SALAZAR Jesús", "VIVAS PACHAS Jorge"], "directores": [], "anio": 2023.0, "fuente": "Smart innovation, systems and technologies", "institucion": ["Universidad de Talca", "Universidad San Ignacio de Loyola", "Pontificia Universidad Católica del Perú"], "pais": ["PE"], "doi": "10.1007/978-981-99-5414-8_53", "enlace": "https://doi.org/10.1007/978-981-99-5414-8_53", "resumen": "", "palabras_clave": ["Representation|Sequence (biology)|Artifact (error)|Identification"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Intelligence artificielle et didactique des mathématiques : état des lieux et questionnements", "autores": ["Emprin F.", "R. Richard P."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2023.0, "fuente": "Annales de didactique et de sciences cognitives", "institucion": ["Université de Montréal"], "pais": ["CA"], "doi": "10.4000/adsc.3286", "enlace": "https://doi.org/10.4000/adsc.3286", "resumen": "It is essential to delve into the interactions between artificial intelligence (AI) and didactics, especially in our current era where the impact of AI on society and the economy is profound. Firstly, we question the concept of intelligence itself and the biases it may evoke when contemplating AI and its definitions. Next, we analyze the potential links between AI and the didactics of mathematics. To accomplish this, we examine examples of ongoing projects in the French-speaking world allowing us to provide an overview of the current developments. Subsequently, we explore the theoretical frameworks of mathematics didactics and their connection with AI. Lastly, we address the challenges and questions raised by the use of AI, while offering promising prospects for the future.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Tecnología digital y el uso de la historia de la matemática en la enseñanza: construyendo conexiones", "autores": ["Victoria Flores Salazar J.", "Cristina Théry Romero M."], "autores_adretm": ["THÉRY ROMERO Morella", "FLORES SALAZAR Jesús"], "directores": [], "anio": 2023.0, "fuente": "Rematec", "institucion": ["Pontificia Universidad Católica del Perú"], "pais": ["PE"], "doi": "10.37084/rematec.1980-3141.2023.n44.pe2023006.id511", "enlace": "https://doi.org/10.37084/rematec.1980-3141.2023.n44.pe2023006.id511", "resumen": "En este artículo, que forma parte de un proyecto de investigación y de una tesis de maestría, se asocia la formación continua de profesores con el uso de tecnología digital para analizar cómo docentes de matemática planifican una clase sobre el tema de cuadriláteros e identificar, por medio del modelo TPACK, sus conocimientos tecnológicos. Además, se intenta conectar el uso de la tecnología digital con el uso de la historia de la matemática. Para ello, se presenta una tarea sobre cuadriláteros y se analiza, en base a aspectos de la teoría Espacio de Trabajo Matemático ETM, las posibles génesis y planos verticales que pueden activar los profesores.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Trabajo matemático de estudiantes de secundaria en tareas sobre tasa de variación con el uso de GeoGebra", "autores": ["Antonio Ticse Aucahuasi M.", "Victoria Flores Salazar J.", "Luis Vivas-Pachas J."], "autores_adretm": ["TICSE AUCAHUASI Marco", "FLORES SALAZAR Jesús", "VIVAS PACHAS Jorge"], "directores": [], "anio": 2023.0, "fuente": "PNA", "institucion": ["Universidade Federal de Minas Gerais", "Pontificia Universidad Católica del Perú"], "pais": ["BR", "PE"], "doi": "10.30827/pna.v17i4.24258", "enlace": "https://doi.org/10.30827/pna.v17i4.24258", "resumen": "A partir de la mirada vigilante de la Didáctica de la Matemática en la enseñanza del Cálculo, buscamos caracterizar el conocimiento y trabajo matemático emergente de estudiantes de educación secundaria cuando resuelven tareas sobre la tasa de variación mediado por GeoGebra. Desde la teoría de Espacio de trabajo matemático, analizamos la producción matemática de estudiantes chilenos (16-17 años) y concluimos que dar sentido a la tasa de variación parte de un trabajo basado en procesos algorítmicos y un enfoque de interpretación/experimentación a la idea de variación y cambio subrayando el rol del artefacto, siendo singular establecer procesos de prueba y demostración.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Characterising algorithmic thinking: A university study of unplugged activities✰", "autores": ["Bacelo A.", "Gómez-Chacón I.M."], "autores_adretm": ["GÓMEZ-CHACÓN Inés Mª"], "directores": [], "anio": 2023.0, "fuente": "Thinking Skills and Creativity", "institucion": ["Didáctica de la Matemática", "Instituto de Matemática Interdisciplinar"], "pais": ["ES"], "doi": "10.1016/j.tsc.2023.101284", "enlace": "https://doi.org/10.1016/j.tsc.2023.101284", "resumen": "Algorithmic thinking is a type of thinking that occurs in the context of computational thinking. Given its importance in the current educational context, it seems pertinent to deepen into its conceptual and operational understanding for teaching. The exploration of research shows us that there are almost no studies at university level where algorithmic thinking is connected to mathematical thinking, and more importantly, to characterise it and be able to analyse and evaluate it better. The aim of this research is to characterise algorithmic thinking in a university context of the Bachelor's Degree in Mathematics by unplugged tasks, offering a model of analysis through categories that establish connections between mathematical and algorithmic working spaces in three dimensions, semiotic, instrumental and discursive. The results confirm the interaction between these dimensions and their predictive value for better programming performance. The study also adds novel considerations related to the role and interaction of mathematical and computational thinking categories involved in algorithmic thinking. © 2023 The Author(s)", "palabras_clave": ["Algorithmic thinking", "Computational thinking", "Statistical Implicative Analysis (SIA)", "Theory of mathematical working space", "University teaching"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Trabalho matemático de alunos do ensino médio técnico profissionalizante em um contexto interdisciplinar", "autores": ["Rivas C.H.", "Hernández P.V.", "Barrera Y.V."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina", "VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2023.0, "fuente": "Uniciencia", "institucion": ["Departamento de Matemática", "Universidad de Playa Ancha", "Liceo Bicentenario Instituto Comercial"], "pais": ["CL"], "doi": "10.15359/ru.37-1.25", "enlace": "https://doi.org/10.15359/ru.37-1.25", "resumen": "[Objective] This study is intended to characterize the mathematical work of secondary education students in technical-professional education (TP), who participate in a didactic program that integrates mathematical learning and a specialization in administration. [Methodology] This is a qualitative investigation based on a case study that analyzes mathematical work in the classroom by students in the final year of their TP education. The theoretical foundation considers aspects related to interdisciplinarity and the theory of Mathematical Work Spaces. [Results] Results of this investigation show the distance between the analyses expected and what the students actually did, which is expressed in the presence of the [Sem-Ins] plane above the others. Student results were organized according to the type of answers they provided: standard, incomplete, and blocking or difficulty. [Conclusions] Results of this investigation showed that the first sub-task was carried out in a standard manner with activation of the [Sem-Ins] plane and in a part of it the discursive genesis, while the results of the following sub-tasks corresponded to incompletion and blocking or difficulty, respectively, in which only the presence of the semiotic genesis was observed. Finally, it can be concluded that knowledge of the concepts of the specialization were not an obstacle when they were related to mathematical work. However, from a mathematical perspective, difficulties were identified with respect to the communication of discursive reasoning, associated with discursive genesis and the interpretation of graphs, which suggests the need to work on activities that integrate mathematics with the TP area of specialization – in this case, administration. © 2023 The Author(s).", "palabras_clave": ["interdisciplinarity", "Mathematicalworkspace", "secondarytechnical-professionaleducation", "students"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "El desarrollo de habilidades en el trabajo matemático: el caso de Lucas, un futuro profesor de matemática, en su práctica profesional", "autores": ["Verdugo-Hernández P.", "Espinoza-Vásquez G."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula", "ESPINOZA-VÁSQUEZ Gonzalo"], "directores": [], "anio": 2023.0, "fuente": "Uniciencia", "institucion": ["Universidad de Playa Ancha", "Universidad Alberto Hurtado"], "pais": ["CL"], "doi": "10.15359/ru.37-1.10", "enlace": "https://doi.org/10.15359/ru.37-1.10", "resumen": "[Objetive] This study seeks to characterize the mathematical work that prospective mathematics teachers prioritize in their initial training practices, in particular in the final stage of these practices (professional practice), as shown in their teaching proposals related to the development of disciplinary (mathematical) skills established in the Chilean curriculum. [Methodology] This is a qualitative study which analyzes the implementation of an online class on position measurements (quartiles) and its corresponding planning. A content analysis of mathematical tasks studied in the class was carried out, focusing on their characteristics and the disciplinary skills specified in the planning stage. [Results] Results show that the mathematical work emphasized on these tasks addresses skills that are different from those which were planned. In addition, low levels of student participation in the on-line classes lead prospective teachers to solve the proposed tasks by themselves, hindering the development of the mathematical skills specified in the planning stage. [Conclusions] The mathematical work proposed in the selected tasks promotes use of semiotic representations and operational aspects of the quartiles, but remains unconnected to the development of disciplinary skills. Finally, the selection of tasks that engage students and allow development of planned skills by the prospective teacher are considered, taking into account the abilities that the teacher expects to develop during teaching, to motivate the observation of teachers' training processes. © Uniciencia. All rights reserved.", "palabras_clave": ["higher education", "initial teacher training", "Mathematical working space", "mathematics education", "skill development", "teaching and learning", "training practices"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Connecting algorithmics to mathematics learning: a design study of the intermediate value theorem and the bisection algorithm", "autores": ["Lagrange J.-B.", "Laval D."], "autores_adretm": ["LAVAL Dominique"], "directores": [], "anio": 2023.0, "fuente": "Educational Studies in Mathematics", "institucion": ["Laboratoire de Didactique André Revuz (LDAR)", "INSPE de l’Académie de Versailles"], "pais": ["FR"], "doi": "10.1007/s10649-022-10192-y", "enlace": "https://doi.org/10.1007/s10649-022-10192-y", "resumen": "Programming-based activities are becoming more widespread in curricula. Our theoretical and empirical investigation seeks to identify appropriate ways to connect computer programming and algorithmics to mathematical learning. We take the intermediate value theorem as our starting point, as it is covered by the French school curriculum, and because of its links with the bisection algorithm. We build upon the theory of mathematical working spaces, distinguishing between algorithmic and mathematical working spaces. Both working spaces are explored from the semiotic, instrumental, and discursive dimensions that support learning. Our two research questions focus on the suitable algorithmic and mathematical working spaces in which students develop an understanding of the intermediate value theorem, and the bisection algorithm. Our method starts at the reference level, with an epistemological and curricular analysis. Then, a series of tasks is designed for students working in adidacticity, and suitable working spaces are determined a priori. The tasks have been implemented in French classrooms with students aged 16–19. An analysis of their work supports an a posteriori examination of the working spaces. Our findings demonstrate that the students were able to make connections between algorithmics and mathematics in each of the three dimensions, semiotic, instrumental, and discursive, and point out the interplay between these dimensions. © 2022, The Author(s), under exclusive licence to Springer Nature B.V.", "palabras_clave": ["Adidacticity", "Algorithmic and mathematical working spaces", "Algorithmic thinking", "Bisection algorithm", "Intermediate value theorem", "Mathematics-computer science connections", "Programming tasks"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Diseño de tareas en la formación inicial docente de matemáticas que involucran las representaciones de una función", "autores": ["Henríquez-Rivas C.", "Verdugo-Hernández P."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina", "VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2023.0, "fuente": "Educacion Matematica", "institucion": ["Campus San Miguel", "Campus Linares"], "pais": ["CL"], "doi": "10.24844/em3503.06", "enlace": "https://doi.org/10.24844/EM3503.06", "resumen": "In this research we present the analyses associated with the design of tasks developed by prospective secondary mathematics teachers. To do so, we pay attention to the formative experiences of teachers and the demands established in the school curriculum that must be considered in the development of activities in initial teacher education (ITE). We present a cases study that characterises the mathematical work around tasks designed by future teachers, focusing on the concept of function and favouring the ability to represent declared in the Chilean curriculum. The study is carried out in ITE didactics courses at two universities. The analyses are based on the theory called Mathematical Working Spaces, which allows us to delve into epistemological and cognitive aspects of the expected mathematical work that the tasks promote. The results show difficulties associated with the tasks that teachers design and what they hope to promote in their teaching. We conclude with a discussion of possibilities for improvement in teacher training. © 2023 Mexican Society for Research and Dissemination of Mathematics Education. All rights reserved.", "palabras_clave": ["function", "Mathematical Working Space", "Representing", "teacher training"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Instrumental Genesis in the Theory of MWS: Insight from Didactic Research on Digital Artifacts", "autores": ["Lagrange J.", "R. Richard P."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Université Paris Cité", "LDAR", "Université de Montréal"], "pais": ["FR", "CA"], "doi": "10.1007/978-3-030-90850-8_9", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_9", "resumen": "", "palabras_clave": ["Artifact (error)|Viewpoints"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Un acercamiento hacia la enseñanza de números reales con estudiantes de primer año de ingeniería", "autores": ["Elvira Páez Murillo R.", "Larios Osorio V."], "autores_adretm": ["PÁEZ Rosa-Elvira"], "directores": [], "anio": 2022.0, "fuente": "Rematec", "institucion": ["Universidad Autónoma de la Ciudad de México", "Autonomous University of Queretaro"], "pais": ["MX"], "doi": "10.37084/rematec.1980-3141.2022.n42.p193-210.id457", "enlace": "https://doi.org/10.37084/rematec.1980-3141.2022.n42.p193-210.id457", "resumen": "En este artículo presentamos los resultados obtenidos de la puesta en práctica de tres actividades didácticas utilizadas en la enseñanza de la noción de número real, con estudiantes de primer año de la licenciatura en ingenierías. Estas actividades han sido diseñadas en función del enfoque propuesto por Bronner (1997). Se realiza un análisis cualitativo del trabajo matemático desarrollado por los estudiantes en estas actividades, fundamentado en el marco de la teoría de Espacios de Trabajo Matemático. Los resultados evidencian que la activación de la génesis instrumental con el artefacto tecnológico supera al artefacto simbólico, sin que haya una confrontación de lo obtenido con la TIC, propiciando un ambiente de confusión entre número y su valor aproximado.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "libro", "titulo": "Mathematical Work in Educational Context", "autores": ["Kuzniak A.", "Montoya E.", "R. Richard P."], "autores_adretm": ["RICHARD Philippe R.", "KUZNIAK Alain", "MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Université Paris Cité", "Laboratoire de Mathématiques d'Orsay", "LDAR", "Pontificia Universidad Católica de Valparaíso", "Université de Montréal"], "pais": ["FR", "CL", "CA"], "doi": "10.1007/978-3-030-90850-8", "enlace": "https://doi.org/10.1007/978-3-030-90850-8", "resumen": "", "palabras_clave": ["Mathematical Theory"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Mathematical Work and Beyond", "autores": ["Victoria Flores Salazar J.", "Kuzniak A.", "Montoya E.", "Nechache A.", "R. Richard P.", "Vivier L."], "autores_adretm": ["NECHACHE Assia", "KUZNIAK Alain", "VIVIER Laurent", "RICHARD Philippe R.", "FLORES SALAZAR Jesús", "MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Pontificia Universidad Católica del Perú", "Université Paris Cité", "Pontificia Universidad Católica de Valparaíso", "Balıkesir University", "Université de Montréal"], "pais": ["PE", "FR", "CL", "CA"], "doi": "10.1007/978-3-030-90850-8_12", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_12", "resumen": "", "palabras_clave": ["Mathematical Theory"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "La derivada como velocidad instantánea desde el Espacio de Trabajo Matemático", "autores": ["Verónica Ángel Cerda M.", "Menares R."], "autores_adretm": ["MENARES Romina"], "directores": [], "anio": 2022.0, "fuente": "Rematec", "institucion": ["Universidad San Sebastián", "Universidad de Valparaíso"], "pais": ["CL"], "doi": "10.37084/rematec.1980-3141.2022.n42.p16-28.id448", "enlace": "https://doi.org/10.37084/rematec.1980-3141.2022.n42.p16-28.id448", "resumen": "En la presente investigación, enmarcada en un estudio de clases de japonés (Isoda et al., 2007), se ha diseñado una clase centrada en el objeto derivada. La clase elaborada tiene como objetivo comprender la derivada como velocidad instantánea a través de una aplicación a la física. Esta clase se implementó en un curso universitario de primer año (18-20 años). Los análisis se realizan desde la perspectiva del acercamiento de los estudiantes a los Espacios de Trabajo Matemático Personal (Kuzniak, 2011; Kuzniak et al., 2016), que muestra una preponderancia en el trabajo semiótico instrumental. En cuanto a los errores podemos mencionar que los estudiantes confunden la noción de velocidad media con la de velocidad instantánea, lo que da cuenta de una debilidad como conceptos del área de la física que dominan los estudiantes.", "palabras_clave": ["Instant"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "The Idoine or Suitable MWS as an Essential Transitional Stage Between Personal and Reference Mathematical Work", "autores": ["Henríquez-Rivas C.", "Kuzniak A.", "Masselin B."], "autores_adretm": ["KUZNIAK Alain", "MASSELIN Blandine", "HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Universidad Católica del Maule", "Université Paris Cité", "LDAR"], "pais": ["CL", "FR"], "doi": "10.1007/978-3-030-90850-8_6", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_6", "resumen": "", "palabras_clave": ["Mathematical problem|Divergence (linguistics)"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "classic recursive sequence calculus task at the secondary-tertiary level in France", "autores": ["Flores González, M.", "Vandebrouck, F.", "Vivier, L."], "autores_adretm": ["VANDEBROUCK Fabrice", "VIVIER Laurent"], "directores": [], "anio": 2022.0, "fuente": "International Journal of Mathematical Education in Science and Technology", "institucion": ["Université Paris Cité"], "pais": ["FR"], "doi": "10.1080/0020739x.2021.2014583", "enlace": "https://doi.org/10.1080/0020739X.2021.2014583", "resumen": "Our work focuses on the transition from high school to university in the field of calculus. In France, recursive sequences are studied as one of the classical exercises in both institutions. Their studies use different theorems and notions, such as functions, convergence, monotonicity, induction, etc. The work expected at this transition requires the development of recognition and control activities on the part of the students. We propose a new task allowing the development of such activities from a dialectic between two paradigms of analysis using the calculator. We highlight that students at the end of high school have difficulties in studying these sequences, and they do not easily develop the activities of recognition and control independently. This could cause problems in understanding recursive sequences at the beginning of university.", "palabras_clave": ["Mathematical work", "paradigmma", "thematical activities", "Activity Theory", "control"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", lores Salazar J.", "Gaona J.", "R. Richard P."], "autores_adretm": ["RICHARD Philippe R.", "FLORES SALAZAR Jesús", "GAONA Jorge"], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Pontificia Universidad Católica del Perú", "Universidad de Playa Ancha", "Université de Montréal"], "pais": ["PE", "CL", "CA"], "doi": "10.1007/978-3-030-90850-8_8", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_8", "resumen": "", "palabras_clave": ["Realisation|Mathematical problem|Mathematical Theory"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Personal Mathematical Work and Personal MWS", "autores": ["Menares R.", "Vivier L."], "autores_adretm": ["VIVIER Laurent", "MENARES Romina"], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Universidad de Valparaíso", "Université Paris Cité", "LDAR"], "pais": ["CL", "FR"], "doi": "10.1007/978-3-030-90850-8_5", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_5", "resumen": "", "palabras_clave": ["Reflection"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Local visualization of functions in work on optimization", "autores": ["Soledad López S.", "Vivier L."], "autores_adretm": ["VIVIER Laurent", "LÓPEZ Soledad"], "directores": [], "anio": 2022.0, "fuente": "Teaching Mathematics and its Applications An International Journal of the IMA", "institucion": ["Universidad de Viña del Mar", "Université Paris-Est Créteil", "Université Paris Cité", "Université de Lille", "Balıkesir University", "LDAR", "Université de Rouen Normandie"], "pais": ["CL", "FR"], "doi": "10.1093/teamat/hrac022", "enlace": "https://doi.org/10.1093/teamat/hrac022", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Análisis de una tarea sobre sucesiones desde el uso de las herramientas y el conocimiento matemático del profesor", "autores": ["Verdugo-Hernández P.", "Espinoza-Vásquez G.", "Carrillo J."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula", "ESPINOZA-VÁSQUEZ Gonzalo"], "directores": [], "anio": 2022.0, "fuente": "Enseñanza de las Ciencias Revista de investigación y experiencias didácticas", "institucion": ["Universidad Adventista de Chile", "Pontificia Universidad Católica de Valparaíso", "Universidad de Talca"], "pais": ["CL", "ES"], "doi": "10.5565/rev/ensciencias.3457", "enlace": "https://doi.org/10.5565/rev/ensciencias.3457", "resumen": "El estudio en conjunto del espacio de trabajo matemático (ETM) y del conocimiento especializado del profesor de matemáticas (MTSK) ha mostrado potencial para comprender la actividad matemática del profesor. Utilizando este potencial, se estudia el uso de distintos tipos de herramientas (teóricas, semióticas y operacionales) y el conocimiento que el profesor moviliza cuando desarrolla una tarea matemática. El objetivo de este escrito es caracterizar el trabajo matemático del profesor en relación con el desarrollo de una tarea y el conocimiento que esta moviliza. Se trata de un estudio de caso en el que se analiza una tarea en el tema de sucesiones junto al desarrollo que propone un profesor universitario. Los resultados permiten evidenciar una relación entre herramientas y conocimientos que contribuye a la comprensión de la práctica del profesor y profundiza en la conexión entre ambos modelos.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Valor Epistémico de Tareas Diseñadas en un Sistema de Evaluación en Línea con Retroalimentación para Matemáticas", "autores": ["Gaona J.", "Vivier L."], "autores_adretm": ["GAONA Jorge", "VIVIER Laurent"], "directores": [], "anio": 2022.0, "fuente": "Rematec", "institucion": ["Universidad de Playa Ancha", "Université Paris Cité"], "pais": ["CL", "FR"], "doi": "10.37084/rematec.1980-3141.2022.n42.p111-138.id453", "enlace": "https://doi.org/10.37084/rematec.1980-3141.2022.n42.p111-138.id453", "resumen": "La participación de los profesores en el diseño de recursos digitales ha cobrado importancia el último tiempo, particularmente en el diseño de recursos para la evaluación en línea. Este artículo busca caracterizar el valor epistémico de un conjunto de tareas diseñadas y programadas por un dos profesores en un sistema de evaluación en línea para matemáticas en una institución de educación superior en Chile. El valor epistémico es estudiado a través del Espacio de Trabajo Matemático idóneo potencial mediante un análisis cualitativo de los enunciados de las tareas diseñadas, las retroalimentaciones y los algoritmos que los definen. Los resultados muestran que se privilegia un trabajo instrumental incluso en tareas donde se usan registros gráficos. También, aparecieron fenómenos particulares ligados a la parametrización y programación de tareas, los cuales impactan el valor epistémico de estas.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Avances En La Relación Entre Mtsk Y Espacios De Trabajo Matemático", "autores": ["Espinoza-Vásquez G.", "Verdugo-Hernández P.", "Henríquez-Rivas C.", "Ponce R."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula", "HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2022.0, "fuente": "Dykinson eBooks", "institucion": ["Universidad de Talca", "Universidad Católica del Maule"], "pais": ["CL"], "doi": "10.2307/j.ctv2zp4vp1.24", "enlace": "https://doi.org/10.2307/j.ctv2zp4vp1.24", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Analisis de una tarea sobre sucesiones desde el uso de las herramientas y el conocimiento matematico del professor", "autores": ["Verdugo-Hernandez P.", "Espinoza-Vasquez G.", "Yanez J.C."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula", "ESPINOZA-VÁSQUEZ Gonzalo"], "directores": [], "anio": 2022.0, "fuente": "Ensenanza de las Ciencias", "institucion": ["Escuela de Pedagogia en Ciencias Naturales y Exactas", "Departamento de Pedagogias Medias y Didacticas Especificas", "Departamento de Didacticas Integradas"], "pais": ["CL", "ES"], "doi": "10.5565/rev/ensciencias.3457", "enlace": "https://doi.org/10.5565/REV/ENSCIENCIAS.3457", "resumen": "The complement of the mathematical working space (MWS) and the mathematics teacher's specialized knowledge (MTSK) has shown the potential to understand the teacher's mathematical activity. This paper aims to characterize the teacher's mathematical work on solving a task and the knowledge that it mobilizes. More precisely, we study the use of different kinds of tools (theoretical, semiotic, and operational) and the mobilized knowledge of the teacher when resolve a mathematical task. It is a case study in which a task about sequences and its resolution proposed by a university professor are analyzed. Findings show a relationship between tools and knowledge that contribute to understanding the teacher's practice and deepen the connection between both models. © 2022 Universitat Autonoma de Barcelona. All rights reserved.", "palabras_clave": ["Mathematical working space", "Mathematics teacher's specialized knowledge", "Networking theories", "Sequences", "Tools"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Prospective mathematics teachers learning complex numbers using technology", "autores": ["Gaona J.", "Soledad López S.", "Montoya E."], "autores_adretm": ["GAONA Jorge", "MONTOYA DELGADILLO Elizabeth", "LÓPEZ Soledad"], "directores": [], "anio": 2022.0, "fuente": "International Journal of Mathematical Education in Science and Technology", "institucion": ["Universidad de Playa Ancha", "Universidad de Viña del Mar", "Pontificia Universidad Católica de Valparaíso"], "pais": ["CL"], "doi": "10.1080/0020739x.2022.2133021", "enlace": "https://doi.org/10.1080/0020739x.2022.2133021", "resumen": "", "palabras_clave": ["Articulation (sociology)|Mathematical problem|Public university"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "LAS REPRESENTACIONES DE LA FUNCIÓN DURANTE LA ENSEÑANZA Una mirada desde el conocimiento especializado y el trabajo matemático del profesor", "autores": ["Espinoza-Vásquez G.", "Verdugo-Hernández P."], "autores_adretm": ["ESPINOZA-VÁSQUEZ Gonzalo", "VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2022.0, "fuente": "Human Review. International Humanities Review / Revista Internacional de Humanidades", "institucion": ["Universidad Alberto Hurtado", "Universidad de Playa Ancha"], "pais": ["CL"], "doi": "10.37467/revhuman.v11.4082", "enlace": "https://doi.org/10.37467/revhuman.v11.4082", "resumen": "This study aims at teachers’ knowledge and mathematical work during function representations teaching through the joint use of two theoretical models. In concrete, a session for the 1st year of secondary education (14-15 years old) given by a mathematics teacher with the category of expert is analyzed. The results show the relationship between the mathematical work proposed in the classroom and the knowledge that this organization allows, contributing elements to the understanding of the teaching practice. © GKA Ediciones, authors.", "palabras_clave": ["Function concept", "Initial teacher training", "Mathematical working space", "Mathematics teacher’s specialized knowledge", "Networking theories", "Representations", "Tools"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "The Theory of Mathematical Working Spaces—Theoretical Characteristics", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Université Paris Cité", "LDAR"], "pais": ["FR"], "doi": "10.1007/978-3-030-90850-8_1", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_1", "resumen": "", "palabras_clave": ["Mathematical Theory|Mathematical structure|Mathematical problem"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The Mathematical Work of Chilean Secondary Teachers in the Domain of Probability", "autores": ["Pérez K.M.", "Delgadillo E.M."], "autores_adretm": ["MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2022.0, "fuente": "Canadian Journal of Science, Mathematics and Technology Education", "institucion": ["Mathematics Institute"], "pais": ["CL"], "doi": "10.1007/s42330-022-00235-0", "enlace": "https://doi.org/10.1007/s42330-022-00235-0", "resumen": "The objective of this qualitative research is to study the mathematical work when solving a mathematical task in the domain of probability presented by Chilean high school mathematics teachers in pre-service and in-service training. We consider as theoretical support the Mathematical Working Space model and methodological design of a collective case study, comprising of five teachers in pre-service training and eight teachers in in-service training. This research design allows us to analyze mathematical objects under semiotic, instrumental, and discursive dimensions, identifying privileged vertical planes, the paradigm applied, and the different strategies used by teachers. The task presented to the participants allows two different correct answers depending on the interpretation of the random experiment in question. Since the definition of the random experiment involved in the task is of utmost importance, according to our results, this notion was not evident in all the productions analyzed, which issue poses a challenge for the teaching and learning of probability. © 2022, Ontario Institute for Studies in Education (OISE).", "palabras_clave": ["Mathematics teachers in in-service and pre-service training", "Probability Working Space"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Methodological Aspects in the Theory of Mathematical Working Spaces", "autores": ["Nechache A.", "María Gómez Chacón I."], "autores_adretm": ["NECHACHE Assia", "GÓMEZ-CHACÓN Inés Mª"], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Balıkesir University", "LDAR", "Universidad Complutense de Madrid"], "pais": ["FR", "ES"], "doi": "10.1007/978-3-030-90850-8_2", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_2", "resumen": "", "palabras_clave": ["Mathematical Theory"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "The Theory of Mathematical Working Spaces in Brief", "autores": ["Kuzniak A.", "Nechache A.", "R. Richard P."], "autores_adretm": ["NECHACHE Assia", "KUZNIAK Alain", "RICHARD Philippe R."], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Université Paris Cité", "Balıkesir University", "LDAR", "Université de Montréal"], "pais": ["FR", "CA"], "doi": "10.1007/978-3-030-90850-8_3", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_3", "resumen": "", "palabras_clave": ["Glossary|Basis (linear algebra)"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The Frequentist Approach of Probability, from Random Experiment to Sampling Fluctuation", "autores": ["Trunkenwald J.", "Moungabio F.M.", "Laval D."], "autores_adretm": ["TRUNKENWALD Jannick", "LAVAL Dominique"], "directores": [], "anio": 2022.0, "fuente": "Canadian Journal of Science, Mathematics and Technology Education", "institucion": ["LDAR – Université Diderot Paris 7", "Université Marien Ngouabi", "Balıkesir University"], "pais": ["FR", "CG"], "doi": "10.1007/s42330-022-00230-5", "enlace": "https://doi.org/10.1007/s42330-022-00230-5", "resumen": "This article deals with an introduction of probability at school through sensory modalities. This approach is based on sampling fluctuation with empirical observations of frequencies. Initially, we analyze how students from high school work on such a task by using dice, pencil, and paper. We then identify the use of schemas and data visualization by students. Considering schemas as a primitive form of algorithmic approaches, we observe interaction with mathematics. In class, students know how to use notion of frequency, but linking frequencies with probability appears to be a difficult issue. This absence of a statistical link leads us to identify entry points for probability teaching. We then decide to analyze primary school students when they have to explore a random experiment by using statistics. © 2022, Ontario Institute for Studies in Education (OISE).", "palabras_clave": ["Frequencies", "Mathematical work space", "Probability", "Sample"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "The Reference Mathematical Working Space", "autores": ["Montoya E.", "G. Reyes Avendaño C."], "autores_adretm": ["REYES AVENDAÑO Claudia", "MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Pontificia Universidad Católica de Valparaíso", "Universidad Nacional Autónoma de México"], "pais": ["CL", "MX"], "doi": "10.1007/978-3-030-90850-8_4", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_4", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Articulating the Blomhøj Modelling Cycle and the Mathematical Working Spaces. Analysis of a Task in Higher Education", "autores": ["Verdugo-Hernández P.", "Huincahue J.", "Cumsille P.", "Nechache A."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula", "NECHACHE Assia"], "directores": [], "anio": 2022.0, "fuente": "Acta Scientiae", "institucion": ["Universidad de Talca", "Universidad Católica del Maule", "Universidad del Bío-Bío", "Balıkesir University"], "pais": ["CL", "FR"], "doi": "10.17648/acta.scientiae.7135", "enlace": "https://doi.org/10.17648/acta.scientiae.7135", "resumen": "Background: The Mathematical Working Spaces (MWS) theoretical framework has developed a growing interest in how mathematical modelling is recognised, analysed, and articulated from its theoretical and empirical scopes. Given the articulations identified in the literature, it is interesting to determine whether new networks with the MWS provide powerful strategies for analysing mathematical modelling task resolution. Objective: to characterise the modelling activity from the network composed by the Blomhøj modelling cycle and the MWS in engineering students. Design: This work is a case study with a qualitative approach, which analyses the resolution of a modelling task through the proposed network. Setting and participants: The experimentation was carried out in an integral calculus course for a computer civil engineering career at a Chilean university. Modelling practices are not usual in this second-year subject, although enhancing their use in professional education is necessary. Data collection and analysis: We collected the written records of the students, selecting one to perform the in-depth analysis due to its high representativeness and clarity, as evidenced in the documents. Three steps were followed to characterise the modelling activity in the written record: description, analysis, and interpretation. Results: The Blomhøj modelling cycle might present connections with the MWS at the formulation of the problem and not only at the systematisation, which is a novelty in this field of research. Conclusions: A novel approach with which to develop the network between the MWS and modelling emerges, emphasising the investigation of mathematical problems using the student’s reality in higher education. © 2022 Lutheran University of Brazil. All rights reserved.", "palabras_clave": ["Blomhøj modelling cycle", "Mathematical Working Spaces (MWS)", "modelling tasks", "MWS-modelling complementarity"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "The Theory of Mathematical Working Spaces: Theoretical Environment, Epistemological Stance and Dialogue with Other Theories", "autores": ["Kuzniak A.", "Montoya E.", "Vivier L."], "autores_adretm": ["VIVIER Laurent", "KUZNIAK Alain", "MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2022.0, "fuente": "Mathematics education in the digital era", "institucion": ["Université Paris Cité", "LDAR", "Pontificia Universidad Católica de Valparaíso"], "pais": ["FR", "CL"], "doi": "10.1007/978-3-030-90850-8_7", "enlace": "https://doi.org/10.1007/978-3-030-90850-8_7", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Influence of a Function’s Coefficients and Feedback of the Mathematical Work When Reading a Graph in an Online Assessment System", "autores": ["Gaona J.", "Hernández R.", "Guevara F.", "Bravo V."], "autores_adretm": ["GAONA Jorge"], "directores": [], "anio": 2022.0, "fuente": "International Journal of Emerging Technologies in Learning", "institucion": ["Departamento de Pedagogía", "Facultad de Ingeniería y Ciencias", "Facultad de Ingeniería"], "pais": ["CL"], "doi": "10.3991/ijet.v17i20.32641", "enlace": "https://doi.org/10.3991/ijet.v17i20.32641", "resumen": "This paper shows the results of an experiment applied to 170 students from two Chilean universities who solve a task about reading a graph of an affine function in an online assessment environment where the parameters (coefficients of the graphed affine function) are randomly defined from an ad-hoc algorithm, with automatic correction and automatic feedback. We distinguish two versions: one of them with integer coefficients and the other one with decimal coefficients in the affine function. We observed that the nature of the coefficients impacts the mathematical work used by the students, where we again focus on two of them: by direct estimation from the graph or by calculating the equation of the line. On the other hand, feedback oriented towards the “estimation” strategy influences the mathematical work used by the students, even though a non-negligible group persists in the “calculating” strategy, which is partly explained by the perception of each of the strategies. © 2022, International Journal of Emerging Technologies in Learning. All Rights Reserved.", "palabras_clave": ["Digital technology", "Distance education and online learning", "Mathematical activity", "Post-secondary education", "Task design"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Función exponencial: análisis del trabajo matemático de estudiantes de humanidades", "autores": ["Luis Vivas-Pachas J.", "Victoria Flores Salazar J."], "autores_adretm": ["FLORES SALAZAR Jesús", "VIVAS PACHAS Jorge"], "directores": [], "anio": 2022.0, "fuente": "Quintaesencia", "institucion": ["Pontificia Universidad Católica del Perú"], "pais": ["PE"], "doi": "10.54943/rq.v12i1.25", "enlace": "https://doi.org/10.54943/rq.v12i1.25", "resumen": "El presente reporte de investigación, presenta un recorte de la tesis de maestría del primer autor;tiene como objetivo analizar el trabajo matemático de estudiantes de carreras de humanidades cuando resuelven una tarea sobre función exponencial. Para ello, nos fundamentamos en la teoría del Espacio de Trabajo Matemático (ETM) y tomamos el método del ETM para el análisis. La investigación se realizó con estudiantes del primer ciclo de carreras de humanidades (16 y 18 años) de una universidad privada de Lima-Perú, en la que se elaboró una tarea sobre función exponencial. En base al análisis de las acciones matemáticas, se evidencia laactivación de las génesis semiótica, instrumental y discursiva, siendo las génesis semiótica y discursiva las más frecuentes. Asimismo, se evidencia la activación de dos planos verticales el semiótico-discursivo y el instrumental-discursivo del ETM.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Profundización en el trabajo geométrico de futuros profesores en entornos tecnológicos y de lápiz y papel", "autores": ["Henríquez-Rivas C.", "Kuzniak A."], "autores_adretm": ["KUZNIAK Alain", "HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2021.0, "fuente": "Bolema Boletim de Educação Matemática", "institucion": ["Universidad Católica del Maule", "Université Paris Cité", "LDAR"], "pais": ["CL", "FR"], "doi": "10.1590/1980-4415v35n71a15", "enlace": "https://doi.org/10.1590/1980-4415v35n71a15", "resumen": "Resumen Este artículo presenta los resultados de un estudio de caso sobre el trabajo geométrico desarrollado por estudiantes en formación inicial de pedagogía en matemáticas (futuros profesores). Proponemos una tarea geométrica con uso de lápiz y papel, y una tarea en versión adaptada para ambientes tecnológicos. Los análisis se sustentan en el marco del Espacio de Trabajo Matemático (ETM), que permite profundizar en los procesos cognitivos y aspectos epistemológicos desarrollados en el trabajo. Los resultados muestran diferencias entre el ETM previsto y ETM personal de los futuros profesores participantes y el privilegio de fases de trabajo matemático específicas. Con ello, aportamos con un cuerpo de conocimiento sobre el análisis del trabajo geométrico y, con un marco teórico y metodológico que permite profundizar en el trabajo matemático de personas que resuelven tareas específicas.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Análisis del discurso de los profesores en formación en un contexto de innovación pedagógica en geometría", "autores": ["M. Fortuny J.", "Recio T.", "R. Richard P.", "Roanes–Lozano E."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2021.0, "fuente": "Annales de didactique et de sciences cognitives", "institucion": ["Université de Montréal"], "pais": ["ES", "CA"], "doi": "10.4000/adsc.1168", "enlace": "https://doi.org/10.4000/adsc.1168", "resumen": "The reflective narratives of three pre-service teachers are analysed from the perspective of discourse analysis and reflection on practice, applied to the acquisition of geometric competences and the role of dynamic geometry. In the context of the master's degree for future secondary school teachers in mathematics and a pedagogical innovation project, where two of the authors gave training sessions entitled ‘automated visualization’ and ‘technological mediation’, the pre-service teachers were given a questionnaire in which they were asked to return to what they had learned, questioning the contribution of their training to their future teaching practice. In the narratives collected, three degrees of reflection can be found, ranging from the naivety of certain assessments to professional initiatives and purely mathematical perspectives. The didactical and mathematical consequences of this analysis are presented and discussed, highlighting, in particular, the intrinsic difficulty of ensuring that relevant, but potentially disruptive, ideas of pedagogical innovation are conveyed to pre-service teachers against the weight of tradition and personal beliefs in mathematics teaching.", "palabras_clave": ["Reflection"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Trabajo matemático de profesores universitarios: Heurísticas de solución de una tarea", "autores": ["Henríquez-Rivas C.", "Guerrero-Ortiz C.", "Barrera A.Á."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2021.0, "fuente": "Educacion Matematica", "institucion": ["Departamento de Matemática", "Instituto de Matemáticas", "Departamento de Ingeniería Matemática"], "pais": ["CL"], "doi": "10.24844/em3303.09", "enlace": "https://doi.org/10.24844/EM3303.09", "resumen": "The study of tasks and the actions arising as a result of working with them play an important role for enhancing the learning of mathematics. This research aims to characterize the mathematical work of university teachers who develop a task with a context close to reality. For this purpose, we consider their development especially in the world of mathematics. Based on two research perspectives, Modelling and Mathematical Workspace, we present a collective instrumental case study that allows us to analyze the solution processes of three teachers. The results show how the exhibited activity is determined by the characteristics of the epistemology of the participants’ professional work. The research concludes with a discussion of some contributions to mathematics education, in terms of the theoretical scope given by the coordination of the two perspectives and the use of tasks, as well as the possibilities offered by their implementation in various educational contexts and in teaching practice. © 2021 Mexican Society for Research and Dissemination of Mathematics Education. All rights reserved.", "palabras_clave": ["Heuristics solving", "Mathematical work", "Modelling", "Task", "University professor"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Una lección sobre el teorema de Thales, vista desde el conocimiento especializado del profesor", "autores": ["Climent N.", "Espinoza-Vásquez G.", "Carrillo J.", "Henríquez-Rivas C.", "Ponce R."], "autores_adretm": ["ESPINOZA-VÁSQUEZ Gonzalo", "HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2021.0, "fuente": "Educacion Matematica", "institucion": ["Didáctica de la Matemática", "Instituto de Matemáticas", "Facultad de Ciencias de la Educación", "Instituto de Matemática y Física"], "pais": ["ES", "CL"], "doi": "10.24844/em3301.04", "enlace": "https://doi.org/10.24844/EM3301.04", "resumen": "Abstrac: This paper presents the analysis of an observed lesson on Thales's Theorem in a Chilean secondary school, using the Mathematics Teacher's Specialised Knowledge (MTSK) model. We consider various aspects of the teacher's specialised knowledge with respect to Thales's Theorem itself, as an element of teaching and learning, and to demonstrations, as a mathematical practice, in general. From this analysis, and guided by the Chilean syllabus requirement for this topic, we construct a snapshot of the interrelated elements of knowledge deployed by the teacher, which enables us to account for how he brings particular aspects into focus. The findings show that the utility which he attaches to the theorem, that of being able to apply it, alongside his view of it as a result of similarity and his emphasis on a numerical approach, is closely linked to his knowledge of registers, the interconnections he makes with other content items, his use of resources, the kind of tasks he sets up, and the knowledge of mathematical practices he makes evident. © 2021 Mexican Society for Research and Dissemination of Mathematics Education. All rights reserved.", "palabras_clave": ["Mathematics teaching practices", "Secondary education", "Similarity", "Teacher knowledge", "Thales's theorem"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Trabajo matemático de un profesor basado en tareas y ejemplos propuestos para la enseñanza", "autores": ["Rivas C.H.", "Ponce R.", "Yáñez J.C.", "Climent N.", "Espinoza-Vásquez G."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina", "ESPINOZA-VÁSQUEZ Gonzalo"], "directores": [], "anio": 2021.0, "fuente": "Ensenanza de las Ciencias", "institucion": ["Facultad de Ciencias de la Educación", "Instituto de Matemáticas", "Departamento de Didácticas Integradas"], "pais": ["CL", "ES"], "doi": "10.5565/rev/ensciencias.3210", "enlace": "https://doi.org/10.5565/rev/ensciencias.3210", "resumen": "The use of tasks and examples is a fundamental practice in the teacher's work in the classroom when it comes to teaching a content. The objective of this article is to characterize the mathematical work that a teacher proposes from the tasks and examples that he or she considers for the teaching of a geometric theorem. For this purpose, the suitable mathematical workspace of a secondary school teacher participating in a training workshop is analyzed. A case study is presented based on a unique case design, through video recordings and observations. The results reveal the privilege of algebraic treatments based on figurative representations, and a proposed change that involves the use of technological tools. Finally, contributions to the study of the teacher's mathematical work in the classroom focused on the use of tasks and examples are discussed. © 2021 Universitat Autonoma de Barcelona. All rights reserved.", "palabras_clave": ["Examples", "Suitable mathematical workspace", "Tasks", "Teacher", "Theorem of Thales"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Les espaces de travail connectés : une perspective nouvelle pour la modélisation dans le secondaire?", "autores": ["Lagrange J.-B."], "autores_adretm": [], "directores": [], "anio": 2021.0, "fuente": "Canadian Journal of Science, Mathematics and Technology Education", "institucion": ["LDAR"], "pais": ["FR"], "doi": "10.1007/s42330-020-00130-6", "enlace": "https://doi.org/10.1007/s42330-020-00130-6", "resumen": "Our interest is in the development of modeling activities that link knowledge in various mathematical fields and other scientific disciplines. Looking at mathematics education, research we highlight the benefits and limitations of “problem-solving” and of approaches that involve translation between the real world and mathematics. Science education seldom takes mathematics into account. Its contribution is the conception of an “empirical referent”. Using epistemological studies, we highlight examples of modeling situations supported by a plurality of models and an organization of work that allows students to engage with them. To do this we adopt the theoretical framework of connected working spaces. A case study shows how students create linkages between the workspaces and the benefits of the connections on their understanding of concepts at stake. © 2021, Ontario Institute for Studies in Education (OISE).", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Argumentation of Prospective Mathematics Teachers in Fraction Tasks Mediated by an Online Assessment System With Automatic Feedback", "autores": ["Gaona J.", "Menares R."], "autores_adretm": ["GAONA Jorge", "MENARES Romina"], "directores": [], "anio": 2021.0, "fuente": "Eurasia Journal of Mathematics, Science and Technology Education", "institucion": ["Centro de Estudios Avanzados", "Instituto de Matemáticas"], "pais": ["CL"], "doi": "10.29333/ejmste/11425", "enlace": "https://doi.org/10.29333/EJMSTE/11425", "resumen": "This article reports the argumentation work of a group of trainee
