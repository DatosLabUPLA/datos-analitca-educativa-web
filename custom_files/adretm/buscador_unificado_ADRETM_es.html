"institucion": ["Université Laurentienne"], "pais": ["CA"], "doi": "10.1007/s11858-016-0811-y", "enlace": "https://doi.org/10.1007/s11858-016-0811-y", "resumen": "This article is a commentary on the mathematical working space (MWS) approach and draws on the articles contained in this ZDM issue. The article is divided into three parts. In the first part I discuss the place of the MWS approach among the French theories of didactique des mathématiques. In the second part I outline what I think are the central ideas of the MWS approach. I conclude the article with a sketch of what seems to me to be its accomplishments and challenges, focusing mainly on the epistemological and cognitive stances that the MWS approach conveys in order to elucidate the manner in which this approach theoretically assumes that things are known and learned. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Activity Theory", "Cognition", "Collective versus individual learning", "Conceptions of the student", "Epistemology"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Facilitating the genesis of functional working spaces in guided explorations", "autores": ["Miranda V.C.", "Pluvinage F.", "Adjiage R."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["Centro de Investigacion y de Estudios Avanzados del Instituto Politecnico Nacional", "IREM Strasbourg"], "pais": ["MX", "FR"], "doi": "10.1007/s11858-016-0791-y", "enlace": "https://doi.org/10.1007/s11858-016-0791-y", "resumen": "Approximating given real-valued functions by affine functions is among the most basic activities with functions. In this study we examine two contexts in which two such approximations are performed. The first involves a microscopic representation of functions for the study of tangents; the second a macroscopic representation of functions for the study of asymptotes. In the proposed research, we conducted three sessions to observe how small groups of college freshmen worked in a setting of multiple dynamical representations including algebraic, graphic and CAS (computer algebra system) views. This enabled the observation of individual Mathematical Working Spaces (iMWS). The analysis of students’ answers leads us to propose an enrichment of the MWS model. Specifically, this analysis suggests that educational resources could foster the geneses described in the MWS model: observation for visualizing, drawing for constructing and justification for proving. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Asymptote", "Calculus", "Mathematical Working Spaces", "Tangent", "Zoom in", "Zoom out"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Mathematical working spaces through networking lens", "autores": ["Artigue M."], "autores_adretm": [], "directores": [], "anio": 2016.0, "fuente": "ZDM - Mathematics Education", "institucion": ["LDAR"], "pais": ["FR"], "doi": "10.1007/s11858-016-0810-z", "enlace": "https://doi.org/10.1007/s11858-016-0810-z", "resumen": "This issue of ZDM collects research works sharing a common reference to the theoretical framework of Mathematical Working Spaces (MWS), a construction which emerged about one decade ago, and has progressively found its way in the mathematics education community, thanks to the collaborative work of an international group of researchers. In this reaction paper, I approach this new theoretical construction, using the concept of research praxeology which has been introduced to support practices of networking between theoretical approaches. After a short introduction, in the first section of this reaction paper, I introduce this concept and explain how it shapes my reading of the different contributions, before expressing the vision of the MWS framework and of its educational potential it leads to. In the final section, I point out some questions and challenges regarding the MWS theoretical framework emerging from the use of this specific lens. © 2016, FIZ Karlsruhe.", "palabras_clave": ["Anthropological theory of the didactic", "Mathematical working spaces", "Networking between theories", "Research praxeology"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Understanding the Nature of the Geometric Work Through Its Development and Its Transformations", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2015.0, "fuente": "Springer eBooks", "institucion": ["Université Paris Cité", "LDAR"], "pais": ["FR"], "doi": "10.1007/978-3-319-17187-6_1", "enlace": "https://doi.org/10.1007/978-3-319-17187-6_1", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Spaces For Geometric Work: Figural, Instrumental, And Discursive Geneses Of Reasoning In A Technological Environment", "autores": ["Gómez-Chacón I.M.", "Kuzniak A."], "autores_adretm": ["GÓMEZ-CHACÓN Inés Mª", "KUZNIAK Alain"], "directores": [], "anio": 2015.0, "fuente": "International Journal of Science and Mathematics Education", "institucion": ["Facultad de Ciencias Matemáticas", "LDAR"], "pais": ["ES", "FR"], "doi": "10.1007/s10763-013-9462-4", "enlace": "https://doi.org/10.1007/s10763-013-9462-4", "resumen": "The main goal of this research was to assess the effect of a dynamic environment on relationships between the three geneses (figural, instrumental, and discursive) of Spaces for Geometric Work. More specifically, it was to determine whether the interactive geometry program GeoGebra could play a specific role in the geometric work of future teachers. The training reveals education students’ use of intuitive and deductive reasoning as well as their degree of cognitive flexibility in using different facets of geometrical work. The study shows that a perspective on the development of geometric reasoning must be integrated in the development of skills for future teachers. In particular, a focus on the construction of a discursive genesis linked with elements of figural genesis must be added to the traditional focus on instrumental genesis. This reasoning requires in particular a reflection on the role of properties in developing a form of geometry directed by practical (Geometry I) or more axiomatic (Geometry II) goals. © 2013, National Science Council, Taiwan.", "palabras_clave": ["geometry", "initial teacher training", "mathematics", "professional knowledge", "Space for Geometric Work", "technological environment"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Espacios de trabajo geométrico sintético y analítico de profesores y su práctica en el aula", "autores": ["Rivas C.H.", "Delgadillo E.M."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina", "MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2015.0, "fuente": "Ensenanza de las Ciencias", "institucion": ["Instituto de Matemáticas"], "pais": ["CL"], "doi": "10.5565/rev/ensciencias.1408", "enlace": "https://doi.org/10.5565/rev/ensciencias.1408", "resumen": "In this paper we show the results of a study in relation to the mathematical work and practice of two novice teachers, when the classroom topic involved the differing views related to synthetic and analytic Euclidean geometry. We present the ideal mathematical working space (MWS) for each teacher, specifically, the movements between the components of the epistemological and cognitive planes, and the privileged geometric paradigm. The results provide empirical information regarding the teaching practice when using different geometric methods and on the possibility of complementing them, and furthermore the topic is presented as a new way of studying through the MWS.", "palabras_clave": ["Geometrical paradigm", "Mathematical working", "Teacher"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Les changements de domaine dans le cadre des Espaces de Travail Mathématique", "autores": ["Montoya Delgadillo E.", "Vivier L."], "autores_adretm": ["MONTOYA DELGADILLO Elizabeth", "VIVIER Laurent"], "directores": [], "anio": 2014.0, "fuente": "Annales de didactique et de sciences cognitives", "institucion": ["Pontificia Universidad Católica de Valparaíso", "Université Paris Cité"], "pais": ["CL", "FR"], "doi": "10.4000/128a4", "enlace": "https://doi.org/10.4000/128a4", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Quel espace de travail géométrique pour l’apprentissage des propriétés au primaire ?", "autores": ["Coutat S."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Université de Genève"], "pais": ["CH"], "doi": "10.12802/relime.13.1746", "enlace": "https://doi.org/10.12802/relime.13.1746", "resumen": "This collaboration analyses the use of dynamic geometry software in the latest primary school grades (9 to 12 years old) in order to learn properties while modeling the students’ activities in geometrical working space. This modeling emphasizes the relations between different geneses and more particularly, the instrumental genesis, linked to the displacement vehicle, in relation to the video-figural genesis, linked to object visualization. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Dynamic geometry", "Geometrical working space", "Learning of geometrical properties", "Primary school geometry"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Initier un processus de preuve mathématique dans un environnement de géométrie dynamique 3D", "autores": ["Mithalal-Le Doze J."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Université Paris Cité"], "pais": ["FR"], "doi": "10.12802/relime.13.17417", "enlace": "https://doi.org/10.12802/relime.13.17417", "resumen": "This paper concerns the topic: “The mathematical work and the social and institutional aspects.” We have attempted to analyze how, in a geometrical construction activity context, the use of intellectual proof can bejustified and which way it contributes to stably insert the students’ activity in a natural geometrical axiom. In our thesis project we have shown that situations built on a 3D dynamic geometrical environment can lead the students to rely on this type of geometry. Nonetheless, this evolution would proof itself unstable, and we propose here to examine where the social interactions, and especially via discursive genesis, play a fundamental role in terms of this stability. The proof issue is central to this concern, as it seems to be consubstantial with the transition of assumed Geometry GI to parceled Geometry GII. We propose to analyze the work of three groups of students, inspired on a thesis experiment (Mithalal, 2010), with the purpose of highlighting the interactions between the material activity and the discursive genesis in the geometrical working spaces. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["3D dynamic geometrical environment", "Discursive genesis", "Geometrical working spaces", "Proof"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Conjectures, postulats et vérifications expérimentales dans le paradigme du géomètre-physicien : Comment intégrer le travail avec les LGD ?", "autores": ["Tanguay D.", "Geeraerts L."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Universite du Quebec à Montreal"], "pais": ["CA"], "doi": "10.12802/relime.13.17414", "enlace": "https://doi.org/10.12802/relime.13.17414", "resumen": "Inspired by the work of Jahnke, we considered in Tanguay & Geeraerts (2012) the geometer-physicist paradigm, and expounded how it can be used to promote classroom practices and activities allowing a more harmonious transition between GI and GII (Houdement & Kuzniak, 2006), especially by reconsidering the status of the axioms and the role of measurement. A concrete plan of action is presented, by virtue of, among others, a structured system of study cards made by the class; all this integrated in a working space customized for the démonstration. The way measurement is rehabilitated as a validating process allows a reassessment of truth stakes so that the issues of measurement reliability, of exactness versus approximation, of theory versus empiricism are explicitly taken into account and ‘problematized’. We examine in what way this issue can be fully taken into consideration by the class. We propose that the problem of graphical precision linked to the exactness of measurement provided by DGSs should be explicitly tackled. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Dynamic geometry softwarepackages", "Exact and approximate measurements", "Formal proof", "Geometer-physicist paradigm"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Espaces de travail / espaces de connaissances : Peut-on imaginer une navette pour y voyager ?", "autores": ["de Cotret S.R."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Département de didactique"], "pais": ["CA"], "doi": "10.12802/relime.13.17420", "enlace": "https://doi.org/10.12802/relime.13.17420", "resumen": "This text aims at testing the possibility to conceive the phenomenon of non-usage of the learnt knowledge, exposed and studied by the didactic of common sense, starting from the working spaces notion. It examines the hypothesis according to which this phenomenon could be related to the fact that a same problem can be approached from different working postures and spaces, and thus, from different knowledge and educations. Admitting this hypothesis, would it be possible to guide the students toward a voluntary change in posture to grant access to different perspectives of the problem and, once there, to new responses? © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Didactics of common sense", "Didactics of mathematics", "Knowledge space", "Posture", "Working space"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Un Espace de Travail Mathématique pour la mise en evidence des significations géométriques de la multiplication de nombres réels et complexes : Mediation semiotique et parcours des élèves", "autores": ["Curin R.I.B."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Université du Quebec à Montréal"], "pais": ["CA"], "doi": "10.12802/relime.13.17411", "enlace": "https://doi.org/10.12802/relime.13.17411", "resumen": "This work contributes, on one hand, to determine the didactical implications of an analysis of epistemological works on the association of numbers, calculus and geometry, and, on the other hand, to constitute a theoretical framework favoring the analysis of students’ mathematical work at the meeting point between a mathematical object and its sense in geometry. Our theoretical framework concerns mostly the Mathematical Working Space and the semiotic mediation. The analysis method will be sketched to ultimately present a part of our research results. These results relate to the determination of a personal path resulting from interactions produced among the diverse Mathematical Working Space dimensions. Their produced results draw attention to the obstacles and cues allowing the association of multiplication to certain geometrical significations. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Mathematical Working Space", "Product of real and complex numbers", "Representation records", "Semiotic mediation", "Sign-artifact", "Students’ personal paths"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Spaces for mathematical work: Viewpoints and perspectives", "autores": ["Kuzniak A.", "R. Richard P."], "autores_adretm": ["RICHARD Philippe R.", "KUZNIAK Alain"], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigación en Matemática Educativa", "institucion": ["Université de Montréal", "Université Paris Cité"], "pais": ["FR", "CA"], "doi": "10.12802/relime.13.1741b", "enlace": "https://doi.org/10.12802/relime.13.1741b", "resumen": "", "palabras_clave": ["Viewpoints"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Registros y estratos en ETM al servicio del pensamiento funcional", "autores": ["Miranda V.C.", "Pluvinage F."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["CINVESTAV"], "pais": ["MX"], "doi": "10.12802/relime.13.17413", "enlace": "https://doi.org/10.12802/relime.13.17413", "resumen": "In this article we are interested on real functions of a real variable, from the perspective of Mathematical Working Spaces (MWS). In a first part of the study, we point out observations made at various levels of teaching, which may give credit to the hypothesis that knowing algebra is not sufficient for treatments which bring the functions into play. It needs a so called functional thought, that we precise in a second part. In a third part, we present the results of an exploratory workshop aimed for high school mathematics teachers, with the purpose of go deeply into our hypothesis. The specificity of the proposed study was that participants worked in groups, all of them considering the same mathematical situation, but each group using its own tool. Groups, characterized by the tools they used, were the following: “On foot” (paper- pencil), Spreadsheet, Calculator, Symbolic Calculus software, Dynamic Geometry software. Participants realized how the use of technological tools exerts influence on the resolution processes and the management of concepts. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Functional thinking", "Information and communications technology (ICT)", "Mathematical activity", "Mathematical Working Space (MWS)"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Espaces de travail mathématique. Points de vue et perspectives", "autores": ["Kuzniak A.", "R. Richard P."], "autores_adretm": ["RICHARD Philippe R.", "KUZNIAK Alain"], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigación en Matemática Educativa", "institucion": ["Université de Montréal", "Université Paris Cité"], "pais": ["FR", "CA"], "doi": "10.12802/relime.13.1741c", "enlace": "https://doi.org/10.12802/relime.13.1741c", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Relaciones del espacio de trabajo matemático con las conversiones entre representaciones y la solución de problemas en la suma de fracciones", "autores": ["Gagatsis A.", "Deliyianni E."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["University of Cyprus", "Cyprus Pedagogical Institute"], "pais": ["CY"], "doi": "10.12802/relime.13.17412", "enlace": "https://doi.org/10.12802/relime.13.17412", "resumen": "The present study is focused on the cognitive level of Mathematical Working Space (MWS) and the component of the epistemological level related to semiotic representations in fraction addition. A test measuring students’ conversion and problem-solving ability in fraction addition was developed and administered to 388 primary and secondary school students (about 11-14 years old) three times. Multivariate analysis of variance (MANOVA) for repeated measures and implicative method revealed that the students’ performance improved as they move within primary school and within secondary school. A hiatus in performance progress is indicated, though, when the students moved from primary to secondary school. This finding is in line with a compartmentalized way of thinking indicated for this age group. Didactical implications are discussed. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Conversion", "Fraction addition", "Mathematical working space", "Problem solving", "Transition"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Quel espace de travail géométrique pour les élèves au Québec et pour les futurs enseignants ?", "autores": ["Braconne-Michoux A."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Université de Montréal"], "pais": ["CA"], "doi": "10.12802/relime.13.1744", "enlace": "https://doi.org/10.12802/relime.13.1744", "resumen": "This paper aims to describe the different geometrical working spaces related to curricula implemented in primary and secondary schools in Quebec, those which are assumed in the textbooks and classes, and that upon which a good number of teachers in early formation stages rely. It results from these different investigations that the distinction between GWS in primary and secondary schools is not clearly explicit. They seem to be based upon a parceled Geometry GII (GII/GI) but learners can succeed when working in a personal GWS proximate to an assumed Geometry (GI/gII). It stems from this report that the primary school teachers in formation function in a personal GWS close or identical to that of the primary school student. Thus, the challenge that the teacher formation early courses on didactics face is to take the prospective teachers to a personal GWS distinct from that of their future pupils. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Geometry", "Geometric working spaces", "Initial formation of primary school teachers"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Espaces de travail et résolution d’un problème de modélisation", "autores": ["Rauscher J.-C.", "Adjiage R."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Irem de Strasbourg", "Université de Strasbourg"], "pais": ["FR"], "doi": "10.12802/relime.13.1742", "enlace": "https://doi.org/10.12802/relime.13.1742", "resumen": "This article is based upon the observations, carried out within a didactic engineering framework (Adjiage & Rauscher, 2013), on the procedure of solving a modeling problem by 10-11 year-old students. Here we return to this engineering using the MWS framework (Kuzniak, 2011). This allows us to reinterpret certain phenomena, as well as to imagine more means to improve our system. Thus, we analyze the failure of certain students to succeed in terms of the empiric and theoretic referential deficit in their own personal MWS; infer evolution possibilities of the suitable MWS; interpret mental blockages in terms of dissociation of visual and experimental genesis; finally, analyze progresses in terms of capacity to integrate these two genesis through a written practice of the written (Duval, 2001). © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Mathematical working spaces", "Modeling", "Personal MWS", "Problem solving", "Suitable MWS", "Writtenpractice of the written"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Ambigüedad en la manera de ver las figuras geométricas", "autores": ["Michael-Chrysanthou P.", "Gagatsis A."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["University of Cyprus"], "pais": ["CY"], "doi": "10.12802/relime.13.1748", "enlace": "https://doi.org/10.12802/relime.13.1748", "resumen": "This paper discusses the different ways the students look at geometrical figures in solving geometrical tasks and the different types of reasoning that occur in relation to the different types of figural apprehension, in the sense of Duval, that are mobilized. The personal Geometrical Working Space (GWS) of the students at lower and upper secondary school in Cyprus is defined in respect to their way of looking at figures and the type of reasoning they produce. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Discursive-graphic Reasoning", "GraphicReasoning", "Operative Apprehension", "Perceptual Apprehension"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Espaces de travail géométrique en formation initiale de professeurs du premier degré en France et en Grèce lors d’une démarche de preuve", "autores": ["Nikolantonakis K.", "Vivier L."], "autores_adretm": ["VIVIER Laurent"], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Université de la Macédoine Ouest", "Université Denis Diderot-Paris 7"], "pais": ["GR", "FR"], "doi": "10.12802/relime.13.1745", "enlace": "https://doi.org/10.12802/relime.13.1745", "resumen": "In this paper, we study personal and adequate Geometrical Working Spaces in France and Greece for the future primary school teachers. The availability of the theorem on the equality of triangles in the suitable GWS’s makes possible to highlight different personal GWS’s with a significant difference between both French and Greek populations. A statistical study of the Greek population shows the suitable geometrical context in Greece. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Geometrical Working Space", "Teacher training", "Test", "Triangle equality"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Conception et analyse de geogebratutor, un système tutoriel intelligent : Genèse d’un espace de travail géométrique idoine", "autores": ["Tessier-Baillargeon M.", "Richard P.R.", "Leduc N.", "Gagnon M."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Département de didactique", "Département de génie informatique et génie logiciel"], "pais": ["CA"], "doi": "10.12802/relime.13.17415", "enlace": "https://doi.org/10.12802/relime.13.17415", "resumen": "This collaboration shows the enlightenment offered by the geometrical working spaces (GWS’s) model in the conception and validation of the intelligent tutorial system geogebraTUTOR (GGBT). Conceived to be used by high school students, this system is designed for the development of geometrical thought in a context issuing trial problem solving in Euclidian geometry. The paper presents initially the theoretical foundations that support he GGBT development, where the GWS’s act as a conceptual carrefour. At the very heart of our proposal, the validation of an improved GGBT version is carried out verifying the suitableness of the working space generated by the use of the tutorial system. This validation phase, inserted on a series of investigation and development stages, aims to the observation and analysis of the student’s work as a geometer in training. The experimental results come from Quebecois students undergoing the 2 grade ofhigh school (between 14 and 17 years). © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Didactics of mathematics", "Dynamic geometry", "Geometrical working spaces", "Geometricproof problems", "Intelligent tutorial system", "Student-milieu cognitive interactions"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Le travail mathématique en interaction avec un logiciel de géométrie dynamique tridimensionnelle", "autores": ["Blossier M.", "Richard P.R."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Institut de Recherche sur I’Enseignement des Mathématiques de Rouen", "Département de didactique"], "pais": ["FR", "CA"], "doi": "10.12802/relime.13.17416", "enlace": "https://doi.org/10.12802/relime.13.17416", "resumen": "It often happens that software for teaching mathematics is built on data-processing models, leaving implicit the learning models that arise from the usage of the tool and that could have helped to its conception. In the back and forth game between designers and users, if the new possibilities ofjoint development enable the software refinement according to educational needs, it promotes as well the adaptation to human behavior already used by the tool. It is not so much in represented mathematics where we should search for learning models, but it is by turning to the interactions of the one which actions “question” software medium that “answers back”. Considering student’sconceptions and the mathematical working space that emerge from real or potential interactions, our purpose aims to put on display the mathematical work generated by the use of the tridimensional dynamic geometry software GeoGebra 3D. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Conception", "Didactics of Mathematics", "Geometrical Working Space", "Instrumented modeling", "Representation", "Tridimensional dynamic geometry"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Espaces de travail en simulation d’expérience aléatoire au lycée : Une étude de cas", "autores": ["Parzysz B."], "autores_adretm": ["PARZYSZ Bernard"], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["LDAR"], "pais": ["FR"], "doi": "10.12802/relime.13.1743", "enlace": "https://doi.org/10.12802/relime.13.1743", "resumen": "Today the teaching of probability relies considerably on the use of software, particularly when it comes to simulation of diverse random experiments. This article, which refers to the theoretical framework of Kuzniak’s mathematical working spaces, studies an emblematic type of tasks frequently proposed to the French students aged 16-17 years. To accomplish these tasks, spreadsheets are used alternately as random event generator, calculator and logical tool. For this reason, the student was provided with many “technical” indications on the use of the software. Simultaneously, he must elaborate a model of the experiment, then simulate it by means of the software, and to do it, he must explore through various probabilistic and statistic paradigms, and hence through many working spaces, but no explicit indication helping him to identify the right paradigm is offered. Additionally, the task verbalization is often ambiguous, which turns difficult to determine the paradigms on which he is supposed to act. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Mathematical working spaces", "Modeling", "Probability", "Random experiment", "Simulation", "Spreadsheet"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Circulaciones y génesis en el espacio de trabajo matemático", "autores": ["Montoya-Delgadillo E.", "Mena-Lorca A.", "Mena-Lorca J."], "autores_adretm": ["MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["IMA", "CIAE-IMA"], "pais": ["CL"], "doi": "10.12802/relime.13.1749", "enlace": "https://doi.org/10.12802/relime.13.1749", "resumen": "In this paper we present a case study, as part of a monitoring of beginning teachers’ classroom practices. Among other aspects, we have observed that, in such practices, Algebra intervenes in the other fields, to an extent that they induce in their students a Mathematical Working Space in which, although circulations occur between the components of the cognitive and epistemological planes involved in the instrumental and semiotic geneses, the discursive genesis is almost absent. In order to study the situation, we obtain additional information in such a way to understand the role played by algebra in the development of other fields of mathematics. We then present an example of how a beginning teacher with those characteristics can influence the personal Mathematical Working Space of his/her students. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Case study", "Geneses", "Mathematical Working Space"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "El Proceso De Prueba En El Espacio De Trabajo Geométrico: Profesores En Formación Inicial", "autores": ["Delgadillo E.M."], "autores_adretm": ["MONTOYA DELGADILLO Elizabeth"], "directores": [], "anio": 2014.0, "fuente": "Ensenanza de las Ciencias", "institucion": ["Instituto de Matemática"], "pais": ["CL"], "doi": "10.5565/rev/ensciencias.1049", "enlace": "https://doi.org/10.5565/rev/ensciencias.1049", "resumen": "Teaching and learning of proof often are explicit aims of the high school curriculum. Nevertheless, the same does not happen in the teachers' training curricula; i.e., neither teaching nor learning of proof are considered to be mathematical objects subject to didactic transposition. Here we use the Theory of Paradigms and Geometric Work Space to analyze, in novel Chilean teachers, obstacles that generate because the roles and status of the proof in the institution high school differ from those in the university as a teachers' training institution. Thus, we give evidence of geometric conceptions and the lack of transpositions facing the process of proof in geometry. This in turn manifests an epistemological, didactic and cognitive break usually found in the teaching of geometry.", "palabras_clave": ["Didactics of Geometry", "Geometric work space", "Paradigm", "Process of proof"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Espacios de trabajo matemático. Puntos de vista y perspectivas", "autores": ["Kuzniak A.", "Richard P.R."], "autores_adretm": ["KUZNIAK Alain", "RICHARD Philippe R."], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["LDAR", "Département de didactique"], "pais": ["FR", "CA"], "doi": "10.12802/relime.13.1741a", "enlace": "https://doi.org/10.12802/relime.13.1741a", "resumen": "This special issue of Revisla Latinoamericana de Investigatión en Matematica Educativa (RELIME) is dedicated entirely to the articles proposed within the framework of the third Symposium Mathematical Work Space (ETM, in French) which is devoted to the study, development and possible applications of the ETM concept in the didactics of mathematics. The mathematical work and its functioning within the school setting are the foundation of the ETM approach, and in this introduction, before presenting the thematic organization of the contributions; we will summarize this theoretical approach. Its goal is to enrich, in a non-normative manner, the didactic study of the mathematical work of the students and teachers. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Trabajo matemático y dominios matemáticos", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["LDAR"], "pais": ["FR"], "doi": "10.12802/relime.13.17419", "enlace": "https://doi.org/10.12802/relime.13.17419", "resumen": "In the Geometrical Working Space (GWS) theoretical framework, the differentiation of geometrical approaches is based on the geometrical paradigms notion. Due to this notion, it is possible not only to point out the epistemological differences in the test approaches, but also to understand and explain variations in the instrumental and figural geneses. The extension of the GWS’s theoretical framework to the Mathematical Working Spaces draws attention on the simultaneous use of several domains of mathematics in the mathematical work. We analyze the problems initially lying on a geometrical support, but which solution can be expressed in another mathematical domain that, form a educational point of view, is not, thus, necessarily situated neither to the same paradigmatic level, nor to the same didactical or pedagogical level of elaboration. These differences in level can be source of misunderstandings and dysfunction in the academic practice. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Discovery process", "Mathematical domain", "Mathematical Working Space", "Modeling", "Validation"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "El espacio de trabajo matemático y la situación específica de la matemática funcional: Un ejercicio de diálogo", "autores": ["Zaldívar Rojas D.", "Cen Che C.", "Briceño Solís E.", "Méndez Guevara M.", "Cordero Osorio F."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["CINVESTAV"], "pais": ["MX"], "doi": "10.12802/relime.13.17421", "enlace": "https://doi.org/10.12802/relime.13.17421", "resumen": "Research in Mathematics Education highlights aspects of the nature of mathematical knowledge and its learning, according to the peculiarity of its object of study. The interest is to explain a socioepistemologic research which considers that it is possible to create learning through Specific Situation. Because of that, conducting a conversation exercise between Mathematical Working Space and Specific Situation was considered. The purpose is to think about its developments in terms of its functionalities through three axes of analysis: the conception of subject which each one shows, the mathematical content which is learned and the consideration of learning process. That allows us to establish the conversation between the mentioned notions that, although they have different natures, they try to portray and analyze the production of students and intervene in the educational system. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Functional mathematics", "Mathematical working space", "Resignification", "Specific situation"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Estructura y niveles de habilidad en estudiantes de escuela primaria sobre geometría transformacional", "autores": ["Xistouri X.", "Pitta-Pantazi D.", "Gagatsis A."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["University of Cyprus"], "pais": ["CY"], "doi": "10.12802/relime.13.1747", "enlace": "https://doi.org/10.12802/relime.13.1747", "resumen": "This paper used CFA analyses to investigate the factors and structure of transformational geometry concepts ability. The results suggest that the three geometric transformations (translation, reflection and rotation) consist of four factors and have similar structures. RASCH analysis was used to create a scale of the factor items, which was interpreted in light of the theoretical framework of geometrical working space. Five levels of visualization abilities in transformational geometry were identified. This paper suggests that the development of understanding in transformational geometry can be explained based on the visualization process of the students’ personal geometrical working space. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Dimensional deconstruction", "Geometrical working space", "Transformational geometry", "Visualization"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "La mediatión docente y los espacios de trabajo matemático", "autores": ["Figueras O.", "Flores P.", "Pluvinage F."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["CINVESTAV", "Universidad Pedagógica Nacional"], "pais": ["MX"], "doi": "10.12802/relime.13.17422", "enlace": "https://doi.org/10.12802/relime.13.17422", "resumen": "The teacher brings into play strategies to facilitate his students to learn mathematics. As a result of several approaches to mathematics classes taught of basic education teachers, in this article, five difficulties that the teacher confronts to mediate a significant audience between institutional and individual Mathematical Work Spaces are portrayed © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Basic education", "Mediation", "MWS"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Utilización de gesticulaciones de un alumno de preescolar al resolver un problema geométrico en diferentes espacios de representación construida", "autores": ["Elia I.", "Evangelou K.", "Hadjittoouli K.", "van den Heuvel-Panhuizen M."], "autores_adretm": [], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Department of Education", "Freudenthal Institute for Science and Mathematics Education"], "pais": ["CY", "NL"], "doi": "10.12802/relime.13.17410", "enlace": "https://doi.org/10.12802/relime.13.17410", "resumen": "This study investigates a kindergartner’s gestures, from a cognitive point of view, in a geometrical activity of communicative character. The activity involves a shape configuration problem in two different types of space of constructed representation (SCR), namely, on the computer and on paper. In this, we follow the cognitive analysis of geometrical thinking by Duval (1998) with a focus on the perceptual and the operative apprehension of geometrical figures. During the activity, the child had to give instructions to an experimenter, so that the latter could compose the figure on the computer screen using a specific mathematical applet, and on paper, respectively. The child was found to produce iconic and deictic gestures to a different extent in each SCR. Each type of gestures had a different cognitive function in solving the task. These findings provide insight into the personal geometric work space of a young child in carrying out a shape configuration task. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Geometrical figure apprehension", "Geometrical work space", "Gesture", "Kindergarten", "Shape configuration", "Spaces of constructed representation"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Actividades sobre lugares géometricos desarrolladas en un sistema de geometría dinámica. Visualización no icónica y génesis instrumental", "autores": ["Gómez-Chacón I.M.", "Escribano J."], "autores_adretm": ["GÓMEZ-CHACÓN Inés Mª"], "directores": [], "anio": 2014.0, "fuente": "Revista Latinoamericana de Investigacion en Matematica Educativa", "institucion": ["Facultad de Ciencias Matemáticas", "Facultad de Informática"], "pais": ["ES"], "doi": "10.12802/relime.13.17418", "enlace": "https://doi.org/10.12802/relime.13.17418", "resumen": "This paper presents a study on the use of geometric locus using a dynamic geometry system (GeoGebra) in order to pass from Geometry II (a natural proto-axiomatic Geometry) to Geometry III (a complete axiomatic Geometry). The research was conducted with 30 Spanish college prospective mathematics teachers. The Geometrical Working Space theory (GWS) was used as a theoretical framework to describe the figurative and instrumental genesis processes involved in the learning processes in computer environments. To study these two geneses, iconic visualization versus non-iconic visualization, along with instrumental and dimensional deconstruction concepts, was used. The authors identify typologies of images and visualization uses. © 2014, Comite Latinoamericano de Matematica Educativa. All rights reserved.", "palabras_clave": ["Diagrams", "Drawing", "GeoGebra", "Geometry", "Interactive learning", "Loci", "Problem-solving strategies", "Reasoning", "Teacher training", "Visual representations", "Visualization"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Understanding Geometric Work through Its Development and Its Transformations", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2013.0, "fuente": "Springer eBooks", "institucion": ["Université Paris Cité", "LDAR"], "pais": ["FR"], "doi": "10.1007/978-1-4614-3489-4_15", "enlace": "https://doi.org/10.1007/978-1-4614-3489-4_15", "resumen": "", "palabras_clave": ["Transformation geometry"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "CERME7 Working Group 4: Geometry teaching and learning", "autores": ["Kuzniak A.", "Richard P.", "Gagatsis A."], "autores_adretm": ["KUZNIAK Alain", "RICHARD Philippe R."], "directores": [], "anio": 2012.0, "fuente": "Research in Mathematics Education", "institucion": ["Université Paris Cité", "Université de Montréal", "University of Cyprus"], "pais": ["FR", "CA", "CY"], "doi": "10.1080/14794802.2012.694285", "enlace": "https://doi.org/10.1080/14794802.2012.694285", "resumen": "[No abstract available]", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "How do teachers' approaches to geometric work relate to geometry students' learning difficulties?", "autores": ["Kuzniak A.", "Rauscher J.-C."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2011.0, "fuente": "Educational Studies in Mathematics", "institucion": ["Laboratoire LDAR", "Université de Strasbourg"], "pais": ["FR"], "doi": "10.1007/s10649-011-9304-7", "enlace": "https://doi.org/10.1007/s10649-011-9304-7", "resumen": "Various studies suggest that French students (grades 7 to 10) may solve geometric problems within a paradigmatic framework that differs from that assumed by teachers, a situation prone to misunderstandings. In this paper, we study the extent to which secondary school teachers recognise the conflicting paradigms and how they handle the geometric work conducted, in sometimes unintended ways, by their students. This is done by analysing teachers' reactions to specific answers students offered to the Charlotte and Marie problem, an \"ambiguous\" problem with various solutions depending on the paradigm adopted. As a result of the study, we found that, beyond similarities due to a shared mathematical background, the way secondary schoolteachers handle students' answers varies with their conceptions of geometric work. Implications are drawn regarding the teaching of geometry and the training of teachers. © 2011 Springer Science+Business Media B.V.", "palabras_clave": ["Epistemic conception", "Geometric work", "Geometrical paradigms", "Geometry"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Personal geometrical working space: A didactic and statistical approach", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2008.0, "fuente": "Studies in Computational Intelligence", "institucion": ["Equipe Didirem Université"], "pais": ["FR"], "doi": "10.1007/978-3-540-78983-3_9", "enlace": "https://doi.org/10.1007/978-3-540-78983-3_9", "resumen": "In this paper, we study answers that pre-service teachers gave in an exercise of Geometry. Our purpose is to gain a better understanding of what we call the geometrical working space (espace de travail géAoméAtrique). We first conduct a didactical study based on the notion of geometrical paradigms that leads to a classification of student's answers. Then, we use statistical tools to precise the previous analysis and explain students' evolution during their training. © 2008 Springer-Verlag Berlin Heidelberg.", "palabras_clave": ["Didactic", "Geometrical working space", "Geometry", "Paradigm", "Teachers training"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "acta_congreso", "titulo": "Duality of probability and statistics teaching in French education", "autores": ["Carranza P.", "Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2008.0, "fuente": "", "institucion": ["Université Paris Cité"], "pais": ["FR"], "doi": "10.52041/srap.08206", "enlace": "https://doi.org/10.52041/srap.08206", "resumen": "In epistemological studies, two main interpretations of probabilities are the frequentist and the Bayesian. In this paper we first show that both interpretations are present in French Secondary schools, albeit the official curriculum only supports the frequentist approach. We then suggest a possible teaching situation to introduce teachers and students to the subjective-objective duality with some statistics training situations via the use of problem solving. We also give some characteristics and conditions useful to build situations fitted to this goal.", "palabras_clave": ["Duality (order theory)|Probability and statistics|Frequentist probability"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Paradigmes et espaces de travail géométriques. Éléments d’un cadre théorique pour l’enseignement et la formation des enseignants en géométrie", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2006.0, "fuente": "Canadian Journal of Science, Mathematics and Technology Education", "institucion": ["Equipe Didirem Université Paris VII"], "pais": ["FR"], "doi": "10.1080/14926150609556694", "enlace": "https://doi.org/10.1080/14926150609556694", "resumen": "Cet article développe les éléments d’un cadre théorique utilisé pour l’étude de l’enseignement de la géométrie élémentaire notamment en formation des enseignants. Les notions de paradigmes géométriques et d’espace de travail de la géométrie font l’objet d’une présentation détaillée. La géométrie élémentaire est ainsi vue comme éclatée en trois paradigmes géométriques différents. Ces derniers approfondissent la notion de cadre géométrique due à Douady. Ils sont ensuite mis en relation avec les niveaux de Van Hiele. La notion d’espace de travail permet d’étudier la spécificité de l’activité du géomètre qu’il soit expert ou apprenti. Une articulation avec l’approche cognitive de Duval est envisagée. © 2006 Taylor and Francis Group, LLC.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "UN EXEMPLE de CADRE CONCEPTUEL POUR L'ÉTUDE de L'ENSEIGNEMENT de la GÉOMÉTRIE en FORMATION des MAÎTRES", "autores": ["Houdement C.", "Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 1999.0, "fuente": "Educational Studies in Mathematics", "institucion": ["I.U.FM. de Haute Normandie", "Université Louis Pasteur et I.U.F.M. d'Alsace"], "pais": ["FR"], "doi": "10.1023/a:1003851228212", "enlace": "https://doi.org/10.1023/A:1003851228212", "resumen": "We are interested in the teaching of geometry to primary school (children from 3 to 11) teachers. We define a priori a conceptual frame, which organises geometry upon three kinds of knowledge: intuition, experience and deduction. Drawing on Gonseth's works, we bring out three syntheses of elementary geometry: natural geometry (geometry I), natural axiomatic geometry (geometry II) and formalist axiomatic geometry (geometry III). Next we illustrate this conceptual frame with examples of teaching geometry. Last we bring out different conceptions of geometry in scholar system which could lead to cross purposes. © 1999 Kluwer Academic Publishers.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "tesis_doctorado", "titulo": "Trabajo matemático de estudiantes secundarias/os al resolver tareas abiertas: ¿Qué producen? ¿Cómo argumentan? ¿Cómo comunican?", "autores": ["PALACIOS BEZAMA Catalina"], "autores_adretm": ["PALACIOS BEZAMA Catalina"], "directores": ["GAONA Jorge", "TRUJILLO-CRISTOFFANINI Macarena"], "anio": null, "fuente": "Universidad de Playa Ancha, Chile", "institucion": ["Universidad de Playa Ancha"], "pais": ["CL"], "doi": "", "enlace": "sin enlace/sans lien/no link", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": null, "origen": "Tesis", "es_etm": true}, {"tipo_id": "tesis_magister", "titulo": "Función cuadrática: espacio de trabajo matemático idoneo de profesores en ejercicio", "autores": ["Pinto Lazares", "Miriam Roxana"], "autores_adretm": ["Pinto Lazares", "Miriam Roxana"], "directores": ["FLORES SALAZAR Jesús"], "anio": 2025.0, "fuente": "Pontificia Universidad Católica del Perú, Perú", "institucion": ["Pontificia Universidad Católica del Perú"], "pais": ["PE"], "doi": "", "enlace": "https://tesis.pucp.edu.pe/items/b606712d-0478-4193-9f35-ec2666490136", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": null, "origen": "Tesis", "es_etm": true}, {"tipo_id": "tesis_magister", "titulo": "Estudio de Clases para la función afín bajo el Espacio de Trabajo Matemático", "autores": ["ALFARO Carlos Alfonso"], "autores_adretm": ["ALFARO Ca u travail géométrique au collège", "autores": ["BULF Caroline"], "autores_adretm": ["BULF Caroline"], "directores": ["KUZNIAK Alain"], "anio": 2007.0, "fuente": "Université Paris Cité, France", "institucion": ["Université Paris Cité"], "pais": ["FR"], "doi": "", "enlace": "https://theses.hal.science/tel-00369503v1", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": null, "origen": "Tesis", "es_etm": true}, {"tipo_id": "proyecto", "titulo": "Espacio de Trabajo Matemático de profesores de secundaria y sus conocimientos tecnológicos, pedagógico y del contenido matemático en geometría.", "autores": ["FLORES SALAZAR Jesús", "GARCÍA CUELLAR Daysi", "KUZNIAK Alain", "NECHACHE Assia", "NEIRA FERNÁNDEZ Verónica", "PEÑALOZA VARA Nelson", "THÉRY ROMERO Morella", "VIVAS PACHAS Jorge"], "autores_adretm": ["FLORES SALAZAR Jesús", "GARCÍA CUELLAR Daysi", "KUZNIAK Alain", "NECHACHE Assia", "NEIRA FERNÁNDEZ Verónica", "PEÑALOZA VARA Nelson", "THÉRY ROMERO Morella", "VIVAS PACHAS Jorge"], "directores": ["FLORES SALAZAR Jesús"], "anio": null, "fuente": "", "institucion": ["Vicerrectorado de Investigación de la Pontificia Universidad Católica del Perú. Proyectos."], "pais": ["PE"], "doi": "", "enlace": "https://investigacion.pucp.edu.pe/wp-content/uploads/2022/06/CAP-Investigacion-PUCP-2022-Ganadores.pdf", "resumen": "El proyecto analiza los conocimientos tecnológicos, pedagógicos y matemáticos que movilizan profesores de secundaria al integrar herramientas digitales en la enseñanza de la geometría. La investigación se basa en la teoría ETM y el modelo M-TPACK, con el propósito de diseñar un dispositivo de formación docente y contribuir al desarrollo de recursos didácticos tecnológicos en Educación Matemática.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": null, "origen": "Proyecto", "es_etm": true}, {"tipo_id": "proyecto", "titulo": "Análisis Cualitativo de Ecuaciones Diferenciales Ordinarias en Carreras de Ciencias: Diseño e implementación de una secuencia didáctica basada en el ETM y Tecnología Digital.", "autores": ["FLORES SALAZAR Jesús", "HUACCAN CONDORI  Iris Inés", "Carlos Enrique Tapia Chinchay", "Carlos Enrique Tapia Chinchay"], "autores_adretm": ["FLORES SALAZAR Jesús", "HUACCAN CONDORI  Iris Inés", "Carlos Enrique Tapia Chinchay"], "directores": ["FLORES SALAZAR Jesús"], "anio": null, "fuente": "", "institucion": ["Vicerrectorado de Investigación de la Pontificia Universidad Católica del Perú."], "pais": ["PE"], "doi": "", "enlace": "https://investigacion.pucp.edu.pe/convocatorias/concurso-anual-de-proyectos-de-investigacion-cap-de-investigacion-pucp-2025/", "resumen": "El proyecto busca fortalecer la enseñanza de las EDO de primer orden en carreras científicas mediante una secuencia didáctica basada en la teoría ETM. La propuesta integrará herramientas digitales como MatLab, Wolfram y Blufton para promover la exploración conceptual y el análisis gráfico. El estudio analizará cómo estas tecnologías favorecen el desarrollo de las génesis y planos verticales del ETM. Se espera contribuir a una mejor comprensión de la estabilidad y dinámica de las soluciones, así como optimizar la resolución de problemas en contextos científicos y tecnológicos.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": null, "origen": "Proyecto", "es_etm": true}, {"tipo_id": "proyecto", "titulo": "Los Espacios de Trabajo Matemático del análisis para la enseñanza de la matemática en Chile y en Francia : identificación y construcción", "autores": ["KUZNIAK Alain", "MENARES Romina", "MONTOYA DELGADILLO Elizabeth", "VANDEBROUCK Fabrice", "VERDUGO-HERNÁNDEZ Paula", "VIVIER Laurent", "KUZNIAK Alain", "MONTOYA DELGADILLO Elizabeth", "VIVIER Laurent"], "autores_adretm": ["KUZNIAK Alain", "MENARES Romina", "MONTOYA DELGADILLO Elizabeth", "VANDEBROUCK Fabrice", "VERDUGO-HERNÁNDEZ Paula", "VIVIER Laurent"], "directores": [], "anio": null, "fuente": "", "institucion": ["Agencia Nacional de Investigación y Desarrollo, Chile, Evaluation-orientation de la Coopération Scientifique, France"], "pais": ["CL", "FR"], "doi": "", "enlace": "https://www.conicyt.cl/pci/files/2013/04/Resoluci%C3%B3n-Fallo-Ecos-Conicyt-2013.pdf", "resumen": "El proyecto, previsto en un período de 3 años (2014-2016), es una asociación entre el LDAR y el equipo de didáctica de las Matemática del Instituto de Matemática de la PUCV en Chile. Los vínculos entre los dos equipos se remontan a la década de 2000, con un primer proyecto ECOS-Sud (2003-2005) en geometría.\nEl objetivo principal del proyecto es analizar el espacio de Trabajo Matemático, ETM, en el dominio del análisis de los profesores en formación inicial y continua, en Chile y Francia, con el fin de desarrollar recursos para la formación y la enseñanza.\n\nEn un primer momento se analiza el ETM-idóneo en la universidad en la formación inicial y en el liceo y desarrollamos el marco de ETM en el dominio del análisis, en las dimensiones epistemológicas y cognitivas, con la identificación de paradigmas. Para el ETM idóneo como para el ETM personal de los profesores, contaremos con entrevistas a profesores de matemáticas. Posteriormente, situaciones didácticas serán elaboradas, propuestas y analizadas en la formación inicial y continua teniendo en cuenta nuestros análisis iniciales.\n\nNuestra hipótesis de trabajo es que en análisis se requiere una flexibilidad entre diferentes dominios de la matemática y no solo de conocimientos algebraicos donde el cálculo no es suficiente en este dominio. Con este fin, el estudio se apoya y toma en cuenta necesariamente el conocimiento antiguo, otros dominio de las matemáticas en juego, así como la dialéctica local - global, del valor exacto y el valor aproximado, y lo discreto y continuo.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": null, "origen": "Proyecto", "es_etm": true}, {"tipo_id": "proyecto", "titulo": "Estudio de la articulación de conocimientos teóricos y prácticos en el trabajo docente a partir de la colaboración de la triada formativa: profesor en formación inicial, profesor guía y profesor supervisor, en el contexto de prácticas", "autores": ["MENARES Romina", "MENARES Romina"], "autores_adretm": ["MENARES Romina"], "directores": [], "anio": null, "fuente": "", "institucion": ["Agencia Nacional de Investigación y Desarrollo, Chile"], "pais": ["CL"], "doi": "", "enlace": "https://s3.amazonaws.com/documentos.anid.cl/proyecto-investigacion/2024/iniciacion/fallo/NOMINA_DE_PROYECTOS_APROBADOS_6QbVwN1XhT3eRtY7uIaM5oKvP8.pdf", "resumen": "La desconexión entre la teoría y la práctica en la formación docente, tanto en profesores en formación como en aquellos en ejercicio, constituye una problemática persistente que se ha mantenido por décadas. En este contexto, las prácticas profesionales dentro de la Formación Inicial Docente (FID) representan un espacio privilegiado para estudiar esta situación, ya que actúan como un nexo entre la universidad y la escuela, permitiendo la confluencia y puesta en diálogo de saberes teóricos y prácticos.\n\nDiversos estudios han mostrado que los espacios de colaboración entre los actores que conforman la denominada tríada formativa —el profesor en formación (PF), el profesor guía en la escuela (PG) y el profesor supervisor universitario (PS)— pueden favorecer la articulación entre teoría y práctica. Al propiciar el encuentro de sus respectivos conocimientos y experiencias, se generan sinergias que posibilitan la construcción de un conocimiento compartido, enriqueciendo así el ejercicio profesional de cada uno de los integrantes.\n\nEsta propuesta se fundamenta teóricamente en la distinción entre conocimiento teórico y conocimiento práctico, planteada por Eraut (2003), y en el marco conceptual de los Espacios de Trabajo Matemático (ETM), desarrollado por Kuzniak (2011, 2022). El objetivo general de la investigación es comprender cómo los conocimientos teóricos y prácticos que se despliegan en instancias de planificación, implementación y análisis de clases de Enseñanza Media contribuyen al desarrollo de Espacios de Trabajo Matemático personales e idóneos de los agentes de la tríada formativa.\n\nPara ello, se adopta una metodología de investigación de diseño intervencionista (Gravemeijer y Cobb, 2006), mediante la cual se diseña e implementa un escenario colaborativo que integra a los tres actores de la tríada en el proceso de planificación, desarrollo y análisis de clases de Matemática en Enseñanza Media. Este contexto permite observar cómo se movilizan y articulan los conocimientos teóricos y prácticos, y de qué manera contribuyen al desarrollo de ETM.\n\nEl estudio se lleva a cabo con tríadas pertenecientes a tres instituciones formadoras de profesores de la región de Valparaíso. La recolección de datos se realiza a través de seminarios y sesiones de clases videograbadas en contextos reales de enseñanza en Enseñanza Media.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": null, "origen": "Proyecto", "es_etm": true}, {"tipo_id": "proyecto", "titulo": "Trabajo matemático de profesores en formación inicial apoyado por artefactos digitales en el dominio del álgebra lineal / Travail mathématique d'enseignants en formation initiale soutenu par des artefacts numériques dans le domaine de l'algèbre linéaire", "autores": ["ARÉVALO-MENESES Fabiola", "CABRERA-BAQUEDANO Alejandro", "CARRILLO Flor", "GAONA Jorge", "LÓPEZ Soledad", "MENARES Romina", "MONTOYA DELGADILLO Elizabeth", "PALACIOS Catalina", "SEGURA-CORELLA Norma", "VANDEBROUCK Fabrice", "VIVIER Laurent", "GAONA Jorge", "VANDEBROUCK Fabrice"], "autores_adretm": ["ARÉVALO-MENESES Fabiola", "CABRERA-BAQUEDANO Alejandro", "CARRILLO Flor", "GAONA Jorge", "LÓPEZ Soledad", "MENARES Romina", "MONTOYA DELGADILLO Elizabeth", "PALACIOS Catalina", "SEGURA-CORELLA Norma", "VANDEBROUCK Fabrice", "VIVIER Laurent"], "directores": [], "anio": null, "fuente": "", "institucion": ["Agencia Nacional de Investigación y Desarrollo, Chile, Centre national de la recherche scientifique, France"], "pais": ["CL", "FR"], "doi": "", "enlace": "https://s3.amazonaws.com/documentos.anid.cl/rec/2022/EcosAnid/Res-ex-3801-Adjudica-Concurso-ECOS.pdf", "resumen": "Este proyecto tiene como objetivo general:\n\nOG: Caracterizar el trabajo matemático de profesores en formación inicial y de estudiantes de licenciatura científica al abordar tareas abiertas con corrección y retroalimentación automática en entornos digitales, en el dominio del álgebra lineal.\n\nEs importante señalar que, al referirse al \"trabajo matemático\", se alude al Trabajo Matemático Personal (ETM personal), una noción técnica y teórica propia de la teoría utilizada. Por lo tanto, el objetivo general se centra en caracterizar dicho ETM personal.\n\nEl equipo de investigación ha diseñado previamente tareas en plataformas digitales que incorporan corrección y retroalimentación automática, siguiendo el ciclo representado en la Figura 1. En dichas experiencias, los profesores —como mediadores entre estudiantes y artefactos digitales— ya se han familiarizado con el uso de estos recursos, tanto en contextos de evaluación en línea como en el trabajo en aula. En el marco de esta colaboración, se diseñarán nuevas tareas centradas en contenidos de álgebra lineal, en particular sobre sistemas de ecuaciones lineales y matrices.\n\nObjetivos específicos\nOE1: Estudiar, desde una perspectiva epistemológica e instrumental, los objetos matemáticos implicados en el diseño de las tareas.\n\nOE2: Diseñar tareas y realizar su transposición informática hacia artefactos digitales de evaluación en línea, con corrección y retroalimentación automática.\n\nOE3: Implementar situaciones de enseñanza que involucren el uso de artefactos digitales.\n\nOE4: Analizar las resoluciones de las tareas y el trabajo desarrollado por los estudiantes en el aula.\n\nEstas tareas, concebidas como artefactos digitales complejos, requieren una gestión activa por parte del profesor, quien debe apoyar a los estudiantes ante bloqueos o dificultades, y guiarlos hacia la generalización y justificación de sus respuestas.\n\nHipótesis\nH1: Al trabajar con tareas abiertas —utilizando diversos softwares disponibles o simplemente lápiz y papel— y mediante la discusión colectiva entre estudiantes y con el profesor, los estudiantes pueden desarrollar un trabajo matemático enriquecido, es decir, un trabajo que transite por las dimensiones semiótica, instrumental y discursiva.\n\nPor ejemplo, al abordar una tarea como la representada en la Figura 4, los estudiantes pueden explorar soluciones mediante diferentes herramientas digitales disponibles en línea. Independientemente de si logran encontrar o no una solución, el sistema entrega un feedback que el profesor debe gestionar en clase. Se espera que este último pueda guiar a los estudiantes hacia una elaboración discursiva más profunda, mediante la coformulación y la justificación conjunta de conjeturas, como las que se muestran en dicha figura.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": null, "origen": "Proyecto", "es_etm": true}, {"tipo_id": "proyecto", "titulo": "NodoTecEdu: Investigación, innovación y tecnología en la Educación", "autores": ["MENARES Romina", "MENARES Romina"], "autores_adretm": ["MENARES Romina"], "directores": [], "anio": null, "fuente": "", "institucion": ["Proyecto interno Universidad de VlaparaísoL"], "pais": ["CL"], "doi": "", "enlace": "No existe enlace", "resumen": "El objetivo central del Nodo es fortalecer las capacidades de investigación educativa mediada por tecnologías multimodales en la Universidad de Valparaíso, a través de un enfoque interdisciplinario que potencie la relevancia e impacto de los estudios realizados. Con este propósito, se han articulado cinco iniciativas orientadas a la maduración tecnológica, integradas en torno a un Framework Multimodal para el análisis y retroalimentación de prácticas docentes.\n\nIniciativas Tecnológicas Integradas\nEvaluación de prácticas docentes mediante analítica multimodal\nEsta iniciativa se enfoca en el desarrollo y maduración de una plataforma tecnológica basada en investigaciones previas, que emplea sensores, audio, video e inteligencia artificial para detectar aspectos clave del desempeño docente, como desplazamiento, gestualidad y entonación. Será diseñada colaborativamente entre disciplinas para generar indicadores significativos para la investigación educativa.\n\nEstudio didáctico de clases de matemáticas con apoyo de analítica multimodal\nSe investigará el Trabajo Matemático (Kuzniak, 2022) en clases de matemática, abordando dimensiones epistemológicas y cognitivas. La investigación será potenciada mediante tecnologías multimodales como el seguimiento ocular y visión computacional, que permitirán caracterizar el comportamiento docente en el aula.\n\nAnálisis de microdiscursos y preguntas en clases de matemáticas mediante Procesamiento de Lenguaje Natural (NLP)\nEsta línea utilizará herramientas de NLP para identificar y clasificar tipos de preguntas (abiertas, cerradas, etc.) realizadas durante la clase. Los resultados se integrarán en una plataforma que permitirá visualizar estos momentos clave y facilitar la autoevaluación y mejora docente.\n\nRelación entre expectativas docentes y desempeño estudiantil mediante analítica multimodal\nSe desarrollarán indicadores para caracterizar las expectativas del profesorado y su correlación con el rendimiento de los estudiantes. Se utilizarán técnicas de NLP para analizar contenidos verbales y escritos, y se integrarán en la plataforma para facilitar la identificación de patrones y tendencias educativas.\n\nModelo de transferencia tecnológica para la implementación de un framework de análisis docente\nEsta iniciativa tiene como meta generar un modelo de transferencia tecnológica que permita una implementación efectiva del framework en distintos contextos educativos. Se fomentará la colaboración con universidades, instituciones públicas y comunidades docentes, promoviendo la sostenibilidad del uso del framework multimodal.\n\nFramework Multimodal para la Investigación Educativa\nLa integración de estas cinco iniciativas dará lugar a un Framework Multimodal que combinará tecnologías avanzadas —como sensores, cámaras, sistemas de seguimiento ocular, NLP e inteligencia artificial— con una plataforma tecnológica para la gestión, análisis y visualización de datos educativos. Este enfoque innovador permitirá enriquecer la investigación con evidencia cuantitativa y cualitativa, y facilitará la toma de decisiones informadas sobre las prácticas pedagógicas.\n\nEl desarrollo del proyecto se apoya en resultados previos de investigaciones financiadas con fondos internos y externos, lo que ha permitido acumular experiencia, establecer redes de colaboración con instituciones nacionales e internacionales, y consolidar el trabajo conjunto con estudiantes de pre y postgrado. Esta base sólida garantiza la viabilidad técnica y académica de la propuesta.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": null, "origen": "Proyecto", "es_etm": true}];
