  institucion: new Set(), institucionMode:'or',
  pais: new Set(), paisMode:'or',
  termino: [], terminoMode:'or',
  sortKey:'anio', sortDir:'desc',
};
let ultimasFilas = [];

const CATEGORIA_TIPO = {
  articulo:'articulos', libro:'articulos', capitulo_libro:'articulos', acta_congreso:'articulos',
  preprint:'articulos', dataset:'articulos', editorial:'articulos', erratum:'articulos', otro:'articulos',
  tesis_doctorado:'tesis', tesis_magister:'tesis', tesis_otro:'tesis',
  proyecto:'proyectos'
};

const autoresUnicos = [...new Set(DATA.flatMap(d=>[...seg(d.autores_adretm), ...seg(d.directores)]))];
const institucionesUnicas = [...new Set(DATA.flatMap(d=>seg(d.institucion)))];
const paisesUnicos = [...new Set(DATA.flatMap(d=>seg(d.pais)))];

function L(){ return IDIOMAS[state.lang].ui; }
function tipoLabel(id){ return (IDIOMAS[state.lang].tipos && IDIOMAS[state.lang].tipos[id]) || id || ''; }
function paisLabel(codigo){ return (PAISES_NOMBRES[state.lang] && PAISES_NOMBRES[state.lang][codigo]) || codigo || ''; }

/* ---------- filtrado con exclusión de faceta (para conteos cruzados) ---------- */
function cumpleFiltros(d, excluir){
  if(excluir!=='tipo' && state.tipo.size){
    const ok = state.tipoMode==='and' ? (state.tipo.size===1 && d.tipo_id===[...state.tipo][0]) : state.tipo.has(d.tipo_id);
    if(!ok) return false;
  }
  if(excluir!=='autor' && state.autor.size){
    const sel=[...state.autor]; const personas=[...seg(d.autores_adretm), ...seg(d.directores)];
    const ok = state.autorMode==='and' ? sel.every(a=>personas.includes(a)) : sel.some(a=>personas.includes(a));
    if(!ok) return false;
  }
  if(excluir!=='institucion' && state.institucion.size){
    const sel=[...state.institucion]; const insts=seg(d.institucion);
    const ok = state.institucionMode==='and' ? sel.every(i=>insts.includes(i)) : sel.some(i=>insts.includes(i));
    if(!ok) return false;
  }
  if(excluir!=='pais' && state.pais.size){
    const sel=[...state.pais]; const ps=seg(d.pais);
    const ok = state.paisMode==='and' ? sel.every(p=>ps.includes(p)) : sel.some(p=>ps.includes(p));
    if(!ok) return false;
  }
  if(state.termino.length){
    const hay=normalize([txt(d.titulo), txt(d.resumen), txt(d.fuente), ...seg(d.palabras_clave)].join(' '));
    const ok = state.terminoMode==='and' ? state.termino.every(t=>hay.includes(normalize(t))) : state.termino.some(t=>hay.includes(normalize(t)));
    if(!ok) return false;
  }
  return true;
}
function matches(d){ return cumpleFiltros(d, null); }
function countFor(val, campo){
  const excluidos = DATA.filter(d=>cumpleFiltros(d, campo));
  if(campo==='tipo') return excluidos.filter(d=>d.tipo_id===val).length;
  if(campo==='autor') return excluidos.filter(d=>[...seg(d.autores_adretm), ...seg(d.directores)].includes(val)).length;
  if(campo==='institucion') return excluidos.filter(d=>seg(d.institucion).includes(val)).length;
  if(campo==='pais') return excluidos.filter(d=>seg(d.pais).includes(val)).length;
  return 0;
}

/* ---------- consulta editable ---------- */
function generarTextoConsulta(){
  const l = L(); const partes = [];
  if(state.tipo.size){ const vals=[...state.tipo].map(tipoLabel); const conn=state.tipoMode==='and'?l.conector_and:l.conector_or; partes.push(`(${l.campo_tipo}: ${vals.join(' '+conn+' ')})`); }
  if(state.autor.size){ const conn=state.autorMode==='and'?l.conector_and:l.conector_or; partes.push(`(${l.campo_autores}: ${[...state.autor].join(' '+conn+' ')})`); }
  if(state.institucion.size){ const conn=state.institucionMode==='and'?l.conector_and:l.conector_or; partes.push(`(${l.campo_institucion}: ${[...state.institucion].join(' '+conn+' ')})`); }
  if(state.pais.size){ const vals=[...state.pais].map(paisLabel); const conn=state.paisMode==='and'?l.conector_and:l.conector_or; partes.push(`(${l.campo_pais}: ${vals.join(' '+conn+' ')})`); }
  if(state.termino.length){ const conn=state.terminoMode==='and'?l.conector_and:l.conector_or; partes.push(`(${l.campo_terminos}: ${state.termino.join(' '+conn+' ')})`); }
  return partes.length ? partes.join(' '+l.conector_and+' ') : l.todos_resultados;
}
function actualizarTextoConsulta(){ const box=document.getElementById('queryBox'); if(document.activeElement!==box) box.value=generarTextoConsulta(); }
function palabrasConectoras(){ const ands=new Set(), ors=new Set(); Object.values(IDIOMAS).forEach(id=>{ ands.add(normalize(id.ui.conector_and)); ors.add(normalize(id.ui.conector_or)); }); return {ands, ors}; }
function nombresCampo(campo){
  const claves={tipo:'campo_tipo', autor:'campo_autores', institucion:'campo_institucion', pais:'campo_pais', termino:'campo_terminos'};
  return Object.values(IDIOMAS).map(id=>normalize(id.ui[claves[campo]]));
}
function detectarCampo(etq){
  const n=normalize(etq);
  for(const campo of ['tipo','autor','institucion','pais','termino']){ if(nombresCampo(campo).includes(n)) return campo; }
  return null;
}
function dividirValores(contenido){
  const {ands, ors} = palabrasConectoras();
  const tokens = contenido.replace(/,/g,' , ').split(/\s+/).filter(Boolean);
  let modo=null, segmentos=[], actual=[];
  tokens.forEach(tok=>{
    if(tok===','){ modo=modo||'or'; segmentos.push(actual.join(' ')); actual=[]; return; }
    const n=normalize(tok);
    if(ors.has(n)){ modo='or'; segmentos.push(actual.join(' ')); actual=[]; }
    else if(ands.has(n)){ modo='and'; segmentos.push(actual.join(' ')); actual=[]; }
    else actual.push(tok);
  });
  segmentos.push(actual.join(' '));
  return {modo: modo||'or', valores: segmentos.map(s=>s.trim()).filter(Boolean)};
}
function analizarGrupos(texto){
  const grupos=[]; const regex=/\(([^():]+):([^()]*)\)/g; let m, restante=texto;
  while((m=regex.exec(texto))!==null){ grupos.push({etiqueta:m[1].trim(), contenido:m[2].trim()}); restante=restante.replace(m[0],' '); }
  const {ands, ors} = palabrasConectoras();
  const sobrante = restante.split(/\s+/).filter(tok=>{ if(!tok) return false; const n=normalize(tok); return !(ands.has(n)||ors.has(n)); }).join(' ').trim();
  return {grupos, sobrante};
}
function idTipoPorEtiqueta(etq){ const n=normalize(etq); for(const idioma of Object.values(IDIOMAS)){ for(const [id,label] of Object.entries(idioma.tipos)){ if(normalize(label)===n||normalize(id)===n) return id; } } return null; }
function autorPorEtiqueta(etq){ const n=normalize(etq); return autoresUnicos.find(a=>normalize(a)===n) || autoresUnicos.find(a=>normalize(a).includes(n)) || null; }
function institucionPorEtiqueta(etq){ const n=normalize(etq); return institucionesUnicas.find(i=>normalize(i)===n) || institucionesUnicas.find(i=>normalize(i).includes(n)) || null; }
function paisPorEtiqueta(etq){
  const n=normalize(etq);
  const directo = paisesUnicos.find(c=>normalize(c)===n);
  if(directo) return directo;
  for(const c of paisesUnicos){ if(normalize(paisLabel(c))===n) return c; }
  return null;
}
function aplicarTextoConsulta(){
  const texto=document.getElementById('queryBox').value;
  const {grupos, sobrante}=analizarGrupos(texto);
  const nT=new Set(); let nTm='or'; const nA=new Set(); let nAm='or';
  const nI=new Set(); let nIm='or'; const nP=new Set(); let nPm='or';
  const nTe=[]; let nTem='or';
  grupos.forEach(g=>{
    const campo=detectarCampo(g.etiqueta); const {modo, valores}=dividirValores(g.contenido);
    if(campo==='tipo'){ nTm=modo; valores.forEach(v=>{ const id=idTipoPorEtiqueta(v); id?nT.add(id):nTe.push(v); }); }
    else if(campo==='autor'){ nAm=modo; valores.forEach(v=>{ const a=autorPorEtiqueta(v); a?nA.add(a):nTe.push(v); }); }
    else if(campo==='institucion'){ nIm=modo; valores.forEach(v=>{ const i=institucionPorEtiqueta(v); i?nI.add(i):nTe.push(v); }); }
    else if(campo==='pais'){ nPm=modo; valores.forEach(v=>{ const p=paisPorEtiqueta(v); p?nP.add(p):nTe.push(v); }); }
    else if(campo==='termino'){ nTem=modo; valores.forEach(v=>nTe.push(v)); }
    else { valores.forEach(v=>nTe.push(v)); }
  });
  if(sobrante) nTe.push(sobrante);
  state.tipo=nT; state.tipoMode=nTm; state.autor=nA; state.autorMode=nAm;
  state.institucion=nI; state.institucionMode=nIm; state.pais=nP; state.paisMode=nPm;
  state.termino=[...new Set(nTe)]; state.terminoMode=nTem;
  sincronizarControles(); render();
}

/* ---------- chips genéricos ---------- */
function renderChips(contenedorId, valores, seleccionados, campo, etiquetaFn, buscarInput){
  const el=document.getElementById(contenedorId); el.innerHTML='';
  const filtro = buscarInput ? normalize(buscarInput.value) : '';
  let lista = valores.filter(v=>normalize(etiquetaFn(v)).includes(filtro));
  lista.sort((a,b)=> countFor(b,campo)-countFor(a,campo) || etiquetaFn(a).localeCompare(etiquetaFn(b), state.lang));
  if(!lista.length){ el.innerHTML = `<span class="chip-empty">—</span>`; return; }
  lista.forEach(v=>{
    const c=document.createElement('div'); c.className='chip'+(seleccionados.has(v)?' on':'');
    c.innerHTML=`${etiquetaFn(v)}<span class="n">${countFor(v,campo)}</span>`;
    c.onclick=()=>{ seleccionados.has(v)?seleccionados.delete(v):seleccionados.add(v); renderTodosLosChips(); actualizarTextoConsulta(); render(); };
    el.appendChild(c);
  });
}
function renderTodosLosChips(){
  renderChips('chipsTipo', [...new Set(DATA.map(d=>d.tipo_id))], state.tipo, 'tipo', tipoLabel, null);
  renderChips('chipsAutor', autoresUnicos, state.autor, 'autor', a=>a, document.getElementById('autorSearch'));
  renderChips('chipsInstitucion', institucionesUnicas, state.institucion, 'institucion', i=>i, document.getElementById('institucionSearch'));
  renderChips('chipsPais', paisesUnicos, state.pais, 'pais', paisLabel, document.getElementById('paisSearch'));
}
function renderChipsTermino(){
  const el=document.getElementById('chipsTermino'); el.innerHTML='';
  state.termino.forEach((t,i)=>{
    const c=document.createElement('div');
    c.style.cssText='display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border-radius:20px;padding:3px 6px 3px 10px;font-size:11.5px;margin:0 6px 6px 0;';
    c.innerHTML=`${t} <button aria-label="quitar" style="background:rgba(255,255,255,.25);border:none;color:#fff;width:15px;height:15px;border-radius:50%;cursor:pointer;font-size:10px;line-height:1;">×</button>`;
    c.querySelector('button').onclick=()=>{ state.termino.splice(i,1); renderChipsTermino(); actualizarTextoConsulta(); render(); };
    el.appendChild(c);
  });
}
function sincronizarControles(){
  document.querySelectorAll('.andor').forEach(g=>{ const key=g.dataset.group+'Mode'; g.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.mode===state[key])); });
  renderTodosLosChips(); renderChipsTermino(); actualizarTextoConsulta();
  document.getElementById('sortSelect').value = state.sortKey;
  document.getElementById('sortDir').textContent = state.sortDir==='asc' ? '↑' : '↓';
}
document.querySelectorAll('.andor').forEach(group=>{
  const key=group.dataset.group;
  group.querySelectorAll('button').forEach(btn=>{ btn.onclick=()=>{ group.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); state[key+'Mode']=btn.dataset.mode; actualizarTextoConsulta(); render(); }; });
});
['autorSearch','institucionSearch','paisSearch'].forEach(id=>{
  document.getElementById(id).addEventListener('input', ()=>{ renderTodosLosChips(); });
});
document.getElementById('terminoAdd').onclick=addTermino;
document.getElementById('terminoInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTermino(); } });
function addTermino(){ const input=document.getElementById('terminoInput'); const v=input.value.trim(); if(v && !state.termino.includes(v)){ state.termino.push(v); input.value=''; renderChipsTermino(); actualizarTextoConsulta(); render(); } }
document.getElementById('queryApply').onclick=aplicarTextoConsulta;
document.getElementById('queryBox').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); aplicarTextoConsulta(); } });
document.getElementById('resetAll').onclick=()=>{
  state.tipo.clear(); state.autor.clear(); state.institucion.clear(); state.pais.clear(); state.termino=[];
  state.tipoMode='or'; state.autorMode='or'; state.institucionMode='or'; state.paisMode='or'; state.terminoMode='or';
  ['autorSearch','institucionSearch','paisSearch'].forEach(id=> document.getElementById(id).value='');
  sincronizarControles(); render();
};
document.getElementById('sortSelect').addEventListener('change', e=>{ state.sortKey=e.target.value; render(); });
document.getElementById('sortDir').addEventListener('click', ()=>{ state.sortDir = state.sortDir==='asc'?'desc':'asc'; document.getElementById('sortDir').textContent = state.sortDir==='asc'?'↑':'↓'; render(); });

function renderSelectorIdioma(){
  const el=document.getElementById('langSwitch'); el.innerHTML='';
  ENLACES_IDIOMAS.forEach(info=>{
    const item = info.activo ? document.createElement('span') : document.createElement('a');
    if(!info.activo) item.href = info.archivo;
    const img=document.createElement('img'); img.src=`https://flagcdn.com/${info.bandera}.svg`; img.alt=info.nombre; img.title=info.nombre;
    if(info.activo) img.className='active';
    item.appendChild(img); el.appendChild(item);
  });
}
function construirLeyenda(){
  const l=L();
  document.getElementById('legend').innerHTML = `
    <span class="legend-item">${SVG_PERSONA} ${l.leyenda_manual}</span>
    <span class="legend-item auto">${SVG_COMPUTADOR} ${l.leyenda_auto}</span>`;
}
function aplicarTraduccionesEstaticas(){
  const l=L();
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); if(l[k]!==undefined) el.textContent=l[k]; });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ const k=el.getAttribute('data-i18n-placeholder'); if(l[k]!==undefined) el.placeholder=l[k]; });
  document.documentElement.lang = state.lang;
  construirLeyenda();
}
function inicializar(){ renderSelectorIdioma(); aplicarTraduccionesEstaticas(); sincronizarControles(); render(); }

/* ---------- tarjetas ---------- */
let contadorId = 0;
function iconoClasificacion(tipo){
  const l = L();
  if(tipo==='manual') return `<span class="icono-clasif" title="${l.icono_manual_tooltip}">${SVG_PERSONA}</span>`;
  if(tipo==='auto') return `<span class="icono-clasif auto" title="${l.icono_auto_tooltip}">${SVG_COMPUTADOR}</span>`;
  return '';
}
function crearCard(d){
  const l = L();
  contadorId++;
  const idExtra = `extra-${contadorId}`, idResumen = `resumen-${contadorId}`;
  const div=document.createElement('div'); div.className='card';
  const tituloHtml = d.enlace && d.enlace!=='#' ? `<a href="${d.enlace}" target="_blank" rel="noopener">${txt(d.titulo)}</a>` : txt(d.titulo);

  const directores = seg(d.directores);
  const instituciones = seg(d.institucion);
  const paises = seg(d.pais);
  const palabras = seg(d.palabras_clave);
  const tieneExtra = directores.length || instituciones.length || paises.length || palabras.length;
  const tieneResumen = txt(d.resumen).trim().length > 0;

  div.innerHTML = `
    <div class="card-meta">
      <span class="meta-block"><span class="meta-label">${l.col_anio}</span><span class="meta-value">${d.anio ?? '—'}</span></span>
      <span class="meta-block"><span class="meta-label">${l.col_tipo}</span><span class="meta-value">${tipoLabel(d.tipo_id)}</span></span>
      ${iconoClasificacion(d.clasificacion_etm)}
    </div>
    <h3 class="card-titulo">${tituloHtml}</h3>
    <p class="card-linea"><span class="etiqueta">${l.col_autores}</span>${seg(d.autores).join(', ') || '—'}</p>
    <p class="card-linea fuente"><span class="etiqueta">${l.col_fuente}</span>${txt(d.fuente)}</p>
    <div class="card-acciones">
      ${tieneExtra ? `<button class="link-btn" onclick="toggleBloque('${idExtra}', this, '${l.mostrar_mas}', '${l.mostrar_menos}')">${l.mostrar_mas}</button>` : ''}
      ${tieneResumen ? `<button class="link-btn" onclick="toggleBloque('${idResumen}', this, '${l.ver_resumen}', '${l.ocultar_resumen}')">${l.ver_resumen}</button>` : ''}
    </div>
    ${tieneExtra ? `<div class="extra" id="${idExtra}" style="display:none;">
      ${directores.length ? `<p class="card-linea"><span class="etiqueta">${l.col_directores}</span>${directores.join(', ')}</p>` : ''}
      ${instituciones.length ? `<p class="card-linea"><span class="etiqueta">${l.campo_institucion}</span>${instituciones.join(', ')}</p>` : ''}
      ${paises.length ? `<p class="card-linea"><span class="etiqueta">${l.campo_pais}</span>${paises.map(paisLabel).join(', ')}</p>` : ''}
      ${palabras.length ? `<p class="card-linea"><span class="etiqueta">${l.filtro_terminos}</span>${palabras.join(', ')}</p>` : ''}
    </div>` : ''}
    ${tieneResumen ? `<p class="card-resumen" id="${idResumen}" style="display:none;">${txt(d.resumen)}</p>` : ''}
  `;
  return div;
}
function toggleBloque(id, btn, textoMostrar, textoOcultar){
  const el=document.getElementById(id);
  const abierto = el.style.display !== 'none';
  el.style.display = abierto ? 'none' : 'block';
  btn.textContent = abierto ? textoMostrar : textoOcultar;
}

function renderResumenConteo(rows){
  const conteos = {articulos:0, tesis:0, proyectos:0};
  rows.forEach(d=>{ const cat = CATEGORIA_TIPO[d.tipo_id] || 'articulos'; conteos[cat]++; });
  const l = L();
  document.getElementById('breakdown').textContent =
    `${conteos.articulos} ${l.etiqueta_articulos} · ${conteos.tesis} ${l.etiqueta_tesis} · ${conteos.proyectos} ${l.etiqueta_proyectos}`;
}

function render(){
  let rows = DATA.filter(matches);
  const {sortKey, sortDir} = state;
  rows.sort((a,b)=>{
    let va = sortKey==='autores' ? seg(a.autores).join(', ') : (sortKey==='tipo_id'? tipoLabel(a.tipo_id): a[sortKey]);
    let vb = sortKey==='autores' ? seg(b.autores).join(', ') : (sortKey==='tipo_id'? tipoLabel(b.tipo_id): b[sortKey]);
    if(typeof va==='number') return sortDir==='asc'? va-vb : vb-va;
    return sortDir==='asc' ? String(va).localeCompare(String(vb), state.lang) : String(vb).localeCompare(String(va), state.lang);
  });
  ultimasFilas = rows;
  document.getElementById('countNum').textContent = rows.length;
  renderResumenConteo(rows);
  const cont = document.getElementById('cards'); const empty = document.getElementById('emptyState');
  cont.innerHTML='';
  if(!rows.length){ empty.style.display='block'; cont.style.display='none'; return; }
  empty.style.display='none'; cont.style.display='flex';
  rows.forEach(d=> cont.appendChild(crearCard(d)));
}

/* ---------- descarga a Excel ---------- */
document.getElementById('btnExcel').addEventListener('click', ()=>{
  const l = L();
  const datos = ultimasFilas.map(d=>({
    [l.col_anio]: d.anio ?? '',
    [l.col_tipo]: tipoLabel(d.tipo_id),
    [l.col_autores]: seg(d.autores).join(', '),
    [l.col_directores]: seg(d.directores).join(', '),
    [l.col_titulo]: txt(d.titulo),
    [l.col_fuente]: txt(d.fuente),
    [l.campo_institucion]: seg(d.institucion).join(', '),
    [l.campo_pais]: seg(d.pais).map(paisLabel).join(', '),
  }));
  const hoja = XLSX.utils.json_to_sheet(datos);
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, 'Resultados');
  XLSX.writeFile(libro, 'resultados_adretm.xlsx');
});

inicializar();
</script>
