<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADRETM — Buscador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#3444B4; --navy-dark:#283694; --navy-soft:rgba(52,68,180,.08); --navy-soft-strong:rgba(52,68,180,.16);
    --ink:#17181C; --ink-soft:#5B5D66; --paper:#FFFFFF; --surface:#F4F4F7; --border:#E4E4EA; --radius:4px;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif;}
  a{color:var(--navy);}
  .shell{max-width:1100px; margin:0 auto; padding:26px 24px 60px;}

  header.top{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; flex-wrap:wrap;}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--navy); margin-bottom:4px;}
  header.top h1{font-size:24px; font-weight:700; margin:0; color:var(--ink); letter-spacing:-0.01em;}
  header.top p{margin:6px 0 0; color:var(--ink-soft); font-size:13.5px; max-width:56ch;}
  .lang-row{display:flex; gap:7px;}
  .lang-row a, .lang-row span{display:inline-flex;}
  .lang-row img{width:23px; height:17px; object-fit:cover; border-radius:2px; opacity:.45; transition:opacity .12s, outline .12s;}
  .lang-row img.active{opacity:1; outline:2px solid var(--navy); outline-offset:1px;}
  .lang-row a:hover img{opacity:.85;}

  .filters-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin-bottom:14px;}
  .filter-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 13px 13px;}
  .filter-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
  .filter-head h2{font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--ink); margin:0;}
  .filter-note{font-size:10px; color:var(--ink-soft); margin:0 0 8px; line-height:1.4;}
  .andor{display:inline-flex; border:1px solid var(--border); border-radius:20px; overflow:hidden; font-size:10.5px;}
  .andor button{border:none; background:transparent; padding:2px 8px; cursor:pointer; color:var(--ink-soft); font-family:inherit;}
  .andor button.active{background:var(--navy); color:#fff; font-weight:600;}
  .andor button:not(.active):hover{background:var(--navy-soft-strong);}
  .chip-search{width:100%; border:1px solid var(--border); border-radius:var(--radius); padding:5px 7px; font-size:12px; font-family:inherit; margin-bottom:7px; background:#fff; color:var(--ink);}
  .chip-search:focus{outline:1px solid var(--navy);}
  .chip-list{display:flex; flex-wrap:wrap; gap:5px; max-height:110px; overflow-y:auto; padding-right:2px;}
  .chip{border:1px solid var(--navy-soft-strong); background:var(--navy-soft); color:var(--navy-dark); font-size:11px; padding:3px 8px; border-radius:20px; cursor:pointer; user-select:none; transition:background .12s,border-color .12s,color .12s; line-height:1.4;}
  .chip:hover{background:var(--navy-soft-strong);}
  .chip.on{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:600;}
  .chip .n{opacity:.6; font-size:9.5px; margin-left:3px;}
  .chip.on .n{opacity:.7;}
  .chip-empty{font-size:11px; color:var(--ink-soft); font-style:italic;}
  .term-input-row{display:flex; gap:6px; margin-bottom:7px;}
  .term-input-row input{flex:1; border:1px solid var(--border); border-radius:var(--radius); padding:5px 7px; font-size:12px; font-family:inherit;}
  .term-input-row button{border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:var(--radius); padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; font-weight:600;}
  .term-input-row button:hover{background:var(--navy-dark);}

  .controls-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:8px; flex-wrap:wrap;}
  .query-bar{display:flex; gap:8px; align-items:flex-start; flex:1; min-width:280px;}
  .query-bar-inner{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:9px 11px;}
  .query-bar-inner label{display:block; font-size:10.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  #queryBox{width:100%; border:1px solid var(--border); border-radius:var(--radius); padding:7px 9px; font-family:'Inter',monospace; font-size:12px; background:#fff; color:var(--ink); resize:vertical; min-height:34px;}
  #queryBox:focus{outline:1px solid var(--navy);}
  #queryApply{align-self:flex-end; border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:var(--radius); padding:8px 14px; font-size:12px; cursor:pointer; font-family:inherit; white-space:nowrap; margin-top:17px; font-weight:600;}
  #queryApply:hover{background:var(--navy-dark);}
  .reset-btn{background:transparent; border:1px dashed var(--border); color:var(--ink-soft); padding:8px 12px; border-radius:var(--radius); font-size:11.5px; cursor:pointer; font-family:inherit; white-space:nowrap; align-self:flex-start;}
  .reset-btn:hover{border-color:var(--navy); color:var(--navy);}

  .count-row{margin:14px 0 6px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
  .count-big{font-size:32px; font-weight:700; color:var(--ink); line-height:1;}
  .count-big span:first-child{color:var(--navy);}
  .breakdown{font-size:13px; color:var(--ink-soft);}

  .legend{display:flex; gap:16px; margin:0 0 14px; font-size:11.5px; color:var(--ink-soft);}
  .legend-item{display:flex; align-items:center; gap:5px;}
  .legend-item svg{color:var(--navy);}
  .legend-item.auto svg{color:var(--ink-soft);}

  .sort-row{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .sort-row select{border:1px solid var(--border); border-radius:var(--radius); padding:5px 8px; font-family:inherit; font-size:12.5px; color:var(--ink); background:#fff;}
  .sort-row button{border:1px solid var(--border); border-radius:var(--radius); background:#fff; padding:5px 9px; cursor:pointer; font-size:13px; color:var(--ink);}
  .sort-row button:hover{border-color:var(--navy); color:var(--navy);}
  .btn-excel{margin-left:auto; border:1px solid var(--navy)!important; background:var(--navy)!important; color:#fff!important; font-weight:600; font-size:12px!important;}
  .btn-excel:hover{background:var(--navy-dark)!important;}

  .cards{display:flex; flex-direction:column; gap:12px;}
  .card{border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; background:#fff;}
  .card-meta{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .meta-block{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:4px 10px; line-height:1.25;}
  .meta-label{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
  .meta-value{font-size:12.5px; font-weight:600; color:var(--ink);}
  .icono-clasif{margin-left:auto; display:inline-flex; align-items:center; color:var(--navy); cursor:help;}
  .icono-clasif.auto{color:var(--ink-soft);}
  .card-titulo{font-size:16px; font-weight:600; margin:0 0 8px; line-height:1.35;}
  .card-titulo a{color:var(--navy); text-decoration:underline;}
  .card-linea{margin:3px 0; font-size:13px; color:var(--ink-soft);}
  .card-linea .etiqueta{font-weight:600; color:var(--ink); margin-right:5px; font-size:12px;}
  .card-linea.fuente{font-style:italic; font-family:Georgia,'Times New Roman',serif;}
  .card-acciones{display:flex; gap:14px; margin-top:8px;}
  .link-btn{background:none; border:none; padding:0; color:var(--navy); font-size:12px; cursor:pointer; font-family:inherit; text-decoration:underline;}
  .link-btn:hover{color:var(--navy-dark);}
  .extra{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);}
  .card-resumen{margin-top:6px; font-size:13px; color:var(--ink-soft); line-height:1.5; background:var(--surface); border-radius:var(--radius); padding:10px 12px;}

  .empty-state{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .empty-state .big{font-size:19px; font-weight:700; color:var(--ink); margin-bottom:6px;}
  ::-webkit-scrollbar{width:7px;} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <div class="eyebrow" data-i18n="marca"></div>
      <h1 data-i18n="titulo_pagina"></h1>
      <p data-i18n="subtitulo"></p>
    </div>
    <div class="lang-row" id="langSwitch"></div>
  </header>

  <div class="filters-row">
    <div class="filter-block">
      <div class="filter-head"><h2 data-i18n="filtro_tipo"></h2>
        <div class="andor" data-group="tipo"><button data-mode="or" class="active">o</button><button data-mode="and">y</button></div></div>
      <p class="filter-note" data-i18n="nota_tipo"></p>
      <div class="chip-list" id="chipsTipo"></div>
    </div>
    <div class="filter-block">
      <div class="filter-head"><h2 data-i18n="filtro_autores"></h2>
        <div class="andor" data-group="autor"><button data-mode="or" class="active">o</button><button data-mode="and">y</button></div></div>
      <p class="filter-note" data-i18n="nota_autores"></p>
      <input type="text" id="autorSearch" class="chip-search" data-i18n-placeholder="buscar_autor">
      <div class="chip-list" id="chipsAutor"></div>
    </div>
    <div class="filter-block">
      <div class="filter-head"><h2 data-i18n="filtro_instituciones"></h2>
        <div class="andor" data-group="institucion"><button data-mode="or" class="active">o</button><button data-mode="and">y</button></div></div>
      <p class="filter-note" data-i18n="nota_instituciones"></p>
      <input type="text" id="institucionSearch" class="chip-search" data-i18n-placeholder="buscar_institucion">
      <div class="chip-list" id="chipsInstitucion"></div>
    </div>
    <div class="filter-block">
      <div class="filter-head"><h2 data-i18n="filtro_paises"></h2>
        <div class="andor" data-group="pais"><button data-mode="or" class="active">o</button><button data-mode="and">y</button></div></div>
      <p class="filter-note" data-i18n="nota_paises"></p>
      <input type="text" id="paisSearch" class="chip-search" data-i18n-placeholder="buscar_pais">
      <div class="chip-list" id="chipsPais"></div>
    </div>
    <div class="filter-block">
      <div class="filter-head"><h2 data-i18n="filtro_terminos"></h2>
        <div class="andor" data-group="termino"><button data-mode="or" class="active">o</button><button data-mode="and">y</button></div></div>
      <p class="filter-note" data-i18n="nota_terminos"></p>
      <div class="term-input-row"><input type="text" id="terminoInput" data-i18n-placeholder="placeholder_termino"><button id="terminoAdd" data-i18n="anadir"></button></div>
      <div class="chip-list" id="chipsTermino"></div>
    </div>
  </div>

  <div class="controls-row">
    <div class="query-bar">
      <div class="query-bar-inner"><label data-i18n="consulta_titulo"></label><textarea id="queryBox" rows="1"></textarea></div>
      <button id="queryApply" data-i18n="aplicar"></button>
    </div>
    <button class="reset-btn" id="resetAll" data-i18n="limpiar"></button>
  </div>

  <div class="count-row">
    <div class="count-big"><span id="countNum">0</span> <span data-i18n="resultados"></span></div>
    <div class="breakdown" id="breakdown"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="sort-row">
    <span data-i18n="ordenar_por"></span>
    <select id="sortSelect">
      <option value="anio" data-i18n="col_anio"></option>
      <option value="titulo" data-i18n="col_titulo"></option>
      <option value="autores" data-i18n="col_autores"></option>
      <option value="fuente" data-i18n="col_fuente"></option>
      <option value="tipo_id" data-i18n="col_tipo"></option>
    </select>
    <button id="sortDir" title="asc/desc">↓</button>
    <button class="btn-excel" id="btnExcel" data-i18n="descargar_excel"></button>
  </div>

  <div class="cards" id="cards"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big" data-i18n="sin_resultados_titulo"></div>
    <div data-i18n="sin_resultados_texto"></div>
  </div>
</div>

<script>
const DATA = [{"tipo_id": "articulo", "titulo": "Mathematical Work in Linear Algebra. A Transition through Paradigms", "autores": ["Gaona J.", "López S.S.", "Menares-Espinoza R.", "Delgadillo E.M.", "Vandebrouck F.", "Vivier L."], "autores_adretm": ["GAONA Jorge", "LÓPEZ Soledad", "MENARES Romina", "MONTOYA DELGADILLO Elizabeth", "VANDEBROUCK Fabrice", "VIVIER Laurent"], "directores": [], "anio": 2026.0, "fuente": "International Journal of Research in Undergraduate Mathematics Education", "institucion": ["Universidad de Playa Ancha", "Universidad de Viña del Mar", "Universidad de Valparaíso", "Pontificia Universidad Católica de Valparaíso", "Université Paris Cité"], "pais": ["CL", "FR"], "doi": "10.1007/s40753-026-00304-x", "enlace": "https://doi.org/10.1007/s40753-026-00304-x", "resumen": "Research on the teaching and learning of linear algebra has been ongoing for several decades, but it has recently been renewed in the context of non-routine tasks and technological ecosystems, including artificial intelligence. This article analyzes two key transitions: (a) from school-level geometry and algebra to linear algebra, and (b) between different paradigms of linear algebra. We propose a fundamental situation in which the goal is to find the vertices of a polygon given its midpoints. This problem can be modelled using systems of linear equations that may have a unique solution, infinitely many, or none. The situation was divided into three tasks and implemented in three universities in the Valparaíso region that train prospective mathematics teachers. Thirty pre-service teachers participated. Data collected included audio recordings, screen captures, and written productions. The analysis was conducted using the categories of the Mathematical Working Space and the paradigms of linear algebra. Results show that most students were able to transition from geometry to linear algebra, mainly within the first paradigm. The mathematical work was predominantly semiotic and instrumental, but a gradual increase in discursive work was observed all along the didactical situation. Various digital tools were used—mainly GeoGebra and MatrixCalculator, with some use of Wolfram Alpha and ChatGPT—serving to both find algebraic solutions and validate them geometrically. The findings suggest that a long sequence of several open tasks involving domain changes and diverse technologies can support the introduction of linear algebra in teacher education. © The Author(s), under exclusive licence to Springer Nature Switzerland AG 2026.", "palabras_clave": ["Artificial intelligence", "Automatic feedback", "Digital Technology", "Dynamic geometry", "Linear equations system", "Mathematical Working Space", "Online assessment", "Prospective teacher"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Teachers’ mathematical work on quadrilaterals area with digital technology", "autores": ["Salazar J.V.F.", "García-Cuéllar D.J.", "Henríquez-Rivas C.", "Kuzniak A."], "autores_adretm": ["FLORES SALAZAR Jesús", "GARCÍA CUELLAR Daysi", "HENRIQUEZ RIVAS Carolina", "KUZNIAK Alain"], "directores": [], "anio": 2026.0, "fuente": "European Journal of Science and Mathematics Education", "institucion": ["Pontificia Universidad Católica del Perú", "Universidad Católica del Maule", "Université Paris Cité"], "pais": ["PE", "CL", "FR"], "doi": "10.30935/scimath/18435", "enlace": "https://doi.org/10.30935/scimath/18435", "resumen": "The aim of this paper is to analyze the mathematical work done by teachers when interacting with a GeoGebra application in a task on the area of quadrilaterals. The theoretical framework is focused on the mathematical working space (MWS) theory. The research approach is qualitative, based on a case study. The research subjects are two high school mathematics teachers. Results show that, in the personal MWS of both subjects, iconic visualization and pragmatic proof prevail, and the activation of the semiotic and discursive genesis is largely highlighted. Also, the type of device used has been proven to generate different MWS. Copyright © 2026 by authors.", "palabras_clave": ["areas", "mathematical work", "quadrilaterals", "qualitative research", "teacher training"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Educational robotics in mathematics education: A systematic review", "autores": ["Ibáñez-Carrasco M.", "Henríquez-Rivas C."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2026.0, "fuente": "European Journal of Science and Mathematics Education", "institucion": ["Facultad de Ciencias Básicas"], "pais": ["CL"], "doi": "10.30935/scimath/18086", "enlace": "https://doi.org/10.30935/scimath/18086", "resumen": "The implementation of technology in mathematics education signifies an interactive and dynamic learning experience, and educational robotics (ER) in particular has the potential to improve teaching and learning environments in mathematics education. The objective of the present study is to provide a current overview of the literature on robotics in mathematics education and, in turn, to identify the less explored aspects of this area along with emerging directions and ideas, with the aim of defining future research perspectives in robot-assisted mathematics teaching. Forty-four articles were selected from the Web of Science and Scopus databases through keyword searches and the preferred reporting items for systematic review and meta-analyses method, with all works published since 2020. The results indicate that ER plays a positive role in different aspects of mathematics education, both for students at all educational levels and for pre-service and practicing teachers. However, contradictions exist in certain results obtained in the studies reviewed. Ultimately, future research perspectives and challenges for the use of ER in mathematics education are analyzed. Copyright © 2026 by authors.", "palabras_clave": ["educational robotics", "educational technology", "mathematics education", "systematic review"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Teachers’ mathematical work on quadrilaterals area with digital technology", "autores": ["Salazar, J. V. F.", "García-Cuéllar, D. J.", "Henríquez-Rivas, C.", "Kuzniak, A."], "autores_adretm": ["FLORES SALAZAR Jesús", "GARCÍA CUELLAR Daysi", "HENRIQUEZ RIVAS Carolina", "KUZNIAK Alain"], "directores": [], "anio": 2026.0, "fuente": "European Journal of Science and Mathematics Education", "institucion": ["Pontificia Universidad Católica del Perú", "Universidad Católica del Maule", "Université Paris Cité"], "pais": ["PE", "CL", "FR"], "doi": "10.30935/scimath/18435", "enlace": "https://doi.org/10.30935/scimath/18435", "resumen": "This study analyzes teachers’ mathematical work on quadrilateral areas through the use of digital technology from the perspective of the Mathematical Working Space theory. The research highlights how digital tools support visualization, reasoning, and the construction of geometric knowledge in teachers’ work. The findings show that technology promotes richer mathematical interactions and contributes to the development of teachers’ technological and mathematical knowledge.", "palabras_clave": ["mathematical work", "teacher training", "quadrilaterals", "areas", "qualitative research"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Erih Plus, Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Characterization of teacher profiles in teaching specific geometric topics based on a validated instrument", "autores": ["Henríquez-Rivas C.", "Vergara Gómez A.", "A. González-Campos J."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2026.0, "fuente": "Eurasia Journal of Mathematics Science and Technology Education", "institucion": ["Universidad Católica del Maule"], "pais": ["CL"], "doi": "10.29333/ejmste/17910", "enlace": "https://doi.org/10.29333/ejmste/17910", "resumen": "Mathematics education research highlights a need for instruments to better understand teaching practices specifically concerning geometry education. The research is underpinned by the theory of mathematical working spaces and is based on a quantitative approach. This study presents the results of research organized in stages that demonstrates the process of construction and validation of an instrument aimed at characterizing the teaching of specific geometry topics in secondary education (similarity of figures, homothecy, and Thales’ theorem). The instrument was applied to a sample of 63 secondary education mathematics teachers in Chile. The teachers work in public and private educational institutions. Based on confirmatory factor analysis, three empirical dimensions and items for each dimension are established, which allows teacher profiles to be characterized according to how they decide to teach specific geometric topics. The results can be used for decision-making in future research, for teaching training, and for proposing didactic improvements.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Assessing procedural and conceptual understanding on the limit concept: A study on first-year university students", "autores": ["Trapezanlidis T.", "Nikolantonakis K."], "autores_adretm": ["NIKOLANTONAKIS Konstandinos"], "directores": [], "anio": 2026.0, "fuente": "European Journal of Science and Mathematics Education", "institucion": ["Department of Primary Education"], "pais": ["GR"], "doi": "10.30935/scimath/18147", "enlace": "https://doi.org/10.30935/scimath/18147", "resumen": "The limit concept is foundational in undergraduate mathematics. This study assessed procedural knowledge and conceptual understanding of the limit in 87 first-semester students from a major Greek university, enrolled in a calculus I course. Using a structured questionnaire, data were analyzed with quantitative methods (descriptive statistics) and qualitative methods (thematic analysis of student responses). Findings revealed a limited conceptual grasp and a reliance on computational techniques, supporting Skemp’s (1976) distinction between instrumental and relational understanding. Students exhibited challenges in interpreting dynamic processes and showed persistent, rigid concept images that deviated from the formal definition. The study suggests practical adjustments for teaching the limit concept in undergraduate mathematics. Copyright © 2026 by authors.", "palabras_clave": ["concept definition", "concept image", "function", "instrumental", "limit", "relational"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Espacio de trabajo matemático: Una propuesta didáctica para el análisis cualitativo de sistemas de EDO no lineales.", "autores": ["Huaccan Condori, I. I.", "Salazar, J. V. F."], "autores_adretm": ["FLORES SALAZAR Jesús", "HUACCAN CONDORI  Iris Inés"], "directores": [], "anio": 2026.0, "fuente": "Quintaesencia, 17(2), 9–13.", "institucion": [], "pais": ["PE"], "doi": "10.54943/rq.v17i2.895", "enlace": "https://doi.org/10.54943/rq.v17i2.895", "resumen": "Este estudio presenta una propuesta didáctica sustentada en la Teoría de los Espacios de Trabajo Matemático (ETM), específicamente en el ETM idóneo potencial, para el análisis cualitativo de sistemas de ecuaciones diferenciales ordinarias (EDO) no lineales en la carrera de Economía. La propuesta está conformada por una secuencia de tres tareas, la cual busca articular conceptos matemáticos y aplicaciones económicas mediante representaciones simbólicas, gráficas y discursivas, apoyadas en tecnología digital. El análisis a priori evidencia que la propuesta promueve la activación de las génesis semiótica, instrumental y discursiva, así como la articulación de los planos verticales del ETM, favoreciendo el tránsito entre diferentes representaciones y fortaleciendo la comprensión conceptual de los modelos económicos y sus dinámicas.", "palabras_clave": ["ETM idóneo potencial", "EDO", "análisis cualitativo"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Latindex, Dialnet, Crossref", "es_etm": true}, {"tipo_id": "acta_congreso", "titulo": "Analysis of Teacher Discourse: Fostering Student Participation Through Questioning in Mathematics", "autores": ["Espinoza G.", "Menares R.", "Escobedo C.", "Muñoz R."], "autores_adretm": ["MENARES Romina"], "directores": [], "anio": 2026.0, "fuente": "Lecture notes in educational technology", "institucion": ["Universidad de Valparaíso"], "pais": ["CL"], "doi": "10.1007/978-981-95-7580-0_23", "enlace": "https://doi.org/10.1007/978-981-95-7580-0_23", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Design and implementation of a task sequence for teaching homothety", "autores": ["Aguilera Moraga Y.", "Verdugo-Hernández P.", "Gatica J."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2025.0, "fuente": "Eurasia Journal of Mathematics Science and Technology Education", "institucion": ["Universidad de Talca"], "pais": ["CL"], "doi": "10.29333/ejmste/16540", "enlace": "https://doi.org/10.29333/ejmste/16540", "resumen": "The teaching of geometry in Chile faces several challenges, as evidenced by the low performance of students in international assessments. In particular, the concept of homothety is impacted by teaching methodologies that emphasize rote memorization and procedural repetition rather than conceptual understanding. This study explores how a task sequence fosters mathematical work with the concept of homothety among 15- to 16-year-old students in a public high school in the Maule Region of Chile. Grounded in the mathematical working space (MWS) theory, this research provides a framework for analyzing how students engage with mathematical tasks. Employing a qualitative approach, specifically a case study, the findings reveal that the task sequence contributes to progressive mathematical reasoning. The study concludes that the designed activities align with the criteria for “emblematic tasks”, evidencing their fundamental role in supporting students’ conceptual understanding of homothety.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Examination of Mathematical Work Performed in Mathematical Modelling Task in the Light of MWS: The Case of Pre-Service Elementary Mathematics Teachers", "autores": ["Deniz Kıyıcı O.", "Tuba Dikkartın Övez F."], "autores_adretm": ["KIYICI Ozan Deniz"], "directores": [], "anio": 2025.0, "fuente": "Necatibey Eğitim Fakültesi Elektronik Fen ve Matematik Eğitimi Dergisi", "institucion": [], "pais": ["TR"], "doi": "10.17522/balikesirnef.1626066", "enlace": "https://doi.org/10.17522/balikesirnef.1626066", "resumen": "Mathematical modeling plays a crucial role for bridging the gap between mathematics and real-life contexts. The theory of Mathematical Working Spaces (MWS) provides a suitable framework for analyzing the mathematical modeling process by incorporating both epistemological and cognitive dimensions of mathematical work. This study investigates the mathematical work carried out by pre-service elementary mathematics teachers as they engage with modeling-based mathematical tasks, interpreted the lens of MWS. Employing a qualitative case study design, the research involved 15 pre-service teachers selected through criterion sampling. Data were collected via video recordings and written documents capturing the participants’ solution processes, which were guided by exploratory questions. The data were analyzed descriptively, focusing on the components of the MWS framework. The findings reveal that pre-service teachers frequently employed components of the epistemological plane during the problem comprehension and simplification stages of the modeling cycle. The mathematization stage predominantly took place within the semiotic-instrumental plane, while the ‘working mathematically’ stage involved actions spanning across multiple planes. Future research may explore the instructional practices of pre-service teachers as they implement mathematical modeling in classroom environment, guided by the principles of MWS theory.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Covariational reasoning and GeoGebra in the representation of functional relationships when simulating container filling; [Razonamiento covariacional y GeoGebra en la representación de relaciones funcionales al simular el llenado de recipientes]", "autores": ["Martínez-Miraval M.A.", "García-Rodríguez M.L.", "García-Cuéllar D.J."], "autores_adretm": ["GARCÍA CUELLAR Daysi"], "directores": [], "anio": 2025.0, "fuente": "Formacion Universitaria", "institucion": ["Departamento de Ciencias", "Programa de Matemática Educativa"], "pais": ["PE", "MX"], "doi": "10.4067/s0718-50062025000100065", "enlace": "https://doi.org/10.4067/S0718-50062025000100065", "resumen": "The present study aims to analyze the covariational reasoning of students when solving tasks that involve functional relationships by conducting GeoGebra simulations of filling containers. The notions of mental action and levels of covariational reasoning are considered as a theoretical construct, and the case study as a research method. As a result, different strategies are identified to graphically represent the relationship between the height of water inside a container that changes shape, and the volume of water that enters it constantly. The strategies are related to student covariational reasoning and include using areas of geometric figures to relate both variables and construct a finite set of points in the plane to graphically represent functional relationships. In conclusion, the simulations performed with GeoGebra allow students to visualize how simultaneous changes occur between two variables, and thus recognize functional relationships as a dynamic covariation of variables. © (2025), (Centro de Informacion Tecnologica). All rights reserved.", "palabras_clave": ["acciones mentales", "covariational reasoning", "educación matemática", "functional relationship", "GeoGebra simulation", "mathematical education", "mental actions", "razonamiento covariacional", "relaciones funcionales", "simulación con GeoGebra"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Mathematical Working Spaces in the mathematical modeling cycle: the case of preservice elementary mathematics teachers", "autores": ["Deniz Kıyıcı O.", "Tuba Dikkartın Övez F."], "autores_adretm": ["KIYICI Ozan Deniz"], "directores": [], "anio": 2025.0, "fuente": "Educational Studies in Mathematics", "institucion": [], "pais": ["TR"], "doi": "10.1007/s10649-025-10443-8", "enlace": "https://doi.org/10.1007/s10649-025-10443-8", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Pre-service teachers' mathematical work on a calculus task that connects school and university", "autores": ["Menares-Espinoza R.", "Gaona J.", "Henríquez-Rivas C."], "autores_adretm": ["MENARES Romina", "GAONA Jorge", "HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2025.0, "fuente": "Eurasia Journal of Mathematics, Science and Technology Education", "institucion": ["Facultad de Ciencias", "Facultad de Ciencias de la Educación", "Facultad de Ciencias Básicas"], "pais": ["CL"], "doi": "10.29333/ejmste/16861", "enlace": "https://doi.org/10.29333/ejmste/16861", "resumen": "This paper addresses the issue of the gap that exists between the mathematics studied in initial teacher training and the school mathematics that the in-service teacher must teach. We present empirical results on how pre-service teachers (PTs) activate and coordinate cognitive processes and epistemological aspects when solving a university mathematic task that can be solved in the calculus domain. This task can likewise be adapted to the school level. This study is based on the theory of mathematical working spaces (MWS). The results examine the differentiation of the MWS of the participants according to the dynamics present between the problem-solving processes used in the task. The study’s conclusion explores the possibilities offered by the task in terms of enriching the MWS of PTs and contributing to the shrinking of the mathematical gap that exists between the university and the school. © 2025 by the authors.", "palabras_clave": ["calculus", "initial teacher training", "mathematical working spaces", "school mathematics", "tasks design", "university mathematics"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "A playful learning sequence to foster statistical reasoning in students aged 8 to 9; [Secuencia de aprendizaje lúdica que desarrolla el razonamiento estadístico en estudiantes de 8 a 9 años]", "autores": ["Estrella S.", "Ramírez B.", "Mondaca-Saavedra A.", "Méndez-Reina M.", "Vidal-Szabó P.", "Morales S."], "autores_adretm": ["VIDAL-SZABÓ Pedro"], "directores": [], "anio": 2025.0, "fuente": "Educacion Matematica", "institucion": ["Instituto de Matemáticas", "Departamento de Ciencias Exactas", "Departamento de Didáctica"], "pais": ["CL"], "doi": "10.24844/em3702.09", "enlace": "https://doi.org/10.24844/EM3702.09", "resumen": "A playful learning sequence on informal inferential reasoning is presented, consisting of two lessons that integrate key aspects and concepts of this reasoning. The sequence was designed by primary school teachers within the framework of a Lesson Study Group (LSG) and implemented with 23 students aged 8 to 9 (grades 3 and 4). During the lessons, students made predictions, recorded data, obtained samples, and compared them through repeated sampling. Through analyzing teacher-student interaction episodes throughout the sequence, manifestations of core concepts of informal inference were identified. Some students demonstrated an understanding of variability across samples, explored uncertainty in the situation, detected trends across samples, and expressed possibilities by generalizing beyond the data. The sequence fosters the early expression of informal inferences and guides instruction that seeks to develop students’ statistical reasoning. © 2025 Mexican Society for Research and Dissemination of Mathematics Education. All rights reserved.", "palabras_clave": ["early statistics", "informal inferential reasoning", "learning sequence", "repeated sampling", "statistical education"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Design and validation of a questionnaire to explore the geometric work of mathematics teachers", "autores": ["Henríquez-Rivas C.", "Vergara-Gómez A."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2025.0, "fuente": "European Journal of Science and Mathematics Education", "institucion": ["Centro de Investigación en Educación Matemática y Estadística (CIEMAE)"], "pais": ["CL"], "doi": "10.30935/scimath/16161", "enlace": "https://doi.org/10.30935/scimath/16161", "resumen": "Although research highlights the importance of analyzing the geometric work of teachers, there are few validated instruments in this line. This study presents the processes of design and validation of a forced-choice questionnaire that allows the characterization, from a theoretical basis, of how geometry teachers organize their teaching practice. From the theoretical perspective of mathematical working spaces, dimensions and subdimensions were structured. Content validation was achieved by submitting the questionnaire for expert judgment. To analyze the internal consistency, Aiken’s V coefficient and Kendall’s coefficient of concordance were used. The results permitted the general structure of the instrument to be maintained. The final version of the instrument consists of 23 items organized into 3 theoretically sustained dimensions, allowing the exploration of geometry teaching practices among mathematics teachers. Copyright © 2025 by authors;", "palabras_clave": ["geometry", "mathematical working spaces", "questionnaire", "secondary education", "teachers"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "In-service teachers’ mathematical work on quadrilaterals and their technological knowledge", "autores": ["Salazar J.V.F.", "Romero M.C.T.", "Fernández V.N.", "Vara T.N.P."], "autores_adretm": ["FLORES SALAZAR Jesús", "THÉRY ROMERO Morella"], "directores": [], "anio": 2025.0, "fuente": "Eurasia Journal of Mathematics, Science and Technology Education", "institucion": ["Pontificia Universidad Católica del Perú", "Instituto de Investigación sobre la Enseñanza de las Matemáticas"], "pais": ["PE"], "doi": "10.29333/ejmste/16069", "enlace": "https://doi.org/10.29333/ejmste/16069", "resumen": "This article aims to analyze the mathematical work of teachers, associated with their technological knowledge (TK) of quadrilaterals teaching. The research subjects are secondary mathematics teachers. The study uses as a basis the technological pedagogical content knowledge model and the theory of mathematical working spaces. It follows a qualitative research methodology and a case study method. Mathematics teachers interact with digital artifacts to increase their TK in the development of their mathematical work by solving a task on quadrilaterals as their students would. This study presents the analysis of a task involving the construction of a quadrilateral by using GeoGebra. The study revealed that the mathematical work of teachers was favored by developing their TK and their confidence in the use of GeoGebra since using this digital technology implies recognizing the importance of exploring and visualizing representations of mathematical objects. © (2025), (Modestum LTD). All rights reserved.", "palabras_clave": ["geometry", "in-service mathematics teachers", "technological knowledge"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Relationships between domain changes and connections: An analysis from the perspective of mathematical work and teacher knowledge", "autores": ["Espinoza-Vásquez G.", "Verdugo-Hernández P.", "Henríquez-Rivas C."], "autores_adretm": ["ESPINOZA-VÁSQUEZ Gonzalo", "HENRIQUEZ RIVAS Carolina", "VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2025.0, "fuente": "European Public & Social Innovation Review", "institucion": ["Universidad Alberto Hurtado", "Universidad de Talca", "Universidad Católica del Maule"], "pais": ["CL"], "doi": "10.31637/epsir-2025-1460", "enlace": "https://doi.org/10.31637/epsir-2025-1460", "resumen": "Introduction: This study addresses the teaching task contextualized in the teaching of different topics of mathematic (functions, sequences, and Thales’ theorem). To do so, the characteristics of the mathematical work and specialized knowledge that the teacher shows during teaching are analyzed, considering as a frame of reference the complementarity between two theoretical perspectives (MWS and MTSK). Methodology: The study is framed in the qualitative approach, based on an integrated multiple case study design, which allows analysis of the proposed mathematical performance (oral and/or written) of three teachers. Results: The analyses allow a deep examination of the development of mathematical work and demonstration of the relationships between the inter-conceptual connections as well as the domain changes that are expressed in teachers’ work. In general, the results reveal the privileging of algebraic treatments and emphasis on the procedural. Conclusion: Contributions are identified in the perspective of the connection between theories in the context of the models involved.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "In-service teachers’ mathematical work on quadrilaterals and their technological knowledge", "autores": ["Victoria Flores Salazar J.", "Cristina Théry Romero M.", "Neira Fernández V.", "Nelson Peñaloza Vara T."], "autores_adretm": ["PEÑALOZA VARA Nelson", "NEIRA FERNÁNDEZ Verónica", "THÉRY ROMERO Morella", "FLORES SALAZAR Jesús"], "directores": [], "anio": 2025.0, "fuente": "Eurasia Journal of Mathematics Science and Technology Education", "institucion": ["Pontificia Universidad Católica del Perú"], "pais": ["PE"], "doi": "10.29333/ejmste/16069", "enlace": "https://doi.org/10.29333/ejmste/16069", "resumen": "This article aims to analyze the mathematical work of teachers, associated with their technological knowledge (TK) of quadrilaterals teaching. The research subjects are secondary mathematics teachers. The study uses as a basis the technological pedagogical content knowledge model and the theory of mathematical working spaces. It follows a qualitative research methodology and a case study method. Mathematics teachers interact with digital artifacts to increase their TK in the development of their mathematical work by solving a task on quadrilaterals as their students would. This study presents the analysis of a task involving the construction of a quadrilateral by using GeoGebra. The study revealed that the mathematical work of teachers was favored by developing their TK and their confidence in the use of GeoGebra since using this digital technology implies recognizing the importance of exploring and visualizing representations of mathematical objects.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "preprint", "titulo": "Trabajo matemático en Álgebra Lineal. Una transición a través de paradigmas", "autores": ["Gaona J.", "Soledad López S.", "Menares R.", "Montoya-Delgadillo E.", "Vandebrouck F.", "Vivier L."], "autores_adretm": ["GAONA Jorge", "VANDEBROUCK Fabrice", "MENARES Romina", "VIVIER Laurent", "LÓPEZ Soledad"], "directores": [], "anio": 2025.0, "fuente": "", "institucion": ["Universidad de Playa Ancha", "Universidad de Viña del Mar", "Universidad de Valparaíso", "Pontificia Universidad Católica de Valparaíso", "Université Paris Cité", "LDAR"], "pais": ["CL", "FR"], "doi": "10.35542/osf.io/8jfhx_v1", "enlace": "https://doi.org/10.35542/osf.io/8jfhx_v1", "resumen": "", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Trabajo matemático de futuros profesores basado en una secuencia de tareas con tecnología en contextos simulado y colaborativo", "autores": ["Ibáñez-Carrasco M.", "Henríquez-Rivas C."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2025.0, "fuente": "Revista de Estudios y Experiencias en Educación", "institucion": ["Universidad Católica del Maule"], "pais": ["CL"], "doi": "10.21703/rexe.v24i55.2962", "enlace": "https://doi.org/10.21703/rexe.v24i55.2962", "resumen": "This article presents the results of a qualitative study on the teaching of geometric content developed by future mathematics teachers. The aim is to characterize the mathematical work of the participants in solving a proposal for teaching geometry using technology in a simulated and collaborative context. The analyses are based on Mathematical Workspaces (MWS) and task design in mathematics education. The results reveal the different components activated when analyzing the personal and ideal MWS of future teachers. Finally, aspects of mathematical work are discussed, and conclusions are drawn about the limitations and contributions of the study to initial teacher training.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Desempeño de estudiantes de pedagogía matemática en dos problemas sobre operaciones binarias: un estudio de caso", "autores": ["García-Martínez I.", "Pinto-Rojas I.E.", "Sol M.M.-D.", "Rodríguez M.A."], "autores_adretm": [], "directores": [], "anio": 2024.0, "fuente": "Formacion Universitaria", "institucion": ["Facultad de Ciencias", "Facultad de Ciencias de la Educación"], "pais": ["CL"], "doi": "10.4067/s0718-50062024000300139", "enlace": "https://doi.org/10.4067/S0718-50062024000300139", "resumen": "This research study focuses on the mathematical work associated with two non-routine problems on binary operations with the objective of identifying mathematical thinking abilities that students apply when solving problems. An instrumental case study is designed where university students solve arithmetic and algebraic problems. Implicative statistics are applied to conduct quantitative and qualitative analyses of student answers. The results show that students use algebraic and arithmetic techniques without mentioning properties of an algebraic structure. In solving non-routine problems, school mathematics techniques are favored and little use is made of properties and concepts associated with a binary operation, typical of university-level mathematics. In conclusion, there should be an implementation of regular instances to promote solving non-routine problems by considering other mathematical domains such as algebra, geometry, and arithmetic. © (2024), (Centro de Informacion Tecnologica). All rights reserved.", "palabras_clave": ["binary operation", "espacio de trabajo matemático", "estadística implicativa", "habilidades de pensamiento matemático", "implicative statistics", "mathematical thinking skills", "mathematical workspace", "non-routine problems", "operación binaria", "problemas no rutinarios"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Trabalho Matemático De Um Futuro Professor No Ensino Da Diagrama Do Caixa", "autores": ["Verdugo-Hernández P.", "Espinoza-Vásquez G.", "Cumsille P."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula", "ESPINOZA-VÁSQUEZ Gonzalo"], "directores": [], "anio": 2024.0, "fuente": "Revista de Gestao Social e Ambiental", "institucion": ["Campus Linares", "Universidad Alberto Hurtado", "Departamento de Ciencias Básicas"], "pais": ["CL"], "doi": "10.24857/rgsa.v18n2-199", "enlace": "https://doi.org/10.24857/rgsa.v18n2-199", "resumen": "Objective: The study aims to characterize the teaching proposals of the future Mathematics teacher in the context of their practical training in the final year of their university studies. Theoretical Framework: To achieve this, we consider the theory of Mathematical Workspaces, which allows for the analysis of both the mathematical activity that an individual engages in while solving a mathematical task, and the activity that is promoted during teaching. Method: A qualitative methodology is adopted through the design of an instrumental case study. The case pertains to a future teacher conducting a class on constructing a box plot. This class was observed and transcribed for analysis in light of the proposed mathematical work. Results and Discussion: The mathematical work exhibited by the future teacher includes a strong semiotic component and the use of non-material artifacts for quartile calculations. Students' prior knowledge is utilized in this context, with procedural aspects taking precedence over statistical thinking. Implications of the Research: The study raises concerns about the statistical education of mathematics teachers and its impact on future teaching proposals. Originality/Value: This research contributes to the study of statistics and initial teacher training in their influence on the future practices of Mathematics teachers. It provides a characterization of the mathematical work promoted by a future teacher and offers insights into concerns regarding the development of statistical thinking. © 2024 ANPAD - Associacao Nacional de Pos-Graduacao e Pesquisa em Administracao. All rights reserved.", "palabras_clave": ["Box", "Mathematical Work", "Pedagogical Practice", "Secondary Education", "Statistical Graphs", "Whisker Plot"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Semejanza de triángulos desde una perspectiva histórica a la luz del espacio de trabajo matemático en geometría", "autores": ["Nikolantonakis K."], "autores_adretm": ["NIKOLANTONAKIS Konstandinos"], "directores": [], "anio": 2024.0, "fuente": "Revista UCMaule", "institucion": ["University of Western Macedonia"], "pais": ["GR"], "doi": "10.29035/ucmaule.67.88", "enlace": "https://doi.org/10.29035/ucmaule.67.88", "resumen": "La investigación actual indaga en un estudio realizado a 21 estudiantes de tercer grado de secundaria durante el año académico 2020-2021, centrándose en la unidad de enseñanza “Triángulos Semejantes”. El enfoque pedagógico fue diseñado a través del Espacio de Trabajo Matemático para la Geometría (ETMG). Para facilitar esta intervención, se utilizaron siete hojas de trabajo que incorporaban fuentes y problemas de la Historia de las Matemáticas, junto con una evaluación cognitiva conclusiva. Además, los estudiantes participaron en trabajos colaborativos en grupo, construyeron la herramienta histórica de Errard y la aplicaron para medir una distancia que de otro modo sería inaccesible. El objetivo era explorar cómo la integración de la Historia de las Matemáticas dentro del marco del ETMG impacta en la comprensión de los triángulos semejantes por parte de los estudiantes. Después de un análisis cualitativo de las respuestas de los estudiantes, surgió que la integración de problemas históricos en la enseñanza estimuló el compromiso, fomentando una actitud positiva hacia el plan de estudios. Además, enriquecer el espacio de trabajo personal de los estudiantes les brindó la oportunidad de desarrollar una dimensión reflexiva en la resolución de problemas, un aspecto que no se aborda adecuadamente en las actividades estándar del libro de texto.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Interrelaciones entre el trabajo matemático del docente y su conocimiento tecnológico", "autores": ["Victoria Flores Salazar J."], "autores_adretm": ["FLORES SALAZAR Jesús"], "directores": [], "anio": 2024.0, "fuente": "Rematec", "institucion": ["Pontificia Universidad Católica del Perú"], "pais": ["PE"], "doi": "10.37084/rematec.1980-3141.2024.n49.e2024008.id663", "enlace": "https://doi.org/10.37084/rematec.1980-3141.2024.n49.e2024008.id663", "resumen": "Este artigo, que faz parte de um projeto de pesquisa: Espaço de trabalho matemático de professores do ensino médio e seu conhecimento tecnológico, pedagógico e de conteúdo matemático em geometria, que associa a formação de professores em exercício e o uso de tecnologia digital, tem como objetivo analisar o trabalho matemático dos professores e identificar as inter-relações entre o Espaço de Trabalho Matemático (MWS), o modelo de Conhecimento Tecnológico, Pedagógico e de Conteúdo (TPACK), em nosso caso matemático, e a História da Matemática para fornecer uma base mais consistente para a análise de pesquisas que reúnem esses aspectos.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Introducir el concepto de función afín y lineal a partir de una tarea abierta en un entorno tecnológico", "autores": ["Palacios Bezama C.", "Gaona J."], "autores_adretm": ["PALACIOS Catalina", "GAONA Jorge"], "directores": [], "anio": 2024.0, "fuente": "Revista UCMaule", "institucion": ["Universidad de Playa Ancha"], "pais": ["CL"], "doi": "10.29035/ucmaule.67.136", "enlace": "https://doi.org/10.29035/ucmaule.67.136", "resumen": "El estudio se centra en analizar cómo se desarrolla el trabajo matemático de estudiantes de octavo básico (13 y 14 años) en relación con la función lineal y afín al enfrentarse a una tarea abierta en un entorno tecnológico. Se utiliza la Teoría del Espacio de Trabajo Matemático para estudiar lo realizado por los y las estudiantes. La metodología de investigación responde a las fases de la Ingeniería Didáctica, en cuya fase preliminar se realiza un análisis curricular que permite el diseño de la tarea abierta contextualizada. En primera instancia, los y las estudiantes se enfrentan a una tarea sobre cotización de salones de eventos, que puede resolverse de manera aritmética. En segunda instancia, se lleva a cabo una discusión colectiva con los resultados obtenidos por los y las estudiantes, lo que permite la construcción de los conceptos de función lineal y afín, que se encontraban de manera implícita en la tarea. Los resultados muestran un tránsito de un trabajo matemático aritmético individual hacia un trabajo funcional colectivo guiado por la docente a cargo y el rol de la tarea en la plataforma para permitir el trabajo matemático colectivo.", "palabras_clave": ["Evaluación en línea", "función lineal y afín", "tarea abierta", "trabajo matemático colectivo."], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "El nuevo trabajo matemático: Un desafío en constante renovación para la educación matemática", "autores": ["R. Richard P."], "autores_adretm": ["RICHARD Philippe R."], "directores": [], "anio": 2024.0, "fuente": "Revista UCMaule", "institucion": ["Université de Montréal"], "pais": ["CA"], "doi": "10.29035/ucmaule.67.9", "enlace": "https://doi.org/10.29035/ucmaule.67.9", "resumen": "Este ensayo emprende un análisis crítico del papel de la tecnología y la inteligencia artificial (IA) en la enseñanza y el aprendizaje de las matemáticas. Desde la perspectiva de la inteligencia artificial, examina la dinámica de interacción entre los seres humanos y los sistemas inteligentes, explorando su influencia en los procesos educativos y en la adquisición de conocimientos matemáticos. Aborda aspectos cruciales como la responsabilidad mutua en la interfaz informática/didáctica, la evolución de las herramientas tecnológicas en la educación matemática y las teorías fundamentales que guían nuestra comprensión del uso de artefactos digitales en este contexto. Destaca ejemplos concretos de proyectos recientes para ilustrar las aplicaciones prácticas y los condicionantes que afectan al trabajo matemático. Con el objetivo de proporcionar una visión holística, explora cómo la tecnología no solo mejora la educación matemática, sino que también genera un nuevo tipo de trabajo matemático en términos de control, necesidad y obstáculos. Examina las implicaciones para el desarrollo del espacio de trabajo matemático, como sistema de actividad y como método de investigación en didáctica de las matemáticas.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "capitulo_libro", "titulo": "Conocimientos Tecnológicos Y El Espacio De Trabajo Matemático Idóneo De Profesores En La Enseñanza De Cuadriláteros", "autores": ["Victoria Flores Salazar J.", "Cristina Théry Romero M.", "Julissa García-Cuéllar D."], "autores_adretm": ["GARCÍA CUELLAR Daysi", "FLORES SALAZAR Jesús"], "directores": [], "anio": 2024.0, "fuente": "", "institucion": ["Pontificia Universidad Católica de Valparaíso"], "pais": ["PE"], "doi": "10.22533/at.ed.7892411045", "enlace": "https://doi.org/10.22533/at.ed.7892411045", "resumen": "The general objective of this study is to analyze the Health Conditions Performance Index in two border cities, seeking to identify the efficiency, efficacy and effectiveness of public health policies in the border region between Brazil and Bolivia.Factor analysis was used to create the health index based on the correlation of environmental, sociodemographic and administrative financial indexes.The tool for tabulating and generating the indices was SPSS.All indices performed bad, with no improvement over a period corresponding to 10 years.It is concluded that the cities of Guajará-Mirim and Guayaramerín face great difficulties to provide and guarantee complete environmental, social and economic well-being.Therefore, it is imperative that border municipalities develop specific public policies to promote, protect and recover the health of the population.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Relaciones teóricas en el ETM idóneo efectivo de profesores de Educación Secundaria", "autores": ["Henríquez-Rivas C.", "Vergara Gómez A."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina"], "directores": [], "anio": 2024.0, "fuente": "Revista UCMaule", "institucion": ["Universidad Católica del Maule"], "pais": ["CL"], "doi": "10.29035/ucmaule.67.63", "enlace": "https://doi.org/10.29035/ucmaule.67.63", "resumen": "La investigación reciente destaca la necesidad de conectar el trabajo matemático del profesorado con modelos teóricos existentes. De aquí que el presente estudio pone atención en relaciones teóricas del trabajo matemático en el aula de profesores de educación secundaria, con énfasis en la enseñanza de la geometría, sustentado en la teoría de los Espacios de Trabajo Matemático (ETM). La metodología se basa en un enfoque mixto secuencial. En una primera fase, de carácter cuantitativo, se realiza un análisis de variables categóricas, considerando una muestra de 63 profesores, lo cual permite analizar las relaciones entre componentes teóricas del ETM y el diseño de tareas. Luego, en una fase cualitativa, se entrevista a un profesor, como caso representativo, para profundizar en dichas relaciones. Los resultados permiten mostrar interpretaciones sobre las relaciones entre componentes teóricas en el ETM de los profesores participantes con base en la evidencia empírica. Finalmente, las relaciones teóricas pueden ser consideradas en investigaciones futuras para la valoración de los ETM del profesorado, el diseño de tareas, o bien para la investigación centrada en la enseñanza.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Sobre la realidad del trabajo matemático realizado por alumnos y profesores", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2024.0, "fuente": "Revista UCMaule", "institucion": ["Université Paris Cité"], "pais": ["FR"], "doi": "10.29035/ucmaule.67.31", "enlace": "https://doi.org/10.29035/ucmaule.67.31", "resumen": "Este trabajo se centra especialmente en la realidad del trabajo matemático realizado por alumnos y profesores. Para investigar esta cuestión, se desarrollaron sesiones de clase en un curso de formación continua de profesores. Estas sesiones se analizaron mediante el uso de la Teoría de las Situaciones Didácticas (TDS) y la Teoría de los Espacios de Trabajo Matemático (ThETM). El uso combinado de estas dos teorías ha permitido desarrollar y realizar una codificación de las sesiones observadas. Con esta codificación, pudimos estudiar los ETM idóneos (potenciales y reales) que surgieron durante la formación. En particular, es posible identificar diferentes patrones que permiten reconocer y caracterizar distintas formas de contratos fuertemente didácticos. Las herramientas, y especialmente la codificación, desarrolladas para el estudio podrían utilizarse en futuras investigaciones sobre situaciones didácticas en relación con el ETM idóneo.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The teaching of mathematical modelling and the mathematical work: A dynamic that is problematic", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2024.0, "fuente": "Recherches en didactique des mathématiques.", "institucion": ["LDAR"], "pais": ["FR"], "doi": "10.46298/rdm.12907", "enlace": "https://doi.org/10.46298/rdm.12907", "resumen": "The first part of the course considers the reasons for the interest in mathematical modelling and the resulting approach to teaching mathematics. The study focuses on approaches based on the modelling cycle associated with Northern European theories on modelling in education in relation to competency-based teaching. Additionally, the text reflects on our experience of teaching modelling as part of the master’s degree in didactics at the University of Paris-Diderot since 2000. By emphasising the role of mathematisation and models, we question and discuss the reality of the mathematical work developed by teachers and students in this manner. In the second part of the course, we deal with the theme of horizontal mathematisation and the chaining of models introduced in the context of Realistic Mathematics Education. Drawing on the theory of Mathematical Work Spaces (MWS), we then show how we consider the link between modelling activity and the training of mathematical work. Recent research in this area focused on mathematisation, the interplay between alternative models, and the connection between MWSs. The dual cognitive and epistemological approach to modelling activities is adopted. This aspect is illustrated, explored, and discussed in the workshop associated with the course. En la primera parte del curso se examinan las razones del interés por la modelización matemática y el enfoque que resulta para la enseñanza de las matemáticas. El estudio se centra en los enfoques basados en el ciclo de modelización asociados a las teorías del norte de Europa sobre la modelización en la educación en relación con la enseñanza basada en competencias. Además, reflexionamos sobre nuestra experiencia de enseñanza de la modelización en el marco del máster de didáctica de la Universidad de París-Diderot desde el año 2000. Al hacer hincapié en el papel de la matematización y de los modelos, cuestionamos y discutimos la realidad del trabajo matemático desarrollado de esta manera por profesores y alumnos. En la segunda parte del curso, abordamos el tema de la matematización horizontal y del encadenamiento de modelos introducidos en el contexto de la Educación Matemática Realista. Con el uso de la teoría de los Espacios de Trabajo Matemático (ETM), mostramos a continuación cómo concebimos el vínculo entre la actividad de modelización y la formación del trabajo matemático. Las investigaciones recientes en este ámbito se centran en la matematización, la interacción entre modelos alternativos y la conexión entre los ETM. Se adopta el doble punto de vista cognitivo y epistemológico sobre las actividades de modelización. Esta persperctiva se ilustra, explora y discute en el taller asociado al curso. Dans une première partie du texte, nous considérons les raisons de l’intérêt porté à la modélisation mathématique et l’approche des mathématiques enseignées qui en résulte. Pour cette étude, nous privilégierons les approches menées autour du cycle de modélisation associé aux théories nord-européennes sur la modélisation dans l’enseignement en relation avec un enseignement par compétences. Nous reviendrons également sur notre expérience d’un enseignement de la modélisation dans le cadre du master de didactique de l’université Paris-Diderot à partir des années 2000. En insistant sur la place de la mathématisation et sur le rôle des modèles, nous questionnerons et discuterons la réalité du travail mathématique ainsi développé par les enseignants et les élèves. Dans la seconde partie du cours, nous reprendrons la thématique de la mathématisation horizontale et du chaînage des modèles introduite dans le cadre de la Realistic Mathematics Education. Puis, en nous appuyant sur la théorie des espaces de travail mathématique (ETM), nous montrerons comment nous concevons l’articulation entre activité de modélisation et formation du travail mathématique. Les recherches récentes, menées dans ce cadre, sont centrées sur la mathématisation, les jeux entre modèles alternatifs et la connexion entre ETM. Elles intègrent un double regard, cognitif et épistémologique, sur les activités de modélisation. Cette seconde partie sera illustrée, approfondie et discutée dans l’atelier associé au cours.", "palabras_clave": ["Theme (computing)"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Strongly didactic contracts and mathematical work", "autores": ["Kuzniak A.", "Masselin B."], "autores_adretm": ["KUZNIAK Alain", "MASSELIN Blandine"], "directores": [], "anio": 2024.0, "fuente": "Educational Studies in Mathematics", "institucion": ["LDAR"], "pais": ["FR"], "doi": "10.1007/s10649-023-10286-1", "enlace": "https://doi.org/10.1007/s10649-023-10286-1", "resumen": "This paper describes how the notion of the strongly didactic contract can serve to characterize the teaching adopted to implement a task in probability. It is particularly focused on the reality of mathematical work performed by students and teachers. For this research, classroom sessions were developed in an in-service teacher training course designed (and adapted) according to the Japanese Lesson Study model. Through the combined use of the Theory of Didactical Situations (TDS) and the Theory of Mathematical Working Spaces (ThMWS), a coding of the sessions observed was developed. Based on this coding, different patterns emerged which gave each session a specific rhythm and identity from which it was possible to recognize and characterize different strongly didactic contracts. The study highlights the difference between the potential contracts intended by the teachers and those observed in practice. The tools, and especially the coding, developed for the study could be used for future research on instructional situations or in-service teacher training. © The Author(s), under exclusive licence to Springer Nature B.V. 2024.", "palabras_clave": ["Devolution and institutionalization", "Instructional situations", "Itineraries and paths", "Mathematical work and work circulation", "Strongly didactic contract"], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "Scopus", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The work of a prospective high school teacher in pre-professional training in highlighting mathematical knowledge", "autores": ["Verdugo-Hernández P.", "Caviedes S."], "autores_adretm": ["VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2024.0, "fuente": "Eurasia Journal of Mathematics Science and Technology Education", "institucion": ["Universidad de Talca", "Universidad Internacional De La Rioja"], "pais": ["CL", "ES"], "doi": "10.29333/ejmste/15473", "enlace": "https://doi.org/10.29333/ejmste/15473", "resumen": "This article aims to identify the knowledge that enables a prospective secondary school teacher to mobilize number sense components during a pre-professional practicum. Using a qualitative case study approach, four classroom episodes focused on fractions, percentages, and algebraic language are analyzed. The study involves one prospective teacher and 23 students from a multi-grade school in central-southern Chile. The analysis integrates teacher’s specialized knowledge and mathematical working spaces to explore how these frameworks inform the teacher’s knowledge. The findings reveal that the teacher employs personal theories, real-life examples, and graphical aids to enhance students’ understanding, though there is a reliance on rules and algorithms. While specialized knowledge aids in teaching, there is less emphasis on fostering students’ conceptual understanding and judgement. The study recommends improving teacher training programs to better equip prospective teachers in grasping number sense components, highlighting the need for more focused training on its development.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Teachers’ mathematical work based on examples presented in the teaching of algebra in secondary education", "autores": ["Henríquez-Rivas C.", "Verdugo-Hernández P."], "autores_adretm": ["HENRIQUEZ RIVAS Carolina", "VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2024.0, "fuente": "Frontiers in Education", "institucion": ["Universidad Católica del Maule", "Universidad de Talca"], "pais": ["CL"], "doi": "10.3389/feduc.2024.1346091", "enlace": "https://doi.org/10.3389/feduc.2024.1346091", "resumen": "Both international examination results and scientific evidence related to the teaching and learning of school algebra point to the necessity for analyzing mathematical practice in the classroom. In this context, we have formulated the research objective of characterizing the mathematical work that teachers favor based on the examples that they implement in the teaching of topics within the domain of secondary school algebra. To this end, this study is situated within the interpretive paradigm utilizing an instrumental collective case study approach. The study design entails the selection of two representative cases of mathematics teachers in Chilean schools, with the objective of understanding and describing their mathematical work in the secondary school classroom based on the examples they present. The results show that the first teacher utilizes varied examples that activate distinct forms of mathematical thinking, promoting the activation of both instrumental and discursive genesis. In contrast, the second teacher follows a more traditional approach, with the use of examples to illustrate and motivate, and a direct presentation of knowledge, activating primarily semiotic genesis, in which a transition between the numerical and the algebraic is lacking. Ultimately, the results highlight the importance of deeper consideration of the choice of examples in the teaching of algebra and how these examples can influence students’ learning. Furthermore, additional ideas are put forward for future work in this line of research associated with the use of examples in the classroom.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "manual", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "Mathematical Work of a Future Teacher in Teaching the Box Plot Diagram", "autores": ["Verdugo-Hernández P.", "Espinoza-Vásquez G.", "Cumsille P."], "autores_adretm": ["ESPINOZA-VÁSQUEZ Gonzalo", "VERDUGO-HERNÁNDEZ Paula"], "directores": [], "anio": 2024.0, "fuente": "Revista de Gestão Social e Ambiental", "institucion": ["Universidad de Talca", "Universidad Alberto Hurtado", "University of Chile"], "pais": ["CL"], "doi": "10.24857/rgsa.v18n2-199", "enlace": "https://doi.org/10.24857/rgsa.v18n2-199", "resumen": "Objective: The study aims to characterize the teaching proposals of the future Mathematics teacher in the context of their practical training in the final year of their university studies. Theoretical Framework: To achieve this, we consider the theory of Mathematical Workspaces, which allows for the analysis of both the mathematical activity that an individual engages in while solving a mathematical task, and the activity that is promoted during teaching. Method: A qualitative methodology is adopted through the design of an instrumental case study. The case pertains to a future teacher conducting a class on constructing a box plot. This class was observed and transcribed for analysis in light of the proposed mathematical work. Results and Discussion: The mathematical work exhibited by the future teacher includes a strong semiotic component and the use of non-material artifacts for quartile calculations. Students' prior knowledge is utilized in this context, with procedural aspects taking precedence over statistical thinking. Implications of the Research: The study raises concerns about the statistical education of mathematics teachers and its impact on future teaching proposals. Originality/Value: This research contributes to the study of statistics and initial teacher training in their influence on the future practices of Mathematics teachers. It provides a characterization of the mathematical work promoted by a future teacher and offers insights into concerns regarding the development of statistical thinking.", "palabras_clave": [], "clasificaciones": [], "clasificacion_etm": "auto", "origen": "OpenAlex", "es_etm": true}, {"tipo_id": "articulo", "titulo": "The teaching of mathematical modelling and the mathematical work: A dynamic that is problematic", "autores": ["Kuzniak A."], "autores_adretm": ["KUZNIAK Alain"], "directores": [], "anio": 2024.0, "fuente": "Recherches en didactique des mathématiques", "institucion": ["LDAR"], "pais": ["FR"], "doi": "10.46298/rdm.12907", "enlace": "https://doi.org/10.46298/rdm.12907", "resumen": "The first part of the course considers the reasons for the interest in mathematical modelling and the resulting approach to teaching mathematics. The study focuses on approaches based on the modelling cycle associated with Northern European theories on modelling in education in relation to competency-based teaching. Additionally, the text reflects on our experience of teaching modelling as part of the master’s degree in didactics at the University of Paris-Diderot since 2000. By emphasising the role of mathematisation and models, we question and discuss the reality of the mathematical work developed by teachers and students in this manner. In the second part of the course, we deal with the theme of horizontal mathematisation and the chaining of models introduced in the context of Realistic Mathematics Education. Drawing on the theory of Mathematical Work Spaces (MWS), we then show how we consider the link between modelling activity and the training of mathematical work. Recent research in this area focused on mathematisation, the interplay between alternative models, and the connection between MWSs. The dual cognitive and epistemological approach to modelling activities is adopted. This aspect is illustrated, explored, and discussed in the workshop associated with the course. En la primera parte del curso se examinan las razones del interés por la modelización matemática y el enfoque que resulta para la enseñanza de las matemáticas. El estudio se centra en los enfoques basados en el ciclo de modelización asociados a las teorías del norte de Europa sobre la modelización en la educación en relación con la enseñanza basada en competencias. Además, reflexionamos sobre nuestra experiencia de enseñanza de la modelización en el marco del máster de didáctica de la Universidad de París-Diderot desde el año 2000. Al hacer hincapié en el papel de la matematización y de los modelos, cuestionamos y discutimos la realidad del trabajo matemático desarrollado de esta manera por profesores y alumnos. En la segunda parte del curso, abordamos el tema de la matematización horizontal y del encadenamiento de modelos introducidos en el contexto de la Educación Matemática Realista. Con el uso de la teoría de los Espacios de Trabajo Matemático (ETM), mostramos a continuación cómo concebimos el vínculo entre la actividad de modelización y la formación del trabajo matemático. Las investigaciones recientes en este ámbito se centran en la matematización, la interacción entre modelos alternativos y la conexión entre los ETM. Se adopta el doble punto de vista cognitivo y epistemológico sobre las actividades de modelización. Esta persperctiva se ilustra, explora y discute en el taller asociado al curso. Dans une première partie du texte, nous considérons les raisons de l’intérêt porté à la modélisation mathématique et l’approche des mathématiques enseignées qui en résulte. Pour cette étude, nous privilégierons les approches menées autour du cycle de modélisation associé aux théories nord-européennes sur la modélisation dans l’enseignement en relation avec un enseignement par compétences. Nous reviendrons également sur notre expérience d’un enseignement de la modélisation dans le cadre du master de didactique de l’université Paris-Diderot à partir des années 2000. En insistant sur la place de la mathématisation et sur le rôle des modèles, nous questionnerons et discuterons la réalité du travail mathématique ainsi développé par les enseignants et les élèves. Dans la seconde partie du cours, nous reprendrons la thématique de la mathématisation horizontale et du chaînage des modèles introduite dans le cadre de la Realistic Mathematics Education. Puis, en nous appuyant sur la théorie des espaces de travail mathématique (ETM), nous montrerons comment nous concevons l’articulation entre activité de modélisation et formation du travail mathématique. Les recherches récentes, menées dans ce cadre, sont centrées sur la mathématisation, les jeux entre modèles alternatifs et la connexion entre ETM. Elles intègrent un double regard, cognitif et épistémologique, sur les activités de modélisation. Cette seconde partie sera illustrée, approfondie et discutée dans l’atelier associé au cours.", "palabras_c
