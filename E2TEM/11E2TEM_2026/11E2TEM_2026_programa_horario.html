<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa (horario) — E2TEM 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>

:root {
    --pri: #004578; --sec: #F4BD0D;
    --bg: #f5f7fa; --text: #0f172a; --text-light: #64748b;
    --card-bg: #ffffff;
    --pri-light: #00457812; --sec-light: #F4BD0D22;
    --font-titulo: 'DM Sans', sans-serif;
    --font-cuerpo: 'DM Sans', sans-serif;
    --radio: 8px;
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
    font-family:var(--font-cuerpo);
    color:var(--text); background:var(--bg);
    line-height:1.6; overflow-x:hidden;
}

/* ── Secciones y contenedor ─────────────────────────────────── */
.section { padding:4rem 0; }
.container { max-width:1100px; margin:0 auto; padding:0 2rem; }
.section-title {
    font-size:1.6rem; font-weight:700;
    color:var(--pri); margin-bottom:2rem; position:relative;
    padding-bottom:0.75rem;
}
.section-title::after {
    content:''; display:block; position:absolute; bottom:0; left:0;
    width:40px; height:3px; background:var(--sec); border-radius:2px;
}

/* ── Hero ───────────────────────────────────────────────────── */
.hero {
    background:var(--pri); display:flex; flex-direction:column;
    min-height:0; overflow:hidden;
}
.hero-top {
    padding:2.5rem 2rem 2rem;
    display:flex; align-items:flex-start; gap:1.5rem;
    max-width:1100px; margin:0 auto; width:100%;
}
.hero-numero {
    font-size:clamp(4rem,10vw,7rem); font-weight:700;
    color:var(--sec); line-height:1; flex-shrink:0;
    letter-spacing:-0.02em;
}
.hero-titulo-wrap {
    display:flex; flex-direction:column; justify-content:center; padding-top:0.5rem;
}
.hero-evento {
    font-size:0.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.12em; color:rgba(255,255,255,0.45); margin-bottom:0.5rem;
}
.hero h1 {
    font-size:clamp(1.2rem,3vw,1.8rem); font-weight:600;
    color:#fff; line-height:1.25;
}
.hero-tagline {
    font-size:0.95rem; color:rgba(255,255,255,0.55); font-style:italic; margin-top:0.4rem;
}
.hero-institution {
    font-size:0.85rem; color:rgba(255,255,255,0.5);
    margin-top:0.5rem;
}
.hero-meta-bar {
    background:#fff; border-top:3px solid var(--sec);
    padding:0; width:100%;
}
.hero-meta-bar .container {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:0;
}
.hero-meta-item {
    padding:1rem 1.5rem;
    border-right:1px solid #e2e8f0;
    display:flex; flex-direction:column; gap:2px;
}
.hero-meta-item:last-child { border-right:none; }
.hero-meta-item svg { display:none; } /* íconos ocultos: coherente con la estética plana de fichas */
.hero-meta-label {
    font-size:0.68rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--pri);
}
.hero-meta-val {
    font-size:0.92rem; color:var(--text); font-weight:500;
}
.cta-button {
    display:inline-block; margin-top:1.2rem; background:var(--sec); color:var(--pri);
    font-weight:700; padding:0.75em 2em; border-radius:var(--radio);
    text-decoration:none; font-size:0.9rem; letter-spacing:0.03em;
    text-transform:uppercase; transition:opacity 0.2s;
}
.cta-button:hover { opacity:0.85; }

/* ── Hero con imagen ─────────────────────────────────────────── */
.hero-image-mode { background:var(--pri); display:flex; flex-direction:column; }
.hero-image-wrap { width:100%; }
.hero-image-wrap img { width:100%; max-width:1920px; height:auto; display:block; }

/* ── Banner institucional ──────────────────────────────────── */
.banner-section { background:var(--bg); padding:2.5rem 1.5rem; display:flex; flex-direction:column; align-items:center; gap:1rem; }
.banner-label { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.15em; color:var(--text-light); }
.banner-wrap {
    max-width:1100px; width:100%; background:var(--card-bg); border-radius:var(--radio);
    padding:1.2rem 2rem; border:1px solid #e2e8f0;
    display:flex; justify-content:center; align-items:center;
}
.banner-wrap img { max-width:100%; height:auto; display:block; }

/* ── Descripción ────────────────────────────────────────────── */
.desc-section { background:var(--card-bg); border-top:3px solid var(--sec); }
.desc-text { font-size:1.05rem; line-height:1.85; color:var(--text); max-width:780px; margin:0 auto 1rem; }
.desc-text:last-child { margin-bottom:0; }

/* ── Afiche (nuevo — subpáginas) ────────────────────────────── */
.afiche-section { background:var(--bg); }
.afiche-card {
    display:flex; gap:2rem; align-items:center; background:var(--card-bg);
    border:1px solid #e2e8f0; border-top:3px solid var(--sec); border-radius:var(--radio);
    padding:1.5rem; max-width:800px; margin:0 auto;
}
.afiche-img-wrap { flex:0 0 200px; border-radius:var(--radio); overflow:hidden; border:1px solid #e2e8f0; }
.afiche-img-wrap img { width:100%; display:block; }
.afiche-info { flex:1; }
.afiche-info h2 { font-size:1.25rem; font-weight:700; color:var(--pri); margin-bottom:0.6rem; }
.afiche-info p { color:var(--text-light); margin-bottom:0.8rem; line-height:1.6; font-size:0.92rem; }
.afiche-download { color:var(--pri); font-weight:700; text-decoration:none; font-size:0.88rem; }
.afiche-download:hover { text-decoration:underline; }
@media(max-width:600px) {
    .afiche-card { flex-direction:column; text-align:center; }
    .afiche-img-wrap { flex:none; max-width:220px; margin:0 auto; }
}

/* ── Jornada Satélite (nuevo — subpáginas) ──────────────────── */
.satelite-section { background:var(--sec-light); }
.satelite-card {
    background:var(--card-bg); border:1px solid #e2e8f0; border-top:3px solid var(--pri);
    border-radius:var(--radio); padding:1.8rem;
}
.satelite-card h3 { font-size:1.2rem; font-weight:700; color:var(--pri); margin-bottom:0.8rem; }
.sat-desc { color:var(--text); line-height:1.8; margin-bottom:1rem; max-width:600px; }
.sat-details { display:flex; flex-direction:column; gap:0.5rem; margin:0.8rem 0; }
.sat-detail-item { display:flex; align-items:center; gap:0.5rem; font-size:0.9rem; color:var(--text-light); }
.sat-icon { display:none; }
.sat-maps-link { color:var(--pri); font-weight:700; text-decoration:none; }
.sat-maps-link:hover { text-decoration:underline; }

/* ── Sponsors (nuevo — subpáginas) ──────────────────────────── */
.sponsors-section { background:var(--pri-light); }
.sponsors-text { text-align:center; font-size:1rem; color:var(--text-light); }

/* ── Contacto y footer (nuevo — subpáginas) ─────────────────── */
.contact-section { background:var(--pri); color:#fff; }
.contact-section .section-title { color:#fff; }
.contact-section .section-title::after { background:var(--sec); }
.contact-grid { display:flex; justify-content:center; gap:2rem; text-align:center; flex-wrap:wrap; }
.contact-item { padding:1.2rem; }
.contact-item h3 {
    font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--sec); margin-bottom:0.4rem;
}
.contact-item a { color:rgba(255,255,255,0.85); text-decoration:none; transition:color 0.2s; }
.contact-item a:hover { color:var(--sec); }
.footer {
    background:var(--pri); border-top:1px solid rgba(255,255,255,0.15);
    color:rgba(255,255,255,0.4); text-align:center; padding:1.5rem; font-size:0.8rem;
}

/* ── Fichas de datos clave ───────────────────────────────────── */
.cards-fichas-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:0; background:#e2e8f0; border:1px solid #e2e8f0;
    border-radius:var(--radio); overflow:hidden; margin-bottom:1.5rem;
}
.card-ficha {
    background:var(--card-bg); padding:1rem 1.2rem;
    display:flex; flex-direction:column; gap:3px;
    border-right:1px solid #e2e8f0;
}
.card-ficha:last-child { border-right:none; }
.card-ficha-icon { display:none; }
.card-ficha-label {
    font-size:0.68rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--pri);
}
.card-ficha-value { font-size:0.9rem; color:var(--text); font-weight:500; }
.card-ficha-cta { text-align:left; margin-top:0.5rem; }

/* ── Sede ───────────────────────────────────────────────────── */
.sede-info-basica {
    background:var(--card-bg); border:1px solid #e2e8f0; border-radius:var(--radio);
    padding:1.1rem 1.5rem; margin-bottom:2rem;
    display:flex; flex-wrap:wrap; gap:1rem 2.5rem; align-items:center;
}
.sede-info-item { display:flex; flex-direction:column; gap:0.1rem; }
.sede-info-label {
    font-size:0.68rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.09em; color:var(--pri);
}
.sede-info-val { font-size:0.92rem; color:var(--text); }
.sede-maps-btn {
    display:inline-flex; align-items:center; gap:0.4rem;
    background:var(--pri); color:#fff; font-size:0.8rem; font-weight:700;
    padding:0.4rem 1rem; border-radius:var(--radio); text-decoration:none;
    transition:opacity 0.2s; white-space:nowrap;
}
.sede-maps-btn:hover { opacity:0.85; }
.sede-intro {
    font-size:0.95rem; color:var(--text); line-height:1.8;
    margin-bottom:1.8rem;
}
.sede-carrusel-wrap {
    position:relative; display:flex; align-items:center;
    gap:1rem; max-width:600px; margin:0 auto;
}
.sede-carrusel-viewport { overflow:hidden; flex:1; }
.sede-carrusel-track { display:flex; transition:transform 0.4s ease; }
.sede-slide { min-width:100%; padding:0 0.25rem; box-sizing:border-box; }
.sede-card {
    background:var(--card-bg); border-radius:var(--radio);
    border:1px solid #e2e8f0; overflow:hidden; display:flex; flex-direction:column;
}
.sede-card-foto {
    width:100%; height:220px; object-fit:cover; object-position:center; display:block;
}
.sede-card-foto-placeholder {
    width:100%; height:220px; background:var(--pri-light);
    display:flex; align-items:center; justify-content:center; font-size:3rem;
}
.sede-card-logo { object-fit:contain !important; background:#fff; padding:1rem; height:180px; }
.sede-card-body { padding:1.2rem 1.4rem; display:flex; flex-direction:column; gap:0.4rem; }
.sede-card-sub {
    font-size:0.68rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.1em; color:var(--pri);
}
.sede-card-titulo { font-size:1rem; font-weight:600; color:var(--text); line-height:1.35; }
.sede-card-texto { font-size:0.88rem; color:var(--text-light); line-height:1.7; }
.sede-card-link {
    font-size:0.82rem; font-weight:700; color:var(--pri);
    text-decoration:none; margin-top:0.3rem; display:inline-block;
}
.sede-card-link:hover { text-decoration:underline; }
.sede-btn {
    flex-shrink:0; width:36px; height:36px; border-radius:50%;
    background:#e2e8f0; color:var(--pri); border:none;
    font-size:1.1rem; cursor:pointer; display:flex; align-items:center;
    justify-content:center; transition:background 0.2s;
}
.sede-btn:hover { background:var(--pri); color:#fff; }
.sede-dots { display:flex; justify-content:center; gap:6px; margin-top:1rem; }
.sede-dot {
    width:7px; height:7px; border-radius:50%; background:#e2e8f0;
    border:none; cursor:pointer; transition:background 0.2s; padding:0;
}
.sede-dot.activo { background:var(--pri); }

/* ── Comités ────────────────────────────────────────────────── */
.com-seccion { background:var(--bg); }
.com-seccion:nth-child(even) { background:#edf2f7; }
.com-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:0.6rem; margin-top:1rem;
}
.com-card {
    background:var(--card-bg); border-radius:var(--radio);
    border:1px solid #e2e8f0; display:flex;
    flex-direction:row; align-items:flex-start; gap:0.85rem;
    padding:0.85rem 1rem; border-left:3px solid var(--sec);
    transition:border-color 0.2s;
}
.com-card:hover { border-left-color:var(--pri); }
.com-card.com-card-destacado { border-left-color:var(--pri); background:#f8fafc; }
.com-foto-wrap {
    flex-shrink:0; width:52px; height:52px; border-radius:var(--radio);
    overflow:hidden; background:var(--pri-light);
}
.com-foto-wrap img { width:100%; height:100%; object-fit:cover; }
.com-foto-placeholder {
    width:100%; height:100%; display:flex; align-items:center;
    justify-content:center; font-size:1.2rem; font-weight:700; color:var(--pri);
}
.com-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:0.1rem; }
.com-sub {
    font-size:0.65rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.09em; color:var(--pri);
}
.com-nombre { font-size:0.92rem; font-weight:600; color:var(--text); line-height:1.3; }
.com-inst { font-size:0.76rem; color:var(--text-light); }
.com-toggle {
    cursor:pointer; display:inline-flex; align-items:center; gap:0.3rem;
    font-size:0.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--pri); background:none;
    border:none; padding:0.2rem 0 0; font-family:inherit;
}
.com-toggle .com-arrow { display:inline-block; transition:transform 0.2s; }
.com-toggle[aria-expanded='true'] .com-arrow { transform:rotate(180deg); }
.com-detalle { max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
.com-detalle.open { max-height:500px; }
.com-detalle-inner { padding-top:0.6rem; display:flex; flex-direction:column; gap:0.4rem; }
.com-pais { font-size:0.76rem; color:var(--text-light); }
.com-resena { font-size:0.8rem; color:var(--text); line-height:1.65; }
.com-links { display:flex; flex-wrap:wrap; gap:0.3rem; }
.com-link {
    display:inline-flex; align-items:center; gap:3px;
    min-width:26px; height:24px; padding:0 0.4rem; border-radius:4px;
    font-size:0.66rem; font-weight:700; text-decoration:none;
    background:var(--pri-light); color:var(--pri);
    transition:background 0.2s; white-space:nowrap;
}
.com-link:hover { background:var(--pri); color:#fff; }
@media(max-width:600px) { .com-grid { grid-template-columns:1fr; } }

/* ── Contribuciones ─────────────────────────────────────────── */
.contrib-section { background:var(--bg); }
.contrib-section:nth-child(even) { background:#edf2f7; }
.contrib-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1.2rem; margin-bottom:1.5rem; }
.contrib-card {
    background:var(--card-bg); border-radius:var(--radio); padding:1.5rem;
    border:1px solid #e2e8f0; border-top:3px solid var(--sec);
    display:flex; flex-direction:column; gap:0.7rem;
}
.contrib-header { display:flex; align-items:center; gap:0.8rem; }
.contrib-sigla {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:46px; height:46px; background:var(--pri); color:#fff;
    font-size:1.1rem; font-weight:700; border-radius:var(--radio);
    padding:0 0.4rem; flex-shrink:0;
}
.contrib-tipo { font-size:1.1rem; font-weight:600; color:var(--pri); }
.contrib-desc { color:var(--text); line-height:1.75; font-size:0.95rem; }
.contrib-meta { display:flex; flex-wrap:wrap; gap:0.3rem 1.2rem; }
.contrib-meta-item { font-size:0.85rem; color:var(--text-light); }
.contrib-meta-item strong { color:var(--pri); }
.contrib-secciones-title {
    font-size:0.75rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--sec); margin-bottom:0.3rem;
}
.contrib-sections { list-style:none; display:flex; flex-wrap:wrap; gap:0.3rem; }
.contrib-sections li {
    font-size:0.78rem; background:var(--pri-light); color:var(--pri);
    padding:0.15em 0.65em; border-radius:4px;
}
.contrib-nota {
    font-size:0.85rem; color:var(--text-light); background:#f1f5f9;
    border-radius:var(--radio); padding:0.6rem 0.9rem; line-height:1.6;
}
.contrib-abrev-wrap { margin-top:auto; border-top:1px solid #e2e8f0; padding-top:0.7rem; }
.contrib-abrev-title {
    font-size:0.75rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--text-light); cursor:pointer; list-style:none;
}
.contrib-abrev-title::-webkit-details-marker { display:none; }
.contrib-abrev-title::before { content:'▸ '; font-size:0.7rem; }
details[open] .contrib-abrev-title::before { content:'▾ '; }
.contrib-abrev-code {
    display:block; margin-top:0.4rem; font-size:0.75rem; color:var(--pri);
    word-break:break-all; background:#f8fafc; padding:0.4rem 0.7rem;
    border-radius:4px; line-height:1.6; font-family:monospace;
}
.extra-block {
    background:var(--card-bg); border-radius:var(--radio); padding:1.5rem;
    border:1px solid #e2e8f0; border-left:3px solid var(--pri);
}
.extra-item { margin-bottom:0.7rem; }
.extra-item:last-child { margin-bottom:0; }
.extra-subtitulo {
    font-size:0.82rem; font-weight:700; color:var(--pri);
    margin-bottom:0.2rem; text-transform:uppercase; letter-spacing:0.06em;
}
.extra-texto { font-size:0.92rem; color:var(--text); line-height:1.65; }
.extra-texto a { color:var(--pri); font-weight:600; text-decoration:none; }
.extra-texto a:hover { text-decoration:underline; }

/* ── Temáticas ───────────────────────────────────────────────── */
.tem-section { background:var(--bg); }
.tem-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1.2rem; margin-top:1.2rem; }
.tem-card {
    background:var(--card-bg); border-radius:var(--radio);
    border:1px solid #e2e8f0; overflow:hidden;
    display:flex; flex-direction:column; border-top:3px solid var(--sec);
}
.tem-img-wrap { width:100%; height:140px; overflow:hidden; }
.tem-img-wrap img { width:100%; height:100%; object-fit:cover; }
.tem-body { padding:1.2rem; display:flex; flex-direction:column; gap:0.6rem; flex:1; }
.tem-header { display:flex; align-items:flex-start; gap:0.6rem; }
.tem-cod {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:38px; height:38px; background:var(--pri); color:#fff;
    font-size:0.85rem; font-weight:700; border-radius:var(--radio);
    padding:0 0.3rem; flex-shrink:0;
}
.tem-titulo { font-size:0.98rem; font-weight:600; color:var(--text); line-height:1.3; }
.tem-desc { font-size:0.88rem; color:var(--text-light); line-height:1.7; }
.tem-resps {
    border-top:1px solid #e2e8f0; padding-top:0.7rem;
    margin-top:auto; display:flex; flex-direction:column; gap:0.4rem;
}
.tem-resps-title {
    font-size:0.68rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--pri); margin-bottom:0.15rem;
}
.tem-resp-item { display:flex; flex-direction:column; gap:0; }
.tem-resp-top { display:flex; align-items:flex-start; gap:0.5rem; }
.tem-avatar {
    flex-shrink:0; width:48px; height:48px; aspect-ratio:1/1;
    border-radius:var(--radio); overflow:hidden; background:var(--pri-light);
    display:flex; align-items:center; justify-content:center;
}
.tem-avatar img { width:100%; height:100%; object-fit:cover; object-position:top center; }
.tem-avatar-ini { font-size:0.88rem; font-weight:700; color:var(--pri); }
.tem-resp-nombretext {
    display:flex; flex-direction:column; gap:0.1rem; flex:1; min-width:0; padding-top:0.1rem;
}
.tem-resp-nombre { font-size:0.8rem; font-weight:600; color:var(--text); flex:1; }
.tem-resp-info { font-size:0.7rem; color:var(--text-light); line-height:1.3; }
.tem-toggle {
    background:none; border:none; cursor:pointer; padding:0.1rem 0.3rem;
    color:var(--pri); font-size:0.62rem; line-height:1; flex-shrink:0; margin-top:0.15rem;
}
.tem-toggle-arrow { display:inline-block; transition:transform 0.2s; }
.tem-detalle { max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
.tem-detalle.open { max-height:400px; }
.tem-detalle-inner {
    padding:0.5rem 0 0.3rem 2.2rem; display:flex; flex-direction:column; gap:0.25rem;
}
.tem-det-inst { font-size:0.76rem; color:var(--text-light); }
.tem-det-pais { font-size:0.73rem; color:var(--text-light); }
.tem-det-resena { font-size:0.76rem; color:var(--text); line-height:1.6; }
.tem-resp-missing { font-size:0.76rem; color:#c00; font-style:italic; }

/* ── Menú sticky ─────────────────────────────────────────────── */

}

.conf-mini-foto { width:100%; aspect-ratio:4/3; object-fit:cover; object-position:top; display:block; }

/* ── Fechas / Banner countdown ──────────────────────────────── */
.fecha-banner-wrap { background:var(--bg); padding:1.2rem 0 0; }

}

.fecha-dia { font-size:2rem; font-weight:700; color:var(--pri); line-height:1; }
.fecha-mes { font-size:0.82rem; color:var(--text-light); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; }
.fecha-etiqueta { font-size:0.82rem; color:var(--text); font-weight:600; }

.countdown-unit {

}
.countdown-val { font-size:1.3rem; font-weight:700; line-height:1; }

.fecha-links { display:flex; flex-direction:column; gap:0.4rem; }
.fecha-link-btn {

}

    background:#e8792a; color:#fff; font-weight:700; border-color:#e8792a;

}

@keyframes fecha-pulse {
  0%, 100% { box-shadow:0 0 0 0 rgba(232,121,42,0.35); }
  50%      { box-shadow:0 0 0 6px rgba(232,121,42,0); }
}
.fecha-vencido { font-size:0.95rem; font-weight:700; color:var(--sec); }

/* ── Fechas (timeline) ───────────────────────────────────────── */
.tl-wrap { position:relative; max-width:860px; margin:0 auto; padding:1rem 0; }
.tl-wrap::before {
    content:''; position:absolute; left:50%; top:0; bottom:0; width:2px;
    background:linear-gradient(to bottom, var(--pri) 85%, transparent 100%);
    transform:translateX(-50%); z-index:1;
}
.tl-item { display:flex; width:50%; padding:0 2.5rem 2rem 0; position:relative; box-sizing:border-box; }
.tl-item.right { margin-left:50%; padding:0 0 2rem 2.5rem; }
.tl-item::before {
    content:''; position:absolute; right:-7px; top:1rem;
    width:13px; height:13px; border-radius:50%;
    background:var(--pri); border:2px solid var(--sec); z-index:1;
}
.tl-item.right::before { right:auto; left:-7px; }
.tl-content {
    background:var(--card-bg); border-radius:var(--radio); padding:1.2rem 1.4rem;
    border:1px solid #e2e8f0; border-top:3px solid var(--sec); width:100%;
}
.tl-fecha { font-size:0.82rem; font-weight:700; color:#c0392b; margin-bottom:0.25rem; }
.tl-fecha-tachada { text-decoration:line-through; color:#bbb !important; font-size:0.78rem; margin-bottom:0.1rem; }
.tl-titulo { font-size:1rem; font-weight:600; color:var(--pri); margin-bottom:0.4rem; }
.tl-texto { font-size:0.88rem; color:var(--text); line-height:1.6; margin-bottom:0.4rem; }
.tl-texto a { color:var(--pri); font-weight:600; text-decoration:none; }
.tl-texto a:hover { text-decoration:underline; }
.tl-countdown { margin:0.5rem 0; }
.countdown { display:flex; align-items:center; gap:0.25rem; flex-wrap:wrap; }
.cd-box {
    display:flex; flex-direction:column; align-items:center;
    background:#f1f5f9; border:1px solid #e2e8f0;
    border-radius:6px; padding:0.3rem 0.5rem; min-width:40px;
}
.cd-num { font-size:1.1rem; font-weight:700; line-height:1; color:var(--pri); }
.cd-lbl { font-size:0.55rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-light); margin-top:0.1rem; }
.cd-sep { font-size:1rem; font-weight:700; color:#cbd5e1; margin-bottom:0.6rem; }
.gcal-btn {
    display:inline-flex; align-items:center; gap:0.4rem; margin-top:0.4rem;
    font-size:0.76rem; font-weight:600; color:#1a73e8;
    background:#e8f0fe; border:1px solid #c5d3f0;
    border-radius:6px; padding:0.3em 0.7em; text-decoration:none;
}
.gcal-btn:hover { background:#d2e3fc; }
.tl-item[data-vencida='true'] .tl-content { background:#f8fafc; border-top-color:#e2e8f0; }
.tl-item[data-vencida='true'] .tl-fecha { color:#94a3b8; }
.tl-item[data-vencida='true'] .tl-titulo { color:#94a3b8; }
.tl-item[data-vencida='true']::before { background:#cbd5e1; border-color:#e2e8f0; }
.tl-extra { max-height:0; overflow:hidden; transition:max-height 0.35s ease; }
.tl-extra.open { max-height:600px; }
.tl-toggle-btn {
    background:none; border:none; cursor:pointer; font-size:0.76rem;
    font-weight:600; color:var(--pri); padding:0.25rem 0;
    margin-top:0.2rem; text-decoration:underline; display:block;
}
.tl-item[data-vencida='true'] .tl-toggle-btn { color:#94a3b8; }
@media(max-width:700px) {
    .tl-wrap::before { left:16px; }
    .tl-item,.tl-item.right { width:100%; margin-left:0; padding:0 0 1.2rem 2.5rem; }
    .tl-item::before,.tl-item.right::before { left:9px; right:auto; }
}

/* ── Inscripción (nuevo — subpáginas) ───────────────────────── */
.insc-tabla-wrap { overflow-x:auto; margin:1.5rem 0 0.8rem; }
.insc-tabla { width:100%; border-collapse:collapse; font-size:0.88rem; }
.insc-tabla th { background:var(--pri); color:#fff; padding:0.6rem 0.75rem; text-align:left; font-weight:700; }
.insc-fecha-th { font-weight:400; font-size:0.7rem; opacity:0.85; }
.insc-tabla td { padding:0.6rem 0.75rem; border-bottom:1px solid #e2e8f0; }
.insc-tabla tbody tr:nth-child(even) { background:#f8fafc; }
.insc-categoria { font-weight:700; color:var(--pri); }
.insc-asterisco { color:var(--sec); }
.insc-nota-descuento { font-size:0.8rem; color:var(--pri); margin-top:0.3rem; }
.insc-nota-respaldo { font-size:0.78rem; color:var(--text-light); margin-bottom:0.5rem; }
.insc-box-pago { margin-top:1.5rem; }
.insc-box-becas { margin-top:1rem; }
.insc-cuentas-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin-top:1rem; }
.insc-cuenta-card {
    background:var(--card-bg); border:1px solid #e2e8f0; border-top:3px solid var(--sec);
    border-radius:var(--radio); padding:1.1rem 1.3rem;
}
.insc-cuenta-titulo { font-size:0.92rem; font-weight:700; color:var(--pri); margin-bottom:0.6rem; }
.insc-cuenta-item { display:flex; justify-content:space-between; gap:1rem; padding:0.35rem 0; border-bottom:1px solid #f1f5f9; font-size:0.85rem; }
.insc-cuenta-item:last-child { border-bottom:none; }
.insc-cuenta-label { color:var(--text-light); font-weight:600; flex-shrink:0; }
.insc-cuenta-valor { color:var(--text); text-align:right; }

/* ── Tarjeta de miembro (nuevo — subpáginas) ────────────────── */
.member-card {
    display:flex; gap:1rem; align-items:flex-start;
    background:var(--card-bg); border-radius:var(--radio);
    border:1px solid #e2e8f0; border-left:3px solid var(--sec);

}
.member-foto { width:56px; height:56px; border-radius:var(--radio); object-fit:cover; flex-shrink:0; }

    width:56px; height:56px; border-radius:var(--radio); flex-shrink:0;

}

}
.member-titulo { font-size:0.85rem; font-style:italic; color:var(--text-light); margin-bottom:0.15rem; }
.member-nombre { font-weight:600; color:var(--text); font-size:0.95rem; line-height:1.3; }
.member-inst { font-size:0.8rem; color:var(--text-light); margin-top:0.15rem; }
.member-toggle {

}
.member-toggle:hover { text-decoration:underline; }
.member-detalle { display:none; margin-top:0.7rem; border-top:1px solid #e2e8f0; padding-top:0.7rem; }
.member-detalle.abierto { display:block; }
.member-ciudad { font-size:0.8rem; color:var(--text-light); margin-bottom:0.35rem; }
.member-bio { font-size:0.85rem; color:var(--text); line-height:1.65; margin-bottom:0.4rem; }
.member-links { display:flex; gap:0.4rem; flex-wrap:wrap; }
.member-link {
    font-size:0.72rem; font-weight:700; padding:0.15em 0.55em;
    border-radius:4px; text-decoration:none;

}
.member-link:hover { background:var(--pri); color:#fff; }

/* ── Panel (miembros secundarios) ───────────────────────────── */
.panel-miembros {
    display:flex; flex-wrap:wrap; gap:0.7rem; margin-top:0.8rem;
    padding-top:0.8rem; border-top:1px solid #e2e8f0;
}
.panel-item { display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; color:var(--text); }
.panel-foto { width:36px; height:36px; border-radius:6px; object-fit:cover; }
.panel-iniciales {
    width:36px; height:36px; border-radius:6px;
    background:var(--pri-light); color:var(--pri);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:0.75rem;
}

/* ── Programa: horario (grid, nuevo — subpáginas) ───────────── */
.programa-wrap .legend { margin-bottom:0.5rem; }
.programa-wrap .legend span {
    display:inline-flex; align-items:center; padding:2px 10px;
    border-radius:4px; font-size:0.82rem; margin-right:6px; margin-bottom:4px;
}
.programa-wrap .jumper { margin-bottom:1.2rem; }
.programa-wrap .schedule-scroll { overflow-x:auto; padding-bottom:8px; }
.programa-wrap .schedule { display:grid; gap:4px; position:relative; min-width:700px; }
.programa-wrap .time-slot {
    grid-column:times; font-size:0.78rem; color:var(--text-light);
    text-align:right; padding-right:8px; align-self:start;
}
.programa-wrap .day-slot {
    font-weight:700; text-align:center; padding:0.6rem 0;
    border-bottom:2px solid var(--pri); position:sticky; top:0; background:var(--card-bg);
}
.programa-wrap .session { border-radius:6px; padding:6px 8px; overflow:hidden; font-size:0.83rem; }
.programa-wrap .session-title { font-size:0.88rem; margin:2px 0; }
.programa-wrap .session-time { font-size:0.73rem; opacity:0.9; }
.programa-wrap .location-badge {
    display:inline-block; background:rgba(255,255,255,0.25);
    border-radius:4px; padding:0 4px; font-size:0.68rem; margin-right:3px;
}
.programa-vacio { text-align:center; color:var(--text-light); padding:2rem 0; }

/* ── Reveal ──────────────────────────────────────────────────── */
.reveal { opacity:0; transform:translateY(20px); transition:opacity 0.6s ease,transform 0.6s ease; }
.reveal.visible { opacity:1; transform:translateY(0); }

/* ── Responsive general ──────────────────────────────────────── */
@media(max-width:768px) {
    .hero-numero { font-size:4rem; }
    .section { padding:2.5rem 0; }
    .container { padding:0 1rem; }
    .hero-meta-bar .container { grid-template-columns:repeat(2,1fr); }
    .cards-fichas-grid { grid-template-columns:repeat(2,1fr); }
    .card-ficha { border-right:none; border-bottom:1px solid #e2e8f0; }
    .card-ficha:last-child { border-bottom:none; }
    .comite-nav-inner { gap:0; padding:0 1rem; }
    .comite-nav a { padding:0.7rem 0.8rem; font-size:0.7rem; }
    .member-card { flex-direction:column; align-items:center; text-align:center; }
    .member-links { justify-content:center; }
    .panel-miembros { justify-content:center; }
}


</style>
</head>
<body>
<p class="programa-vacio">Programa próximamente.</p>
<script>
/* Reveal on scroll */
const _revealObs = new IntersectionObserver(
    es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add("visible"); }),
    { threshold:0, rootMargin:"0px 0px -50px 0px" }
);
document.querySelectorAll(".reveal").forEach(el => _revealObs.observe(el));

/* Altura dinámica para iframe (cuando se embebe en sochiem.cl) */
function _sendHeight() {
    parent.postMessage({ type:"resize", height: document.body.scrollHeight }, "*");
}
window.addEventListener("load", _sendHeight);
window.addEventListener("resize", _sendHeight);

/* Re-reportar altura cuando el DOM cambia (toggles, acordeones, subpáginas, etc.) */
if (window.self !== window.top) {
    var _resizeTimer;
    new MutationObserver(function() {
        clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(_sendHeight, 350);
    }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ["class"] });
}
</script>
